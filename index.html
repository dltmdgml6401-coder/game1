<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOPAMINE POKER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <h1>DOPAMINE POKER</h1>
    <div class="hud">
        <div class="target-box">목표 점수: <span id="target-score">1,000</span></div>
        <div class="score-box">현재 점수: <span id="current-score">0</span></div>
        <div>남은 횟수: <span id="plays-left">4</span></div>
        <div>버리기: <span id="discards-left">3</span></div>
    </div>

    <div id="dopamine-pop"></div>

    <div class="card-area" id="hand-area"></div>

    <div class="btn-group">
        <button class="btn-play" id="play-btn">족보 제출 (PLAY)</button>
        <button class="btn-discard" id="discard-btn">카드 버리기 (DISCARD)</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
