<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당신이 판사라면? - 1인칭 법정 양형 게임</title>
  <style>
    :root {
      --gold: #d4af37;
      --panel-bg: rgba(15, 10, 6, 0.94);
      --prosecutor-accent: #2b4c7e;
      --defense-accent: #2e7d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #050505;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 16:9 가로 비율 게임 프레임 */
    .game-window {
      width: 960px;
      height: 540px;
      border: 3px solid var(--gold);
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      overflow: hidden;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.75)),
                  url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
    }

    /* 상단 상태바 */
    .top-bar {
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 25px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold);
      font-size: 0.95em;
      font-weight: bold;
    }

    /* 법정 캐릭터 무대 */
    .stage {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 80px 10px 80px;
      position: relative;
    }
    .character-box {
      text-align: center;
      transition: all 0.3s ease;
      opacity: 0.3;
      transform: scale(0.88);
    }
    .character-box.active {
      opacity: 1;
      transform: scale(1.05);
    }
    .avatar {
      width: 135px;
      height: 135px;
      border-radius: 50%;
      border: 3px solid #fff;
      margin-bottom: 8px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
    }
    .prosecutor-avatar {
      background-image: url('https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=400&q=80');
      border-color: #4a90e2;
    }
    .defense-avatar {
      background-image: url('https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80');
      border-color: #66bb6a;
    }
    .char-name {
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 0.85em;
      display: inline-block;
    }
    .prosecutor-name { background: var(--prosecutor-accent); }
    .defense-name { background: var(--defense-accent); }

    /* 대화창 */
    .dialogue-box {
      height: 165px;
      background: var(--panel-bg);
      border-top: 2px solid var(--gold);
      padding: 16px 25px;
      position: relative;
    }
    .speaker-tag {
      color: var(--gold);
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 6px;
    }
    .dialogue-text {
      font-size: 0.98em;
      line-height: 1.55;
      color: #eeeeee;
    }
    .next-btn {
      position: absolute;
      right: 25px;
      bottom: 18px;
      padding: 9px 24px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 선고 UI 패널 */
    .verdict-overlay {
      display: none;
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 205px;
      background: rgba(10, 5, 2, 0.97);
      border-top: 3px solid var(--gold);
      padding: 18px;
      text-align: center;
    }
    .slider-val {
      font-size: 1.65em;
      color: #ff5252;
      font-weight: bold;
      margin: 8px 0;
    }
    input[type=range] { width: 75%; }
    .gavel-btn {
      margin-top: 10px;
      padding: 10px 28px;
      background: #8b0000;
      color: #fff;
      border: 2px solid var(--gold);
      border-radius: 20px;
      font-size: 1.05em;
      font-weight: bold;
      cursor: pointer;
    }

    /* 판결 결과 모달 */
    .result-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      background: rgba(18, 18, 18, 0.98);
      border: 2px solid var(--gold);
      padding: 22px;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0,0,0,0.95);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="game-window">
  <div class="top-bar">
    <span>🏛️ 대한민국 법원 - 제1형사합의부 (판사석 View)</span>
    <span>사건 <span id="case-num">1</span> / 8</span>
  </div>

  <div class="stage">
    <div id="prosecutor-box" class="character-box">
      <div class="avatar prosecutor-avatar"></div>
      <div class="char-name prosecutor-name">박검사</div>
    </div>
    <div id="defense-box" class="character-box">
      <div class="avatar defense-avatar"></div>
      <div class="char-name defense-name">김변호사</div>
    </div>
  </div>

  <div class="dialogue-box">
    <div id="speaker-tag" class="speaker-tag">사건 개요</div>
    <div id="dialogue-text" class="dialogue-text">사건을 심리 중입니다...</div>
    <button id="next-btn" class="next-btn" onclick="nextDialogue()">다음 ▶</button>
  </div>

  <div id="verdict-overlay" class="verdict-overlay">
    <div style="color: var(--gold); font-weight: bold;">[판사석] 피고인에 대한 최종 형량을 선고하십시오.</div>
    <div class="slider-val"><span id="sentence-text">12</span></div>
    <input type="range" id="sentence-slider" min="0" max="180" value="12" oninput="updateSentenceText(this.value)">
    <br>
    <button class="gavel-btn" onclick="submitVerdict()">🔨 탕! 탕! 탕! (주문 선고)</button>
  </div>

  <div id="result-modal" class="result-modal">
    <h2 style="color: var(--gold); margin-top: 0;">📜 최종 판결 결과</h2>
    <p><strong>실제 법원 최종 선고:</strong> <span id="actual-verdict" style="color: #ff5252; font-weight: bold;"></span></p>
    <p><strong>양형 적합도 점수:</strong> <span id="score-val" style="color: #4fabff; font-size: 1.3em; font-weight: bold;">0</span> / 100점</p>
    <p id="reason-text" style="font-size: 0.88em; line-height: 1.5; color: #ccc; text-align: left; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 4px; border-left: 3px solid var(--gold);"></p>
    <button onclick="continueNextCase()" style="padding: 10px 25px; background: #2b4c7e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">다음 사건 심리하기</button>
  </div>
</div>

<script>
  const gameData = [
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 1: 피고인은 자신의 집에 무단 침입한 도둑을 제압하는 과정에서 빨래건조대와 벨트로 수차례 폭행하여 뇌사 상태에 빠뜨렸습니다.", activeChar: null },
        { speaker: "박검사", text: "아무리 절도범이라도 이미 제압된 상태에서 도구를 사용해 뇌사에 이르게 한 것은 정당방위의 한계를 크게 벗어난 과잉방위입니다! 징역 3년을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "야간에 집안에 침입한 도둑을 보고 극심한 공포를 느낀 상태에서 일어난 정당한 방위 행위였습니다! 무죄를 선고해 주십시오.", activeChar: "defense" },
        { speaker: "판사 (나)", text: "양측 진술을 확인했습니다. 판사석에서 형량을 결정해 주문을 선고하십시오.", activeChar: null }
      ],
      actualMonths: 18,
      actualText: "징역 1년 6개월 (실형)",
      reason: "방위의 정도를 크게 넘어선 '과잉방위'로 인정되어 징역 1년 6개월 실형이 선고되었습니다 (이후 도둑 사망으로 상해치사죄 인정)."
    },
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 2: 피고인은 과거 56년 전 자신을 성폭행하려던 남성의 혀를 깨물어 절단했습니다. 가해 남성은 피고인을 중상해죄로 고소했습니다.", activeChar: null },
        { speaker: "박검사", text: "성폭행 시도가 있었더라도 혀를 절단하여 신체에 영구적 장애를 입힌 행위는 정당방위 범위를 벗어난 중상해죄입니다. 징역 1년 6개월을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "자신의 정조와 신체를 지키기 위한 불가피한 정당방위였습니다. 무죄를 선고해 주십시오!", activeChar: "defense" },
        { speaker: "판사 (나)", text: "양형을 선고하십시오.", activeChar: null }
      ],
      actualMonths: 0,
      actualText: "무죄 (0개월) / 56년 만의 재심",
      reason: "당시에는 징역 10개월(집행유예 2년)이 선고되었으나, 56년 만에 열린 재심(2021년)에서 위급 상황에서의 정당방위가 인정되어 최종 무죄가 선고되었습니다."
    },
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 3: 피고인은 바람을 피운 남편에게 복수하기 위해 남편이 자는 동안 성기를 절단하고 손가락까지 절단했습니다.", activeChar: null },
        { speaker: "박검사", text: "잔혹한 수법으로 피해자에게 평생 돌이킬 수 없는 신체적·정신적 장애를 입혔습니다! 특수상해죄로 징역 10년을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "수년간 계속된 남편의 상습 폭행과 외도로 극심한 우울증을 겪던 중 저지른 우발적 범행입니다. 선처를 부탁드립니다.", activeChar: "defense" },
        { speaker: "판사 (나)", text: "형량을 결정하십시오.", activeChar: null }
      ],
      actualMonths: 48,
      actualText: "징역 4년 (실형)",
      reason: "범행 수법이 매우 잔혹하나, 남편이 오랜 기간 가정폭력을 행사한 사정 및 남편이 처벌을 원치 않은 점이 참작되어 징역 4년이 선고되었습니다."
    },
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 4: 피고인은 자신의 모텔 방에 무단 들어온 만취 여성을 침대에 눕혀두고 퇴실했습니다. 이후 그 여성은 의식 불명 상태로 발견되어 사망했습니다.", activeChar: null },
        { speaker: "박검사", text: "만취한 피해자를 위험한 상태에 방치하고 떠나 사망에 이르게 했습니다. 유기치사죄로 징역 5년을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "피고인과 사망자 사이에는 구호 의무가 발생하는 법률적 관계가 없었습니다. 유기죄 성립 요건이 되지 않습니다!", activeChar: "defense" },
        { speaker: "판사 (나)", text: "양형을 결정해 선고하십시오.", activeChar: null }
      ],
      actualMonths: 0,
      actualText: "무죄 (0개월)",
      reason: "단순히 모텔에 같이 들어간 사정만으로는 보호 의무가 인정되지 않아 유기치사죄에 대해 무죄가 선고되었습니다."
    },
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 5: 피고인은 도로에서 고양이를 피하려다 급정거했고, 뒤따라오던 오토바이가 추돌하여 운전자가 사망했습니다.", activeChar: null },
        { speaker: "박검사", text: "동물을 피하기 위해 갑자기 급제동을 하여 뒤따르던 운전자를 사망에 이르게 한 과실이 큽니다. 징역 1년 6개월을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "돌발 상황에서 본능적으로 브레이크를 밟은 것이며, 안전거리를 확보하지 않은 뒤 차의 과실이 더 큽니다!", activeChar: "defense" },
        { speaker: "판사 (나)", text: "선고를 내리십시오.", activeChar: null }
      ],
      actualMonths: 0,
      actualText: "무죄 (0개월)",
      reason: "돌발적인 장애물 등장 시 급제동한 것은 운전자의 불가피한 반응으로 인정되어 교통사고처리특례법 위반 무죄가 선고되었습니다."
    },
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 6: 피고인은 술에 취해 길가에 켜져 있던 촛불을 끄기 위해 침을 뱉었다가 옆에 있던 경찰관의 얼굴에 침이 맞았습니다.", activeChar: null },
        { speaker: "박검사", text: "정당한 공무를 집행 중인 경찰관에게 침을 뱉어 모욕하고 위해를 가했습니다. 공무집행방해죄로 징역 8개월을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "촛불을 끄려던 중 고의성 없이 고개를 돌리다 침이 튄 것뿐입니다. 경찰관을 해할 고의가 없었습니다.", activeChar: "defense" },
        { speaker: "판사 (나)", text: "양형을 선고하십시오.", activeChar: null }
      ],
      actualMonths: 0,
      actualText: "무죄 (0개월)",
      reason: "경찰관을 향해 의도적으로 침을 뱉었다는 신빙성이 부족하고, 폭행의 고의가 인정되지 않아 무죄가 선고되었습니다."
    },
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 7: 피고인은 중환자실에서 투병 중인 말기 암 환자 아버지를 바라보다 괴로움을 견디지 못하고 산소마스크를 벗겨 사망하게 했습니다.", activeChar: null },
        { speaker: "박검사", text: "아무리 병간호가 힘들었더라도 인륜을 저버리고 직계존속의 생명을 끊었습니다. 존속살해죄로 징역 7년을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "고통스러워하는 아버지를 차마 볼 수 없었던 간병 살인이었습니다. 극심한 경제적 고통과 정신적 중압감을 참작해 주십시오.", activeChar: "defense" },
        { speaker: "판사 (나)", text: "양형을 결정하십시오.", activeChar: null }
      ],
      actualMonths: 36,
      actualText: "징역 3년 (실형)",
      reason: "존속살해는 엄벌 대상이나, 장기간 간병에 지쳐 유족들이 처벌을 원치 않는 점 등이 참작되어 작량감경 후 최저 형량인 징역 3년이 선고되었습니다."
    },
    {
      dialogues: [
        { speaker: "사건 개요", text: "사건 8: 피고인은 데이트 폭력을 행사하는 남친을 피해 차를 몰고 달아나던 중, 남친이 보닛 위에 올라탔음에도 500m를 주행하다 떨어뜨려 중상을 입혔습니다.", activeChar: null },
        { speaker: "박검사", text: "보닛 위에 사람이 탄 상태에서 고속 주행하여 떨어뜨린 행위는 중대한 인명 사고를 유발할 수 있는 특수상해죄입니다! 징역 2년을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "폭행을 피해 도망치던 중 남친이 강제로 보닛에 올라탄 것이며, 위협을 느껴 차를 멈출 수 없었던 정당행위였습니다!", activeChar: "defense" },
        { speaker: "판사 (나)", text: "최종 형량을 선고하십시오.", activeChar: null }
      ],
      actualMonths: 0,
      actualText: "무죄 (0개월)",
      reason: "데이트 폭력 피신 과정에서 발생한 긴박한 상황으로, 위급한 상황을 벗어나기 위한 정당행위(긴급피난)로 인정되어 무죄가 선고되었습니다."
    }
  ];

  let currentCaseIdx = 0;
  let currentDialogueIdx = 0;
  let totalScore = 0;

  function loadCase() {
    currentDialogueIdx = 0;
    document.getElementById('case-num').innerText = currentCaseIdx + 1;
    document.getElementById('verdict-overlay').style.display = 'none';
    document.getElementById('result-modal').style.display = 'none';
    showDialogue();
  }

  function showDialogue() {
    const caseData = gameData[currentCaseIdx];
    const dialogue = caseData.dialogues[currentDialogueIdx];

    document.getElementById('speaker-tag').innerText = dialogue.speaker;
    document.getElementById('dialogue-text').innerText = dialogue.text;

    const pBox = document.getElementById('prosecutor-box');
    const dBox = document.getElementById('defense-box');
    
    pBox.classList.remove('active');
    dBox.classList.remove('active');

    if (dialogue.activeChar === 'prosecutor') pBox.classList.add('active');
    if (dialogue.activeChar === 'defense') dBox.classList.add('active');

    if (currentDialogueIdx === caseData.dialogues.length - 1) {
      document.getElementById('next-btn').innerText = "판결 선고 ▶";
    } else {
      document.getElementById('next-btn').innerText = "다음 ▶";
    }
  }

  function nextDialogue() {
    const caseData = gameData[currentCaseIdx];
    if (currentDialogueIdx < caseData.dialogues.length - 1) {
      currentDialogueIdx++;
      showDialogue();
    } else {
      openVerdictOverlay();
    }
  }

  function openVerdictOverlay() {
    document.getElementById('verdict-overlay').style.display = 'block';
    document.getElementById('sentence-slider').value = 12;
    updateSentenceText(12);
  }

  function updateSentenceText(val) {
    let txt = "";
    if (val == 0) txt = "무죄 / 집행유예 / 벌금형 (0개월)";
    else txt = `징역 ${val}개월 (${Math.floor(val/12)}년 ${val%12}개월)`;
    document.getElementById('sentence-text').innerText = txt;
  }

  function submitVerdict() {
    const userVal = parseInt(document.getElementById('sentence-slider').value);
    const actualVal = gameData[currentCaseIdx].actualMonths;

    const diff = Math.abs(userVal - actualVal);
    let score = Math.max(0, 100 - (diff * 4));
    totalScore += score;

    document.getElementById('actual-verdict').innerText = gameData[currentCaseIdx].actualText;
    document.getElementById('score-val').innerText = score;
    document.getElementById('reason-text').innerText = gameData[currentCaseIdx].reason;

    document.getElementById('verdict-overlay').style.display = 'none';
    document.getElementById('result-modal').style.display = 'block';
  }

  function continueNextCase() {
    currentCaseIdx++;
    if (currentCaseIdx < gameData.length) {
      loadCase();
    } else {
      alert(`모든 판례 재판이 종료되었습니다! 총점: ${totalScore}점 / 800점 만점`);
      currentCaseIdx = 0;
      totalScore = 0;
      loadCase();
    }
  }

  loadCase();
</script>

</body>
</html>
