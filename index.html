<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Poker Augment</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#243047 0%,#101522 48%,#080b12 100%);
    color:#fff;
    font-family:Arial,"Noto Sans KR",sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

#game{
    width:100%;
    max-width:1450px;
    min-height:100vh;
    margin:auto;
    padding:22px;
    position:relative;
}

/* ================= HEADER ================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:rgba(10,14,25,.8);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    backdrop-filter:blur(12px);
    margin-bottom:18px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.stage{
    font-size:18px;
    font-weight:800;
}

.stage span{
    color:#ffd95a;
}

/* ================= STATUS ================= */

.status{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

.statusBox{
    padding:8px 13px;
    border-radius:10px;
    background:#171e2d;
    border:1px solid rgba(255,255,255,.08);
    font-size:14px;
}

.timer{
    color:#62e5ff;
    font-weight:900;
}

.timer.danger{
    color:#ff5353;
    animation:pulse .5s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

/* ================= LAYOUT ================= */

.main{
    display:grid;
    grid-template-columns:1fr 280px;
    gap:18px;
}

.board{
    min-width:0;
}

.side{
    background:rgba(11,16,27,.82);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:18px;
    height:max-content;
}

/* ================= AI ================= */

.enemyArea{
    background:rgba(9,14,24,.75);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
}

.enemyTitle{
    display:flex;
    justify-content:space-between;
    margin-bottom:14px;
}

.enemyName{
    font-size:18px;
    font-weight:900;
}

.enemyMood{
    color:#ff7784;
    font-size:14px;
}

.cards{
    display:flex;
    justify-content:center;
    gap:10px;
    min-height:150px;
    flex-wrap:wrap;
}

/* ================= CARD ================= */

.card{
    width:100px;
    height:140px;
    background:#fff;
    color:#111;
    border-radius:12px;
    border:3px solid #fff;
    box-shadow:0 10px 22px rgba(0,0,0,.35);
    position:relative;
    cursor:pointer;
    user-select:none;
    transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 18px 30px rgba(0,0,0,.45);
}

.card.selected{
    transform:translateY(-22px);
    border-color:#ffd84d;
    box-shadow:
        0 0 0 3px rgba(255,216,77,.35),
        0 20px 35px rgba(0,0,0,.55);
}

.card.red{
    color:#e33d4f;
}

.card.black{
    color:#111;
}

.rank{
    position:absolute;
    left:10px;
    top:7px;
    font-size:25px;
    font-weight:900;
}

.suit{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
}

.card .bottom{
    position:absolute;
    right:9px;

    font-size:21px;
    transform:rotate(180deg);
    font-weight:900;
}

.back{
    background:
        repeating-linear-gradient(
            45deg,
            #283b68,
            #283b68 7px,
            #172744 7px,
            #172744 14px
        );
    border-color:#8095c7;
}

.back:after{
    content:"♠";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:45px;
}

/* ================= PLAYER ================= */

.playerArea{
    background:rgba(9,14,24,.75);

    padding:18px;
}

.playerTitle{

.btn:hover{

/* ================= TOAST ================= */

#toast{
    position:fixed;

    top:80px;

    background:#101827;

    padding:12px 20px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:300;
    font-weight:800;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= EFFECT ================= */

.flash{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0;
    z-index:200;
}

.flash.show{
    animation:flash .65s ease;
}

@keyframes flash{
    0%{opacity:0}
    25%{opacity:.35}

}

#particleLayer{

}

.particle{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ffd84d;
    animation:particle 900ms ease-out forwards;
}

@keyframes particle{
    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }
    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);
        opacity:0;
    }
}

    }

        grid-template-columns:1fr;
    }
}

<script>

/* =========================================================
   GAME STATE
========================================================= */

const state = {

    stage:1,

    maxStage:8,

    deck:[],

    hand:[],

    enemyHand:[],

    selected:[],

    discards:3,

    maxHand:8,

    startHand:6,

    time:45,

    timer:null,

    gameOver:false,

    roundActive:false,

    augmentMode:false,

    ownedAugments:[],

    usedAugments:[],

    pendingSuitCard:null,

    enemyRevealed:false

};


/* =========================================================
   SUITS / RANKS
========================================================= */

const SUITS = [

    {
        name:"하트",
        symbol:"♥",
        color:"red"
    },

    {
        name:"다이아",
        symbol:"♦",
        color:"red"
    },

    {
        name:"클로버",
        symbol:"♣",
        color:"black"
    },

    {
        name:"스페이드",
        symbol:"♠",
        color:"black"
    }

];


const RANKS = [

    {name:"2",value:2},
    {name:"3",value:3},
    {name:"4",value:4},
    {name:"5",value:5},
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}

];


/* =========================================================
   AUDIO
   브라우저 자동재생 제한 때문에
   첫 클릭 이후 AudioContext 활성화
========================================================= */

let audioCtx=null;

function initAudio(){

    if(!audioCtx){

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();

    }

}


function beep(
    frequency,
    duration=.12,
    type="sine",
    volume=.04
){

    try{

        initAudio();

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type=type;

        osc.frequency.value=
            frequency;

        gain.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+
            duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        osc.stop(
            audioCtx.currentTime+
            duration
        );

    }catch(e){}

}


function playSound(type){

    initAudio();

    if(type==="click"){

        beep(500,.06);

    }

    if(type==="draw"){

        beep(350,.07);
        setTimeout(
            ()=>beep(520,.08),
            70
        );

    }

    if(type==="submit"){

        beep(450,.08);
        setTimeout(
            ()=>beep(700,.15),
            90
        );

    }

    if(type==="augment"){

        beep(420,.08,"triangle");
        setTimeout(
            ()=>beep(620,.1,"triangle"),
            90
        );
        setTimeout(
            ()=>beep(920,.18,"triangle"),
            190
        );

    }

    if(type==="win"){

        [523,659,784,1046].forEach(
            (f,i)=>{
                setTimeout(
                    ()=>beep(
                        f,
                        .2,
                        "triangle",
                        .06
                    ),
                    i*100
                );
            }
        );

    }

    if(type==="lose"){

        beep(220,.25,"sawtooth",.05);

        setTimeout(
            ()=>beep(160,.35,"sawtooth",.04),
            220
        );

    }

}


/* =========================================================
   DECK
========================================================= */

function createDeck(){

    const deck=[];

    for(let suit=0;suit<4;suit++){

        for(let rank=2;rank<=14;rank++){

            deck.push({

                suit,
                rank,

                /*
                   기본 덱 카드
                */

                augmented:false,

                id:`normal-${suit}-${rank}`

            });

        }

    }

    return shuffle(deck);

}


function shuffle(arr){

    const a=[...arr];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [a[i],a[j]]=
        [a[j],a[i]];

    }

    return a;

}


/* =========================================================
   기본 드로우
   실제 52장 덱에서만
========================================================= */

function drawNormalCard(){

    if(state.deck.length===0){

        return null;

    }

    return state.deck.pop();

}


/* =========================================================
   증강 카드
   중복 허용
========================================================= */

function createAugmentedCard(
    suit,
    rank
){

    return {

        suit,
        rank,

        augmented:true,

        /*
           같은 카드가 여러 장이어도
           각각 다른 객체
        */

        id:
            `augment-${Date.now()}-${Math.random()}`

    };

}


/* =========================================================
   카드 드로우
========================================================= */

function drawCards(amount){

    let drawn=0;

    for(let i=0;i<amount;i++){

        if(
            state.hand.length>=
            state.maxHand
        ){

            break;

        }

        const card=
            drawNormalCard();

        if(!card)
            break;

        state.hand.push(card);

        drawn++;

    }

    sortHand();

const HAND_RANK={

    HIGH_CARD:0,
    ONE_PAIR:1,
    TWO_PAIR:2,
    THREE_KIND:3,
    STRAIGHT:4,
    FLUSH:5,
    FULL_HOUSE:6,
    FOUR_KIND:7,
    STRAIGHT_FLUSH:8

};


const HAND_NAMES=[

    "하이카드",
    "원페어",
    "투페어",
    "트리플",
    "스트레이트",
    "플러시",
    "풀하우스",
    "포카드",
    "스트레이트 플러시"

];


/* =========================================================
   정확한 5장 족보 판정
========================================================= */

function evaluateFive(cards){

    const sorted=
        [...cards]
        .sort(
            (a,b)=>b.rank-a.rank
        );

    const values=
        sorted.map(
            c=>c.rank
        );

    const counts={};

    values.forEach(
        v=>{
            counts[v]=
                (counts[v]||0)+1;
        }
    );

    const groups=
        Object.entries(counts)
        .map(
            ([value,count])=>({

                value:Number(value),
                count

            })
        )
        .sort(
            (a,b)=>{

                if(
                    a.count!==b.count
                ){

                    return b.count-a.count;

                }

                return b.value-a.value;

            }
        );


    const flush=
        sorted.every(
            c=>
                c.suit===
                sorted[0].suit
        );


    const unique=
        [...new Set(values)]
        .sort(
            (a,b)=>b-a
        );


    let straight=false;
    let straightHigh=0;


    /*
       A2345
    */

    if(
        unique.length===5 &&
        unique.join(",")===
        "14,5,4,3,2"
    ){

        straight=true;
        straightHigh=5;

    }else if(
        unique.length===5
    ){

        let ok=true;

        for(
            let i=1;
            i<unique.length;
            i++
        ){

            if(
                unique[i] !==
                unique[i-1]-1
            ){

                ok=false;
                break;

            }

        }

        if(ok){

            straight=true;
            straightHigh=unique[0];

        }

    }


    if(
        straight &&
        flush
    ){

        return {

            rank:
                HAND_RANK.STRAIGHT_FLUSH,

            name:
                "스트레이트 플러시",

            values:
                [straightHigh],

            cards:sorted

        };

    }


    if(
        groups[0].count===4
    ){

        const quad=
            groups[0].value;

        const kicker=
            groups
            .find(
                g=>g.count===1
            ).value;

        return {

            rank:
                HAND_RANK.FOUR_KIND,

            name:"포카드",

            values:[
                quad,
                kicker
            ],

            cards:sorted

        };

    }


    if(
        groups[0].count===3 &&
        groups[1].count===2
    ){

        return {

            rank:
                HAND_RANK.FULL_HOUSE,

            name:"풀하우스",

            values:[
                groups[0].value,
                groups[1].value
            ],

            cards:sorted

        };

    }


    if(flush){

        return {

            rank:
                HAND_RANK.FLUSH,

            name:"플러시",

            values:values,

            cards:sorted

        };

    }


    if(straight){

        return {

            rank:
                HAND_RANK.STRAIGHT,

            name:"스트레이트",

            values:[
                straightHigh
            ],

            cards:sorted

        };

    }


    if(
        groups[0].count===3
    ){

        const triple=
            groups[0].value;

        const kickers=
            groups
            .filter(
                g=>g.count===1
            )
            .map(
                g=>g.value
            )
            .sort(
                (a,b)=>b-a
            );

        return {

            rank:
                HAND_RANK.THREE_KIND,

            name:"트리플",

            values:[
                triple,
                ...kickers
            ],

            cards:sorted

        };

    }


    const pairs=
        groups
        .filter(
            g=>g.count===2
        )
        .map(
            g=>g.value
        )
        .sort(
            (a,b)=>b-a
        );


    if(pairs.length===2){

        const kicker=
            groups.find(
                g=>g.count===1
            ).value;

        return {

            rank:
                HAND_RANK.TWO_PAIR,

            name:"투페어",

            values:[
                pairs[0],
                pairs[1],
                kicker
            ],

            cards:sorted

        };

    }


    if(pairs.length===1){

        const pair=
            pairs[0];

        const kickers=
            groups
            .filter(
                g=>
                    g.count===1
            )
            .map(
                g=>g.value
            )
            .sort(
                (a,b)=>b-a
            );

        return {

            rank:
                HAND_RANK.ONE_PAIR,

            name:"원페어",

            values:[
                pair,
                ...kickers
            ],

            cards:sorted

        };

    }


    return {

        rank:
            HAND_RANK.HIGH_CARD,

        name:"하이카드",

        values:values,

        cards:sorted

    };

}


/* =========================================================
   6~8장 중 가장 강한 5장
========================================================= */

function bestFiveFromHand(cards){

    if(cards.length<5)
        return null;

    let best=null;

    const combos=
        combinations(
            cards,
            5
        );

    combos.forEach(
        combo=>{

            const result=
                evaluateFive(combo);

            if(
                !best ||
                compareHands(
                    result,
                    best
                )>0
            ){

                best=result;

            }

        }
    );

    return best;

}


function combinations(
    arr,
    size
){

    const result=[];

    function go(
        start,
        current
    ){

        if(
            current.length===
            size
        ){

            result.push(
                [...current]
            );

            return;

        }

        for(
            let i=start;
            i<=
            arr.length-
            (size-current.length);
            i++
        ){

            current.push(
                arr[i]
            );

            go(
                i+1,
                current
            );

            current.pop();

        }

    }

    go(0,[]);

    return result;

}


/* =========================================================
   족보 비교
========================================================= */

function compareHands(a,b){

    if(
        a.rank!==b.rank
    ){

        return a.rank>b.rank
            ?1
            :-1;

    }

    for(
        let i=0;
        i<
        Math.max(
            a.values.length,
            b.values.length
        );
        i++
    ){

        const av=
            a.values[i]||0;

        const bv=
            b.values[i]||0;

        if(av!==bv){

            return av>bv
                ?1
                :-1;

        }

    }

    return 0;

}

function randomAugments(){

        shuffle(available);

    /*
       모든 등급이 라운드와 관계없이

    return shuffled.slice(0,3);

function openWildPicker(){

    const index=
        getOneSelected();

    if(index===null)
        return;

    const value=
        prompt(
            "원하는 카드 입력\n예: K♥ / A♠ / 10♦"
        );

    if(!value)
        return;

    const match=
        value.match(
            /^(10|[2-9JQKA])([♥♦♣♠])$/i
        );

    if(!match){

        showToast(
            "예: K♥ 또는 10♦"
        );

        return;

    }

    const rankText=
        match[1]
        .toUpperCase();

    const suitText=
        match[2];

    const rank=
        RANKS.find(
            r=>
                r.name===rankText
        );

    const suit=
        SUITS.findIndex(
            s=>
                s.symbol===suitText
        );

    if(!rank || suit<0)
        return;

    state.hand[index]=
        createAugmentedCard(
            suit,
            rank.value
        );

    state.selected=[];

    sortHand();
    render();

    showToast(
        `⚡ ${rankText}${suitText} 생성`
    );

}


/* =========================================================
   EXCHANGE
========================================================= */

function exchangeCards(){

    const playerIndex=
        getOneSelected();

    if(playerIndex===null)
        return;

    if(state.enemyHand.length===0)
        return;

    const enemyIndex=
        Math.floor(
            Math.random()*
            state.enemyHand.length
        );

    const playerCard=
        state.hand[playerIndex];

    const enemyCard=
        state.enemyHand[enemyIndex];

    /*
       증강 교환이므로 중복 허용
    */

    state.hand[playerIndex]=
        createAugmentedCard(
            enemyCard.suit,
            enemyCard.rank
        );

    state.enemyHand[enemyIndex]=
        createAugmentedCard(
            playerCard.suit,
            playerCard.rank
        );

    state.selected=[];

    sortHand();
    render();

    showToast(
        "🔄 카드 교환!"
    );

}


/* =========================================================
   TWO CARD SUIT MODE
========================================================= */

document.addEventListener(
    "click",
    function(e){

        if(!state.suitTwoMode)
            return;

        const card=
            e.target.closest(
                ".card"
            );

        if(!card)
            return;

        const index=
            Number(
                card.dataset.index
            );

        if(
            state.selected
            .includes(index)
        ){

            return;

        }

        state.selected.push(index);

        if(
            state.selected.length===2
        ){

            const first=
                state.hand[
                    state.selected[0]
                ];

            const second=
                state.hand[
                    state.selected[1]
                ];

            const suit=
                prompt(
                    "원하는 수트 입력\n♥ ♦ ♣ ♠"
                );

            const suitIndex=
                SUITS.findIndex(
                    s=>
                        s.symbol===suit
                );

            if(suitIndex>=0){

                state.hand[
                    state.selected[0]
                ]=
                    createAugmentedCard(
                        suitIndex,
                        first.rank
                    );

                state.hand[
                    state.selected[1]
                ]=
                    createAugmentedCard(
                        suitIndex,
                        second.rank
                    );

            }

            state.selected=[];
            state.suitTwoMode=false;
            state.forceSameSuit=false;

            sortHand();
            render();

            showToast(
                "⚡ 2장의 수트가 변경되었습니다."
            );

        }

    }
);


/* =========================================================
   ENEMY
========================================================= */

function createEnemyHand(){

    state.enemyHand=[];

    /*
       AI 기본 패도 같은 실제 덱에서
       뽑기 때문에 플레이어와 카드 중복 없음
    */

    for(
        let i=0;
        i<6;
        i++
    ){

        const card=
            drawNormalCard();

        if(card){

            state.enemyHand.push(
                card
            );

        }

    }

}


/* =========================================================
   AI DIFFICULTY
========================================================= */

function enemyTaunt(text){

    const mood=
        document.getElementById(
            "enemyMood"
        );

    mood.textContent=
        `"${text}"`;

    beep(
        240,
        .08,
        "square"
    );

}


function aiTauntByStage(){

    const lines=[

        "운이 좋으시네요.",

        "그 패로 괜찮겠어요?",

        "조금 아쉬운데요.",

        "제가 이길 것 같은데.",

        "손패를 잘못 고르신 것 같은데요.",

        "이 정도면 거의 끝났죠.",

        "여기까지 올라온 건 인정하죠.",

        "마지막까지 버텨보세요."

    ];

    enemyTaunt(
        lines[
            Math.min(
                state.stage-1,
                lines.length-1
            )
        ]
    );

}


/* =========================================================
   ROUND START
========================================================= */

function startRound(){

    clearInterval(
        state.timer
    );

    state.deck=
        createDeck();

    state.hand=[];
    state.enemyHand=[];

    state.selected=[];

    state.discards=3;

    state.time=45;

    state.enemyRevealed=false;

    state.roundActive=true;

    state.suitTwoMode=false;

    /*
       먼저 플레이어 6장
    */

    drawCards(6);

    /*
       그 다음 AI 6장
    */

    createEnemyHand();

    /*
       drawCards()가 render하기 때문에
       AI까지 만든 뒤 다시 render
    */

    render();

    aiTauntByStage();

    startTimer();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(
        state.timer
    );

    updateTimer();

    state.timer=
        setInterval(
            ()=>{

                if(
                    !state.roundActive
                )
                    return;

                state.time--;

                updateTimer();

                if(
                    state.time===10
                ){

                    enemyTaunt(
                        "카드 5장 고르는게 그렇게 어렵나?"
                    );

                }

                if(state.time<=0){

                    clearInterval(
                        state.timer
                    );

                    showToast(
                        "⏰ 시간이 끝났습니다."
                    );

                    state.roundActive=false;

                    setTimeout(
                        ()=>{

                            /*
                               시간 초과는
                               패배 처리
                            */

                            const enemy=
                                bestFiveFromHand(
                                    state.enemyHand
                                );

                            const player=
                                bestFiveFromHand(
                                    state.hand
                                );

                            showResult(
                                player,
                                enemy,
                                -1
                            );

                        },
                        500
                    );

                }

            },
            1000
        );

}


function updateTimer(){

    const el=
        document.getElementById(
            "timerText"
        );

    el.textContent=
        state.time;

    el.parentElement
        .classList.toggle(
            "danger",
            state.time<=10
        );

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    player,
    enemy,
    result
){

    const overlay=
        document.getElementById(
            "resultOverlay"
        );

    const title=
        document.getElementById(
            "resultTitle"
        );

    const compare=
        document.getElementById(
            "compare"
        );

    const reason=
        document.getElementById(
            "reason"
        );

    if(result>0){

        title.textContent=
            "🎉 ROUND WIN";

        playSound("win");

        createParticles(
            window.innerWidth/2,
            window.innerHeight/2,
            50
        );

        flashEffect();

    }else if(result<0){

        title.textContent=
            "💀 ROUND LOSE";

        playSound("lose");

        flashEffect();

    }else{

        title.textContent=
            "🤝 DRAW";

    }


    compare.innerHTML=`

        <div class="resultPanel">

            <h3>👤 PLAYER</h3>

            <div class="miniCards">

                ${
                    player.cards
                    .map(
                        miniCardHTML
                    )
                    .join("")
                }

            </div>

            <div class="resultRank">
                ${player.name}
            </div>

            <div>
                ${formatValues(
                    player.values
                )}
            </div>

        </div>


        <div class="resultPanel">

            <h3>🤖 AI</h3>

            <div class="miniCards">

                ${
                    enemy.cards
                    .map(
                        miniCardHTML
                    )
                    .join("")
                }

            </div>

            <div class="resultRank">
                ${enemy.name}
            </div>

            <div>
                ${formatValues(
                    enemy.values
                )}
            </div>

        </div>

    `;


    if(result>0){

        reason.innerHTML=`
            <b>플레이어 승리!</b><br>
            ${player.name}이(가)
            ${enemy.name}보다 높습니다.
        `;

    }else if(result<0){

        reason.innerHTML=`
            <b>플레이어 패배!</b><br>
            ${enemy.name}이(가)
            ${player.name}보다 높습니다.
        `;

    }else{

        reason.innerHTML=`
            <b>무승부</b><br>
            족보와 모든 비교값이 같습니다.
        `;

    }


    const button=
        document.getElementById(
            "resultButton"
        );

    if(result<0){

        button.textContent=
            "처음부터 다시";

        button.onclick=()=>{

            overlay.style.display=
                "none";

            resetGame();

        };

    }else{

        button.textContent=
            state.stage>=8
                ?"게임 클리어"
                :"다음 라운드";

        button.onclick=()=>{

            overlay.style.display=
                "none";

            if(state.stage>=8){

                gameClear();

            }else{

                state.stage++;

                openAugmentSelection();

            }

        };

    }

    overlay.style.display="flex";

}


function miniCardHTML(card){

    const suit=
        SUITS[card.suit];

    const rank=
        RANKS.find(
            r=>r.value===card.rank
        );

    return `

        <div
            class="
                miniCard
                ${suit.color}
            "
        >

            <div class="miniRank">
                ${rank.name}
            </div>

            <div class="miniSuit">
                ${suit.symbol}
            </div>

        </div>

    `;

}


function formatValues(values){

    return values
        .map(
            value=>{

                const rank=
                    RANKS.find(
                        r=>r.value===value
                    );

                return rank
                    ?rank.name
                    :value;

            }
        )
        .join(" / ");

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const playerBox=
        document.getElementById(
            "playerCards"
        );

    playerBox.innerHTML="";

    state.hand.forEach(
        (card,index)=>{

            playerBox.innerHTML+=
                cardHTML(
                    card,
                    index,
                    state.selected
                    .includes(index)
                );

        }
    );


    const enemyBox=
        document.getElementById(
            "enemyCards"
        );

    enemyBox.innerHTML="";

    if(state.enemyRevealed){

        state.enemyHand
            .forEach(
                card=>{

                    enemyBox.innerHTML+=
                        enemyCardHTML(
                            card
                        );

                }
            );

    }else{

        state.enemyHand
            .forEach(
                ()=>{

                    enemyBox.innerHTML+=
                        `<div class="card back"></div>`;

                }
            );

    }


    document
        .getElementById(
            "selectedCount"
        )
        .textContent=
            state.selected.length;

    document
        .getElementById(
            "discardText"
        )
        .textContent=
            state.discards;

    document
        .getElementById(
            "stageText"
        )
        .textContent=
            `${state.stage} / 8`;

    renderAugments();

}

   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    const toast=
        document.getElementById(
            "toast"
        );

    toast.textContent=text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer=
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            1800
        );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    amount
){

    const layer=
        document.getElementById(
            "particleLayer"
        );

    for(
        let i=0;
        i<amount;
        i++
    ){

        const p=
            document.createElement(
                "div"
            );

        p.className="particle";

        p.style.left=
            `${x}px`;

        p.style.top=
            `${y}px`;

        p.style.setProperty(
            "--x",
            `${(Math.random()-.5)*500}px`
        );

        p.style.setProperty(
            "--y",
            `${(Math.random()-.5)*400}px`
        );

        layer.appendChild(p);

        setTimeout(
            ()=>p.remove(),
            1000
        );

    }

}


function flashEffect(){

    const flash=
        document.getElementById(
            "flash"
        );

    flash.classList.remove(
        "show"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "show"
    );

}
