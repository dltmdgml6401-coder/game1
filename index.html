<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구슬을 지켜라!</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #173c22;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  cursor: crosshair;
  background:
    radial-gradient(circle at 50% 45%, #d6f77c 0%, #9fd957 20%, #55a83f 48%, #28713c 100%);
}

/* 숲 느낌 */
#game::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 8% 15%, rgba(255,255,255,.2) 0 3px, transparent 4px),
    radial-gradient(circle at 18% 70%, rgba(255,255,255,.15) 0 4px, transparent 5px),
    radial-gradient(circle at 85% 22%, rgba(255,255,255,.18) 0 3px, transparent 4px),
    radial-gradient(circle at 75% 75%, rgba(255,255,255,.13) 0 5px, transparent 6px);
  opacity: .7;
  pointer-events: none;
}

/* 잔디 */
.grass {
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(20,100,45,.22);
  filter: blur(12px);
}

.g1 { left:-80px; bottom:-70px; }
.g2 { right:-80px; top:-60px; }
.g3 { left:40%; bottom:-120px; }

/* ---------------- UI ---------------- */

#topUI {
  position: absolute;
  z-index: 50;
  top: 18px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
}

.uiBox {
  background: linear-gradient(#fff8df, #ffe9bd);
  border: 3px solid #754c28;
  border-radius: 17px;
  padding: 9px 18px;
  color: #392817;
  font-weight: 900;
  box-shadow:
    0 5px 0 rgba(77,42,18,.35),
    inset 0 2px rgba(255,255,255,.8);
}

#timer {
  font-size: clamp(22px, 3vw, 36px);
}

#lives {
  display: flex;
  gap: 5px;
  font-size: clamp(25px, 3vw, 38px);
}

/* 안내 */
#instructions {
  position: absolute;
  z-index: 50;
  left: 18px;
  top: 95px;
  width: min(210px, 22vw);
  min-width: 160px;
}

.help {
  background: rgba(26,91,42,.88);
  border: 2px solid rgba(255,255,255,.2);
  color: white;
  padding: 10px 13px;
  border-radius: 10px;
  margin-bottom: 6px;
  font-size: clamp(11px, 1.2vw, 16px);
  font-weight: 800;
  box-shadow: 0 4px 10px rgba(0,0,0,.2);
}

.help.pink {
  background: rgba(126,54,72,.92);
}

/* ---------------- CORE ---------------- */

#coreArea {
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%);
  width: min(300px, 25vw);
  height: min(300px, 25vw);
  min-width: 210px;
  min-height: 210px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.coreGlow {
  position: absolute;
  width: 75%;
  height: 75%;
  border-radius: 50%;
  background: #ffe14b;
  box-shadow:
    0 0 25px #fff7a1,
    0 0 55px #ffd52d,
    0 0 100px rgba(255,206,30,.8);
  animation: corePulse 1.3s infinite ease-in-out;
}

@keyframes corePulse {
  0%,100% { transform: scale(.92); opacity: .75; }
  50% { transform: scale(1.08); opacity: 1; }
}

.core {
  position: relative;
  width: 48%;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 25%, #fff 0 6%, #fff8a4 7%, transparent 17%),
    radial-gradient(circle at 42% 40%, #fff48b, #ffd321 55%, #f1a600);
  border: 5px solid #fff6b0;
  box-shadow:
    inset -10px -10px 18px rgba(255,145,0,.25),
    0 0 20px #fff7a5,
    0 0 45px #ffd83d;
}

.coreRing {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 3px solid rgba(255,245,125,.8);
  border-radius: 50%;
  animation: ring 2s infinite;
}

@keyframes ring {
  from { transform: scale(.7); opacity: 1; }
  to { transform: scale(1.7); opacity: 0; }
}

#damageCounter {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  color: #713c1d;
  background: #fff1c9;
  border: 2px solid #81532c;
  border-radius: 20px;
  padding: 5px 14px;
  font-weight: 900;
  white-space: nowrap;
}

/* ---------------- PLAYER ---------------- */

/*
  character-sheet.png
  = 사용자가 올린 1536x1536 캐릭터 시트

  아래 .playerSprite는 시트 왼쪽 위의 정면 캐릭터를
  확대해서 보여주는 방식.
*/
#player {
  position: absolute;
  z-index: 20;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%);
  width: min(125px, 11vw);
  height: min(180px, 15vw);
  min-width: 90px;
  min-height: 130px;
  pointer-events: none;
}

.playerSprite {
  width: 100%;
  height: 100%;
  background-image: url("character-sheet.png");
  background-repeat: no-repeat;

  /*
    원본 시트에서 왼쪽 위 정면 캐릭터 영역.
    시트 크기가 1536x1536일 때 기준.
  */
  background-size: 420% 420%;
  background-position: 4% 5%;

  filter: drop-shadow(0 8px 4px rgba(0,0,0,.22));
}

/* ---------------- GHOST ---------------- */

.ghost {
  position: absolute;
  z-index: 30;
  width: 65px;
  height: 65px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  touch-action: manipulation;
  transition: filter .1s;
}

.ghost:hover {
  filter: brightness(1.15) drop-shadow(0 0 10px rgba(255,255,255,.5));
}

.ghostBody {
  width: 100%;
  height: 100%;
  border-radius: 48% 48% 42% 42%;
  position: relative;
  border: 4px solid rgba(35,79,90,.8);
  box-shadow: inset -8px -8px 0 rgba(0,0,0,.08);
}

.ghostBody::after {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  bottom: -10px;
  height: 25px;
  background: inherit;
  clip-path: polygon(
    0 0, 20% 55%, 40% 0,
    60% 55%, 80% 0, 100% 55%,
    100% 100%, 0 100%
  );
  z-index: -1;
}

.ghost.blue .ghostBody {
  background: linear-gradient(145deg, #aeeeff, #54bde9);
}

.ghost.pink .ghostBody {
  background: linear-gradient(145deg, #ffd0df, #f47fa5);
  border-color: #91475e;
}

.eyes {
  position: absolute;
  top: 22px;
  left: 13px;
  right: 13px;
  display: flex;
  justify-content: space-between;
}

.eye {
  width: 13px;
  height: 19px;
  background: #142d39;
  border-radius: 50%;
}

.mouth {
  position: absolute;
  left: 50%;
  top: 43px;
  transform: translateX(-50%);
  width: 13px;
  height: 7px;
  border-radius: 50%;
  background: #263842;
}

.pink .mouth {
  height: 12px;
}

/* 맞았을 때 */
.hit {
  animation: ghostHit .18s ease-out;
}

@keyframes ghostHit {
  0% { transform: translate(-50%,-50%) scale(1); }
  40% { transform: translate(-50%,-50%) scale(1.3) rotate(8deg); }
  100% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
}

/* ---------------- EFFECTS ---------------- */

.particle {
  position: absolute;
  z-index: 80;
  pointer-events: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff36d;
  animation: particle .65s ease-out forwards;
}

@keyframes particle {
  to {
    transform:
      translate(var(--x), var(--y))
      scale(0);
    opacity: 0;
  }
}

.clickBurst {
  position: absolute;
  z-index: 100;
  pointer-events: none;
  color: #fff;
  font-weight: 1000;
  font-size: 26px;
  text-shadow:
    0 3px #8d4059,
    0 0 10px #ff9ab8;
  animation: clickBurst .45s ease-out forwards;
}

@keyframes clickBurst {
  0% {
    transform: translate(-50%,-50%) scale(.5);
    opacity: 1;
  }
  100% {
    transform: translate(-50%,-110%) scale(1.3);
    opacity: 0;
  }
}

/* ---------------- PINK MODAL ---------------- */

#pinkOverlay {
  position: absolute;
  z-index: 200;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle, rgba(255,174,199,.95), rgba(226,93,130,.9));
  overflow: hidden;
}

#pinkOverlay.active {
  display: flex;
}

.speedLines {
  position: absolute;
  inset: -50%;
  background: repeating-conic-gradient(
    from 0deg,
    rgba(255,255,255,.2) 0deg 3deg,
    transparent 3deg 10deg
  );
  animation: spinLines 5s linear infinite;
}

@keyframes spinLines {
  to { transform: rotate(360deg); }
}

#pinkBattle {
  position: relative;
  z-index: 2;
  width: min(650px, 75vw);
  text-align: center;
}

#angryGhost {
  width: min(270px, 40vw);
  height: min(270px, 40vw);
  margin: auto;
  position: relative;
  animation: angry .35s infinite alternate;
}

@keyframes angry {
  from { transform: rotate(-2deg) scale(1); }
  to { transform: rotate(2deg) scale(1.04); }
}

.bigGhost {
  width: 100%;
  height: 100%;
  border-radius: 50% 50% 45% 45%;
  background: linear-gradient(#ffd0df,#f0719b);
  border: 8px solid #87394f;
  box-shadow:
    inset -20px -20px 0 rgba(170,45,90,.1),
    0 15px 0 rgba(110,37,62,.2);
  position: relative;
}

.bigEye {
  position: absolute;
  top: 30%;
  width: 55px;
  height: 72px;
  background: #16121a;
  border-radius: 45% 20% 50% 20%;
}

.bigEye.left {
  left: 22%;
  transform: rotate(25deg);
}

.bigEye.right {
  right: 22%;
  transform: rotate(-25deg);
}

.bigMouth {
  position: absolute;
  width: 80px;
  height: 70px;
  left: 50%;
  top: 52%;
  transform: translateX(-50%);
  background: #561c2d;
  border-radius: 50% 50% 45% 45%;
  border: 5px solid #7f2c43;
}

#comboText {
  margin-top: 15px;
  font-size: clamp(48px, 7vw, 90px);
  font-weight: 1000;
  color: #fff;
  -webkit-text-stroke: 4px #592536;
  text-shadow: 0 8px #a94162;
  transform: rotate(-4deg);
}

#comboCount {
  display: inline-block;
  margin-top: 5px;
  padding: 10px 35px;
  border-radius: 18px;
  background: rgba(30,18,22,.9);
  color: white;
  font-size: clamp(28px,4vw,48px);
  font-weight: 1000;
}

#comboBar {
  width: min(500px, 70vw);
  height: 24px;
  margin: 18px auto 0;
  background: #4b2633;
  border-radius: 30px;
  overflow: hidden;
  border: 3px solid white;
}

#comboProgress {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg,#ffe36b,#ff8cae);
  transition: width .08s linear;
}

#comboHint {
  color: white;
  font-size: 18px;
  font-weight: 900;
  margin-top: 10px;
}

/* ---------------- START / END ---------------- */

.screen {
  position: absolute;
  z-index: 500;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(20,60,30,.7);
  backdrop-filter: blur(5px);
}

.panel {
  width: min(550px, 88vw);
  background: linear-gradient(#fff8dc,#ffe7b4);
  border: 5px solid #714621;
  border-radius: 30px;
  padding: 35px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

.panel h1 {
  margin: 0 0 15px;
  font-size: clamp(32px,5vw,58px);
  color: #392618;
}

.panel p {
  font-size: 18px;
  line-height: 1.7;
  font-weight: 700;
  color: #5b4029;
}

button {
  border: 0;
  border-radius: 18px;
  padding: 15px 40px;
  font-size: 23px;
  font-weight: 1000;
  color: white;
  background: linear-gradient(#8ee75d,#48ad48);
  border: 4px solid #2e7132;
  box-shadow: 0 6px 0 #2d6730;
  cursor: pointer;
}

button:active {
  transform: translateY(5px);
  box-shadow: 0 1px 0 #2d6730;
}

#gameOver,
#clearScreen {
  display: none;
}

#gameOver.show,
#clearScreen.show {
  display: flex;
}

/* 모바일 */
@media(max-width:700px) {
  #instructions {
    top: 80px;
    left: 8px;
    min-width: 125px;
    width: 145px;
  }

  .help {
    padding: 6px 8px;
  }

  #coreArea {
    width: 250px;
    height: 250px;
  }

  .ghost {
    width: 52px;
    height: 52px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="grass g1"></div>
  <div class="grass g2"></div>
  <div class="grass g3"></div>

  <!-- UI -->
  <div id="topUI">
    <div class="uiBox">
      ⏱️ <span id="timer">01:00</span>
    </div>

    <div class="uiBox" id="lives">
      ❤️ ❤️ ❤️
    </div>
  </div>

  <div id="instructions">
    <div class="help">🔵 파란 귀신<br>한 번 클릭!</div>
    <div class="help pink">🩷 분홍 귀신<br>연타 10번!</div>
  </div>

  <!-- 중앙 구슬 -->
  <div id="coreArea">
    <div class="coreGlow"></div>
    <div class="coreRing"></div>
    <div class="core"></div>
    <div id="damageCounter">구슬 피해 0 / 3</div>
  </div>

  <!-- 캐릭터 -->
  <div id="player">
    <div class="playerSprite"></div>
  </div>

  <!-- 귀신들이 들어오는 곳 -->
  <div id="ghostLayer"></div>

  <!-- 분홍 귀신 연타 -->
  <div id="pinkOverlay">

    <div class="speedLines"></div>

    <div id="pinkBattle">

      <div id="angryGhost">
        <div class="bigGhost">
          <div class="bigEye left"></div>
          <div class="bigEye right"></div>
          <div class="bigMouth"></div>
        </div>
      </div>

      <div id="comboText">연타!</div>

      <div id="comboCount">
        <span id="comboNumber">0</span> / 10
      </div>

      <div id="comboBar">
        <div id="comboProgress"></div>
      </div>

      <div id="comboHint">
        빠르게 10번 클릭하세요!
      </div>

    </div>
  </div>

  <!-- 시작 -->
  <div class="screen" id="startScreen">
    <div class="panel">
      <h1>🌱 구슬을 지켜라!</h1>

      <p>
        노란 빛나는 구슬을 1분 동안 지켜주세요!<br>
        🔵 파란 귀신 → 한 번 클릭<br>
        🩷 분홍 귀신 → 클릭 후 10연타
      </p>

      <button id="startBtn">게임 시작!</button>
    </div>
  </div>

  <!-- 게임오버 -->
  <div class="screen" id="gameOver">
    <div class="panel">
      <h1>💥 게임 오버!</h1>
      <p>
        귀신이 구슬에 너무 많이 닿았어요!
      </p>
      <button onclick="location.reload()">다시 하기</button>
    </div>
  </div>

  <!-- 클리어 -->
  <div class="screen" id="clearScreen">
    <div class="panel">
      <h1>✨ 클리어!</h1>
      <p>
        1분 동안 노란 구슬을 지켜냈어요!
      </p>
      <button onclick="location.reload()">다시 하기</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   GAME SETTINGS
============================================================ */

const GAME_TIME = 60;

let gameRunning = false;
let elapsed = 0;
let lastTime = 0;

let lives = 3;
let coreHits = 0;

let ghosts = [];
let ghostId = 0;

let activePink = null;
let pinkHits = 0;
let pinkTimer = null;

const game = document.getElementById("game");
const ghostLayer = document.getElementById("ghostLayer");

const timerEl = document.getElementById("timer");
const livesEl = document.getElementById("lives");
const damageEl = document.getElementById("damageCounter");

const pinkOverlay = document.getElementById("pinkOverlay");
const comboNumber = document.getElementById("comboNumber");
const comboProgress = document.getElementById("comboProgress");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");
const clearScreen = document.getElementById("clearScreen");


/* ============================================================
   SOUND
============================================================ */

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function sound(type) {

  if (!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;

  if (type === "click") {

    osc.type = "square";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(850, now + .06);

    gain.gain.setValueAtTime(.09, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .08);

    osc.start(now);
    osc.stop(now + .08);

  } else if (type === "pop") {

    osc.type = "sine";
    osc.frequency.setValueAtTime(650, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + .18);

    gain.gain.setValueAtTime(.15, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .18);

    osc.start(now);
    osc.stop(now + .18);

  } else if (type === "damage") {

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + .3);

    gain.gain.setValueAtTime(.2, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .3);

    osc.start(now);
    osc.stop(now + .3);

  } else if (type === "clear") {

    osc.type = "sine";

    osc.frequency.setValueAtTime(500, now);
    osc.frequency.setValueAtTime(700, now + .15);
    osc.frequency.setValueAtTime(900, now + .3);

    gain.gain.setValueAtTime(.12, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .7);

    osc.start(now);
    osc.stop(now + .7);

  } else if (type === "error") {

    osc.type = "square";
    osc.frequency.setValueAtTime(120, now);

    gain.gain.setValueAtTime(.15, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .35);

    osc.start(now);
    osc.stop(now + .35);
  }
}


/* ============================================================
   EFFECTS
============================================================ */

function burst(x, y, color="#ffe95c") {

  for (let i = 0; i < 12; i++) {

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.background = color;

    p.style.setProperty(
      "--x",
      `${(Math.random()-.5)*120}px`
    );

    p.style.setProperty(
      "--y",
      `${(Math.random()-.5)*120}px`
    );

    game.appendChild(p);

    setTimeout(() => p.remove(), 700);
  }
}

function clickText(x, y, text="+1") {

  const el = document.createElement("div");

  el.className = "clickBurst";
  el.textContent = text;

  el.style.left = x + "px";
  el.style.top = y + "px";

  game.appendChild(el);

  setTimeout(() => el.remove(), 500);
}


/* ============================================================
   UI
============================================================ */

function updateLives() {

  livesEl.textContent =
    "❤️".repeat(Math.max(0, lives)) +
    "🖤".repeat(3 - lives);
}

function updateDamage() {

  damageEl.textContent =
    `구슬 피해 ${coreHits} / 3`;
}

function updateTimer() {

  const remaining = Math.max(
    0,
    GAME_TIME - elapsed
  );

  const min = Math.floor(remaining / 60);
  const sec = Math.ceil(remaining % 60);

  timerEl.textContent =
    `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}


/* ============================================================
   GHOST CREATION
============================================================ */

function createGhost() {

  if (!gameRunning) return;

  const id = ++ghostId;

  /*
    시간이 지날수록 분홍 귀신 등장 확률 증가
  */
  const pinkChance =
    Math.min(.30, .10 + elapsed / 180);

  const type =
    Math.random() < pinkChance
      ? "pink"
      : "blue";

  const el = document.createElement("div");

  el.className =
    `ghost ${type}`;

  el.innerHTML = `
    <div class="ghostBody">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth"></div>
    </div>
  `;

  /*
    화면 가장자리에서 생성
  */
  const side =
    Math.floor(Math.random() * 4);

  let x, y;

  if (side === 0) {
    x = Math.random() * innerWidth;
    y = -70;
  }

  else if (side === 1) {
    x = innerWidth + 70;
    y = Math.random() * innerHeight;
  }

  else if (side === 2) {
    x = Math.random() * innerWidth;
    y = innerHeight + 70;
  }

  else {
    x = -70;
    y = Math.random() * innerHeight;
  }

  /*
    중앙 구슬 방향
  */
  const coreX = innerWidth / 2;
  const coreY = innerHeight * .53;

  const dx = coreX - x;
  const dy = coreY - y;

  const distance =
    Math.sqrt(dx*dx + dy*dy);

  /*
    시간이 지날수록 속도 증가
  */
  const difficulty =
    elapsed / GAME_TIME;

  const speed =
    38 +
    difficulty * 65 +
    Math.random() * 25;

  const ghost = {
    id,
    type,
    x,
    y,
    speed,
    el,
    active: true
  };

  el.style.left = x + "px";
  el.style.top = y + "px";

  /*
    클릭 이벤트를 ghost 자체에 직접 연결.
    이벤트 버블링 문제 방지.
  */
  el.addEventListener("pointerdown", function(e) {

    e.preventDefault();
    e.stopPropagation();

    if (!ghost.active || !gameRunning) return;

    if (ghost.type === "blue") {
      killBlueGhost(ghost);
    } else {
      openPinkBattle(ghost);
    }
  });

  ghostLayer.appendChild(el);
  ghosts.push(ghost);
}


/* ============================================================
   BLUE GHOST
============================================================ */

function killBlueGhost(ghost) {

  if (!ghost.active) return;

  ghost.active = false;

  const x = ghost.x;
  const y = ghost.y;

  ghost.el.classList.add("hit");

  burst(x, y, "#a8eaff");
  sound("pop");

  setTimeout(() => {

    ghost.el.remove();

    ghosts = ghosts.filter(
      g => g.id !== ghost.id
    );

  }, 180);
}


/* ============================================================
   PINK GHOST
============================================================ */

function openPinkBattle(ghost) {

  /*
    이미 다른 분홍 귀신을 처리 중이면 무시
  */
  if (activePink) return;

  activePink = ghost;
  pinkHits = 0;

  /*
    필드에서 분홍 귀신은 일단 숨긴다.
    연타하는 동안 이동하지 않음.
  */
  ghost.el.style.display = "none";

  pinkOverlay.classList.add("active");

  updatePinkUI();

  /*
    약 3초 안에 10번 못 누르면
    생명 1개 감소
  */
  pinkTimer = setTimeout(() => {

    if (
      activePink === ghost &&
      pinkHits < 10
    ) {

      sound("damage");

      lives--;

      updateLives();

      burst(
        innerWidth / 2,
        innerHeight / 2,
        "#ff5b7d"
      );

      /*
        타임아웃이므로 분홍 귀신도 사라짐.
        같은 귀신이 다시 처리되지 않도록 active=false.
      */
      ghost.active = false;

      closePinkBattle();

      if (lives <= 0) {
        endGame(false);
      }
    }

  }, 3000);
}


/*
  ⭐ 핵심 수정 부분 ⭐

  분홍 귀신을 클릭할 때마다 반드시
  pinkHits += 1

  그리고 10이 되는 순간
  activePink.active = false
  -> 해당 귀신 삭제
  -> 모달 닫기

  기존처럼 화면을 닫기만 하고
  원래 귀신 객체를 남겨두는 문제가 없음.
*/
function hitPink() {

  if (!activePink) return;
  if (!activePink.active) return;

  pinkHits++;

  sound("click");

  comboNumber.textContent = pinkHits;

  comboProgress.style.width =
    `${pinkHits * 10}%`;

  clickText(
    innerWidth / 2,
    innerHeight * .72,
    "+1"
  );

  burst(
    innerWidth / 2 +
      (Math.random()-.5)*100,
    innerHeight * .45 +
      (Math.random()-.5)*80,
    "#fff16b"
  );

  /*
    정확히 10번!
  */
  if (pinkHits >= 10) {

    clearTimeout(pinkTimer);

    const defeated = activePink;

    /*
      ⭐ 가장 중요 ⭐
      귀신 자체를 비활성화
    */
    defeated.active = false;

    sound("pop");

    burst(
      innerWidth / 2,
      innerHeight / 2,
      "#ffb6ce"
    );

    /*
      10연타 성공 연출 후 삭제
    */
    setTimeout(() => {

      defeated.el.remove();

      ghosts = ghosts.filter(
        g => g.id !== defeated.id
      );

      closePinkBattle();

    }, 160);

  } else {

    updatePinkUI();
  }
}

function updatePinkUI() {

  comboNumber.textContent = pinkHits;

  comboProgress.style.width =
    `${pinkHits * 10}%`;
}

function closePinkBattle() {

  clearTimeout(pinkTimer);

  pinkTimer = null;

  pinkOverlay.classList.remove("active");

  activePink = null;
  pinkHits = 0;

  comboNumber.textContent = "0";
  comboProgress.style.width = "0%";
}


/*
  ⭐ 분홍 연타 영역에 직접 pointerdown 연결
  ghostLayer와 충돌하지 않게 한다.
*/
document.getElementById("pinkOverlay")
  .addEventListener("pointerdown", function(e) {

    e.preventDefault();

    /*
      아무 곳이나 눌러도 연타가 올라가도록 설정.
      특히 모바일에서도 pointerdown 사용.
    */
    if (activePink) {
      hitPink();
    }
  });


/* ============================================================
   CORE DAMAGE
============================================================ */

function damageCore(ghost) {

  if (!ghost.active) return;

  ghost.active = false;

  coreHits++;

  updateDamage();

  sound("damage");

  burst(
    innerWidth / 2,
    innerHeight * .53,
    "#ff6464"
  );

  /*
    구슬 피격 효과
  */
  document.getElementById("coreArea")
    .animate(
      [
        { transform:"translate(-50%,-50%) scale(1)" },
        { transform:"translate(-50%,-50%) scale(1.18)" },
        { transform:"translate(-50%,-50%) scale(1)" }
      ],
      {
        duration:350
      }
    );

  ghost.el.remove();

  ghosts = ghosts.filter(
    g => g.id !== ghost.id
  );

  if (coreHits >= 3) {
    endGame(false);
  }
}


/* ============================================================
   GAME LOOP
============================================================ */

function gameLoop(timestamp) {

  if (!gameRunning) return;

  if (!lastTime) {
    lastTime = timestamp;
  }

  const dt =
    Math.min(
      (timestamp - lastTime) / 1000,
      .05
    );

  lastTime = timestamp;

  elapsed += dt;

  updateTimer();

  /*
    귀신 이동
  */
  const coreX = innerWidth / 2;
  const coreY = innerHeight * .53;

  ghosts.forEach(ghost => {

    if (!ghost.active) return;

    /*
      분홍 연타 중에는 이동하지 않는다.
    */
    if (activePink === ghost) return;

    const dx = coreX - ghost.x;
    const dy = coreY - ghost.y;

    const distance =
      Math.sqrt(dx*dx + dy*dy);

    /*
      시간이 지나면 속도 추가 상승
    */
    const speedBonus =
      1 + elapsed / 75;

    ghost.x +=
      dx / distance *
      ghost.speed *
      speedBonus *
      dt;

    ghost.y +=
      dy / distance *
      ghost.speed *
      speedBonus *
      dt;

    ghost.el.style.left =
      ghost.x + "px";

    ghost.el.style.top =
      ghost.y + "px";

    /*
      중앙 구슬에 접근
    */
    if (distance < 80) {

      damageCore(ghost);
    }
  });

  /*
    게임 종료
  */
  if (elapsed >= GAME_TIME) {

    endGame(true);
    return;
  }

  requestAnimationFrame(gameLoop);
}


/* ============================================================
   SPAWN SYSTEM
============================================================ */

let spawnTimer = null;

function scheduleSpawn() {

  if (!gameRunning) return;

  /*
    초반 1.0초
    후반 0.35초까지 빨라짐
  */
  const progress =
    elapsed / GAME_TIME;

  const interval =
    1000 -
    progress * 620;

  spawnTimer = setTimeout(() => {

    createGhost();

    /*
      후반에는 한 번에 2마리 등장할 확률 증가
    */
    if (
      elapsed > 25 &&
      Math.random() < elapsed / 130
    ) {
      createGhost();
    }

    scheduleSpawn();

  }, interval);
}


/* ============================================================
   START
============================================================ */

function startGame() {

  initAudio();

  gameRunning = true;

  elapsed = 0;
  lives = 3;
  coreHits = 0;

  ghosts = [];

  updateLives();
  updateDamage();
  updateTimer();

  startScreen.style.display = "none";

  lastTime = 0;

  /*
    초기 귀신 몇 마리
  */
  for (let i = 0; i < 5; i++) {
    createGhost();
  }

  scheduleSpawn();

  requestAnimationFrame(gameLoop);
}

document
  .getElementById("startBtn")
  .addEventListener("click", startGame);


/* ============================================================
   END
============================================================ */

function endGame(clear) {

  if (!gameRunning) return;

  gameRunning = false;

  clearTimeout(spawnTimer);
  clearTimeout(pinkTimer);

  closePinkBattle();

  if (clear) {

    sound("clear");

    clearScreen.classList.add("show");

  } else {

    sound("error");

    gameOver.classList.add("show");
  }
}


/* ============================================================
   INITIAL
============================================================ */

updateLives();
updateDamage();
updateTimer();

</script>
