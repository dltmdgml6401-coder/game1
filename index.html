```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Poker Duel</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    min-height:100vh;
    color:#fff;
    font-family:Arial,"Malgun Gothic",sans-serif;
    background:
        radial-gradient(circle at 50% 15%,#263e63,#101a2a 45%,#050910);
}

button{
    font-family:inherit;
}

#game{
    width:min(1450px,96vw);
    margin:auto;
    padding:18px 0 35px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.title{
    font-size:28px;
    font-weight:900;
}

.stage{
    padding:10px 18px;
    border-radius:12px;
    background:#18263a;
    border:1px solid #4b6384;
    font-weight:900;
}

#main{
    display:grid;
    grid-template-columns:1fr 310px;
    gap:16px;
}

#table{
    min-height:750px;
    padding:24px;
    border-radius:25px;
    border:2px solid #3c5675;
    background:
        radial-gradient(circle at center,#155444,#0d3a32 45%,#071e1b);
    box-shadow:
        inset 0 0 100px #0008,
        0 20px 60px #0008;
}

.playerName{
    font-size:16px;
    font-weight:900;
    color:#d8e4f5;
}

#enemyArea{
    text-align:center;
}

#enemyHand{
    min-height:125px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:8px;
    flex-wrap:wrap;
}

.enemyCard{
    width:58px;
    height:82px;
    border:3px solid #eee;
    border-radius:8px;
    background:
        repeating-linear-gradient(
            45deg,
            #711722 0,
            #711722 5px,
            #a52535 5px,
            #a52535 10px
        );
    box-shadow:0 5px 10px #0009;
    transition:.2s;
}

.enemyCard.revealed{
    width:78px;
    height:108px;
    background:#fff;
    color:#111;
    position:relative;
}

.enemyCard.revealed.red{
    color:#d52235;
}

.enemyRank{
    position:absolute;
    top:6px;
    left:7px;
    font-size:19px;
    font-weight:900;
}

.enemySuit{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
}

#center{
    min-height:210px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
}

#message{
    min-height:34px;
    text-align:center;
    font-size:20px;
    font-weight:900;
}

#timerWrap{
    width:330px;
    height:13px;
    border-radius:20px;
    overflow:hidden;
    background:#0c121c;
    border:1px solid #4d6380;
}

#timer{
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        #43e48b,
        #f0d348,
        #e84756
    );
    transition:width .1s linear;
}

#timerText{
    font-size:13px;
    color:#aab8ca;
}

#handArea{
    margin-top:5px;
}

.handTitle{
    text-align:center;
    margin-bottom:4px;
}

#hand{
    min-height:175px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:9px;
    flex-wrap:wrap;
    padding:18px 10px 8px;
}

.card{
    width:91px;
    height:128px;
    position:relative;
    flex:0 0 auto;
    background:#fff;
    color:#111;
    border:3px solid #dce1e7;
    border-radius:11px;
    cursor:pointer;
    box-shadow:0 7px 14px #0009;
    transition:
        transform .13s ease,
        box-shadow .13s ease,
        border-color .13s ease;
}

.card:hover{
    transform:translateY(-8px);
    border-color:#ffd94f;
    box-shadow:
        0 14px 25px #000b,
        0 0 14px #ffd94f55;
}

.card.selected{
    transform:translateY(-20px);
    border-color:#4df09b;
    box-shadow:
        0 17px 28px #000c,
        0 0 20px #4df09b88;
}

.card.red{
    color:#d52637;
}

.rank{
    position:absolute;
    top:6px;
    left:8px;
    font-size:20px;
    font-weight:900;
}

.cardCenter{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
}

.suit{
    position:absolute;
    right:7px;
    bottom:5px;
    font-size:25px;
}

#controls{
    text-align:center;
    margin-top:12px;
}

.actionBtn{
    padding:12px 23px;
    margin:4px;
    border:0;
    border-radius:10px;
    color:#fff;
    background:#273b59;
    font-weight:900;
    cursor:pointer;
    transition:.15s;
}

.actionBtn:hover{
    transform:translateY(-2px);
    background:#365476;
}

.actionBtn.primary{
    background:#247c58;
}

.actionBtn.danger{
    background:#88333c;
}

.actionBtn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
}

#side{
    background:#111a29;
    border:1px solid #3b506e;
    border-radius:18px;
    padding:15px;
}

.sideTitle{
    font-size:19px;
    font-weight:900;
    margin-bottom:12px;
}

#augmentList{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.augmentCard{
    position:relative;
    padding:12px;
    border-radius:12px;
    background:#19283d;
    border:2px solid #526a88;
    cursor:pointer;
    transition:.15s;
}

.augmentCard:hover{
    transform:translateX(-4px);
    background:#243753;
    border-color:#fff;
}

.augmentCard.used{
    opacity:.42;
    cursor:not-allowed;
}

.augmentName{
    font-size:15px;
    font-weight:900;
}

.augmentDesc{
    margin-top:5px;
    font-size:12px;
    line-height:1.45;
    color:#bbc9dc;
}

.rarity{
    display:inline-block;
    margin-bottom:5px;
    padding:3px 7px;
    border-radius:5px;
    font-size:10px;
    font-weight:900;
}

.rarity.silver{
    background:#8995a6;
}

.rarity.gold{
    background:#c59627;
}

.rarity.platinum{
    background:#9b60e8;
}

#log{
    height:125px;
    margin-top:14px;
    padding:10px;
    border-radius:10px;
    overflow:auto;
    background:#070e17;
    color:#aab8cc;
    font-size:12px;
}

#resultOverlay,
#augmentOverlay,
#suitOverlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    background:#02060dcc;
    backdrop-filter:blur(8px);
}

.overlayBox{
    width:min(960px,94vw);
    max-height:92vh;
    overflow:auto;
    padding:25px;
    border-radius:20px;
    border:1px solid #536a89;
    background:#121c2b;
    box-shadow:0 30px 80px #000d;
}

.overlayTitle{
    text-align:center;
    font-size:27px;
    font-weight:900;
    margin-bottom:20px;
}

#augmentChoices{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.choice{
    min-height:205px;
    padding:19px;
    border-radius:16px;
    background:#1b2b41;
    border:2px solid #536a89;
    cursor:pointer;
    transition:.15s;
}

.choice:hover{
    transform:translateY(-7px);
    border-color:#fff;
    box-shadow:0 15px 30px #0009;
}

.choice h3{
    margin:8px 0;
}

.choice p{
    color:#bfccde;
    line-height:1.5;
}

#suitChoices,
#rankChoices{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.suitButton{
    padding:18px;
    border:2px solid #4d6380;
    border-radius:12px;
    background:#1b2a3f;
    color:#fff;
    font-size:19px;
    font-weight:900;
    cursor:pointer;
}

.suitButton:hover{
    border-color:#fff;
    background:#29415f;
}

#resultContent{
    text-align:center;
}

.resultHeader{
    font-size:30px;
    font-weight:900;
    margin-bottom:20px;
}

.comparison{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin:20px 0;
}

.resultPanel{
    padding:17px;
    border-radius:15px;
    background:#19283c;
    border:1px solid #405775;
}

.resultPanel h3{
    margin:0 0 12px;
}

.resultCards{
    min-height:110px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
}

.miniCard{
    width:58px;
    height:82px;
    position:relative;
    border-radius:8px;
    background:#fff;
    color:#111;
    border:2px solid #ddd;
}

.miniCard.red{
    color:#d52235;
}

.miniRank{
    position:absolute;
    top:4px;
    left:5px;
    font-size:14px;
    font-weight:900;
}

.miniSuit{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.handRank{
    margin-top:12px;
    font-size:21px;
    font-weight:900;
}

.handScore{
    margin-top:4px;
    color:#aebed2;
    font-size:12px;
}

.resultReason{
    padding:13px;
    border-radius:10px;
    background:#0c1522;
    color:#c9d5e5;
    line-height:1.5;
}

#flash{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;
    opacity:0;
}

@keyframes winFlash{
    0%{opacity:0}
    30%{opacity:.6}
    100%{opacity:0}
}

@keyframes loseFlash{
    0%{opacity:0}
    30%{opacity:.7}
    100%{opacity:0}
}

.winFlash{
    animation:winFlash .65s;
    background:radial-gradient(circle,#5aff9a55,transparent 65%);
}

.loseFlash{
    animation:loseFlash .7s;
    background:radial-gradient(circle,#ff3e4f55,transparent 65%);
}

@media(max-width:900px){

    #main{
        grid-template-columns:1fr;
    }

    #table{
        min-height:650px;
    }

    #augmentChoices{
        grid-template-columns:1fr;
    }

    .comparison{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="game">

<header>
    <div class="title">♠ AI POKER DUEL</div>
    <div class="stage" id="stageText">STAGE 1 / 8</div>
</header>

<div id="main">

<section id="table">

    <div id="enemyArea">

        <div class="playerName">
            🤖 AI OPPONENT
        </div>

        <div id="enemyHand"></div>

    </div>

    <div id="center">

        <div id="message">
            카드 5장을 선택하세요.
        </div>

        <div id="timerWrap">
            <div id="timer"></div>
        </div>

        <div id="timerText">
            제한시간 30초
        </div>

    </div>

    <div id="handArea">

        <div class="playerName handTitle">
            👤 PLAYER —
            <span id="handCount">6</span>/8
        </div>

        <div id="hand"></div>

        <div id="controls">

            <button
                class="actionBtn primary"
                id="submitBtn">
                선택 카드 제출
            </button>

            <button
                class="actionBtn danger"
                id="discardBtn">
                선택 카드 버리기
            </button>

        </div>

    </div>

    <div id="log"></div>

</section>

<aside id="side">

    <div class="sideTitle">
        ⚡ 내 증강
    </div>

    <div id="augmentList">
        <div style="color:#77869c;font-size:13px">
            증강을 획득하면 여기에 표시됩니다.<br>
            클릭해서 사용하세요.
        </div>
    </div>

</aside>

</div>
</div>


<!-- 증강 -->

<div id="augmentOverlay">

<div class="overlayBox">

    <div class="overlayTitle">
        ⚡ 증강 선택
    </div>

    <div style="
        text-align:center;
        color:#9dacbf;
        margin-bottom:15px;
    ">
        모든 라운드에서 모든 등급의 증강이 등장할 수 있습니다.
    </div>

    <div id="augmentChoices"></div>

</div>

</div>


<!-- 선택 UI -->

<div id="suitOverlay">

<div class="overlayBox">

    <div class="overlayTitle" id="selectionTitle">
        원하는 수트를 선택하세요
    </div>

    <div id="suitChoices">

        <button class="suitButton" data-suit="0">
            ♥ 하트
        </button>

        <button class="suitButton" data-suit="1">
            ♦ 다이아
        </button>

        <button class="suitButton" data-suit="2">
            ♣ 클로버
        </button>

        <button class="suitButton" data-suit="3">
            ♠ 스페이드
        </button>

    </div>

</div>

</div>


<!-- 결과 -->

<div id="resultOverlay">

<div class="overlayBox">

    <div id="resultContent"></div>

    <div style="text-align:center">

        <button
            class="actionBtn primary"
            id="resultBtn">
            계속
        </button>

    </div>

</div>

</div>

<div id="flash"></div>


<script>

/* =========================================================
   CARD DATA
========================================================= */

const SUITS=[
    {name:"하트",symbol:"♥",color:"red"},
    {name:"다이아",symbol:"♦",color:"red"},
    {name:"클로버",symbol:"black"},
    {name:"스페이드",symbol:"black"}
];

const RANKS=[
    {name:"2",value:2},
    {name:"3",value:3},
    {name:"4",value:4},
    {name:"5",value:5},
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}
];


/* =========================================================
   STATE
========================================================= */

let state={};

let selectionCallback=null;

let selectionMode=null;

let selectedAugmentId=null;


/* =========================================================
   AUGMENTS
========================================================= */

const AUGMENTS=[

{
    id:"silver_draw",
    name:"추가 드로우",
    rarity:"silver",
    desc:"손패가 8장보다 적다면 카드 1장을 뽑습니다.",
    action(){

        if(state.hand.length>=8){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        drawCards(1);

        log("⚡ 추가 드로우 발동!");
        return true;
    }
},

{
    id:"silver_suit",
    name:"수트 변경",
    rarity:"silver",
    desc:"손패의 카드 1장을 원하는 수트로 변경합니다.",
    action(){

        beginCardSelection(
            "suit",
            1,
            "수트를 변경할 카드 1장을 선택하세요.",
            index=>{
                openSuitSelector([index]);
            }
        );

        return true;
    }
},

{
    id:"silver_luck",
    name:"행운의 카드",
    rarity:"silver",
    desc:"손패가 8장 미만이면 무작위 카드 1장을 추가합니다.",
    action(){

        if(state.hand.length>=8){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        drawCards(1);

        log("🍀 행운의 카드 발동!");

        return true;
    }
},

{
    id:"silver_replace",
    name:"카드 교체",
    rarity:"silver",
    desc:"손패의 카드 1장을 선택해 새 카드로 교체합니다.",
    action(){

        beginCardSelection(
            "replace",
            1,
            "교체할 카드 1장을 선택하세요.",
            index=>{

                state.hand[index]=drawOne();

                clearSelectionMode();

                sortHand();

                render();

                log("🔄 카드 1장을 교체했습니다.");
            }
        );

        return true;
    }
},

{
    id:"silver_pair",
    name:"쌍둥이",
    rarity:"silver",
    desc:"손패의 카드 1장을 선택하면 같은 숫자의 카드를 추가합니다.",
    action(){

        if(state.hand.length>=8){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        beginCardSelection(
            "twin",
            1,
            "복제할 카드 1장을 선택하세요.",
            index=>{

                const card=state.hand[index];

                state.hand.push({
                    suit:card.suit,
                    rank:card.rank,
                    id:"twin-"+Math.random()
                });

                clearSelectionMode();

                sortHand();

                render();

                log("👯 쌍둥이 카드가 생성되었습니다.");
            }
        );

        return true;
    }
},


{
    id:"gold_draw2",
    name:"대량 드로우",
    rarity:"gold",
    desc:"손패가 8장이 될 때까지 최대 2장을 뽑습니다.",
    action(){

        const amount=Math.min(
            2,
            8-state.hand.length
        );

        if(amount<=0){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        drawCards(amount);

        log("🔥 대량 드로우!");

        return true;
    }
},

{
    id:"gold_swap",
    name:"상대 패 교환",
    rarity:"gold",
    desc:"내 카드 1장과 AI 카드 1장을 무작위로 교환합니다.",
    action(){

        if(
            state.hand.length===0 ||
            state.enemyHand.length===0
        ){
            return false;
        }

        const a=
            Math.floor(
                Math.random()*state.hand.length
            );

        const b=
            Math.floor(
                Math.random()*state.enemyHand.length
            );

        const temp=state.hand[a];

        state.hand[a]=state.enemyHand[b];
        state.enemyHand[b]=temp;

        sortHand();

        render();
        renderEnemy();

        log("💰 상대 카드와 내 카드가 교환되었습니다.");

        return true;
    }
},

{
    id:"gold_twoSuit",
    name:"이중 수트 변환",
    rarity:"gold",
    desc:"카드 2장을 선택해 원하는 수트로 변경합니다.",
    action(){

        beginCardSelection(
            "multiSuit",
            2,
            "수트를 변경할 카드 2장을 선택하세요.",
            indexes=>{
                openSuitSelector(indexes);
            }
        );

        return true;
    }
},

{
    id:"gold_extra",
    name:"여분의 한 장",
    rarity:"gold",
    desc:"이번 라운드에 제출 가능한 카드가 6장으로 증가합니다.",
    action(){

        state.maxSubmit=6;

        log("🔥 이번 라운드는 6장 제출 가능!");

        showMessage(
            "이번 라운드에는 6장을 제출할 수 있습니다."
        );

        return true;
    }
},

{
    id:"gold_reroll",
    name:"운명 재굴림",
    rarity:"gold",
    desc:"손패의 카드 2장을 무작위 카드로 바꿉니다.",
    action(){

        if(state.hand.length<2)
            return false;

        const indexes=shuffle(
            [...Array(state.hand.length).keys()]
        ).slice(0,2);

        indexes.forEach(i=>{
            state.hand[i]=drawOne();
        });

        sortHand();
        render();

        log("🎲 카드 2장이 재굴림되었습니다.");

        return true;
    }
},


{
    id:"plat_draw3",
    name:"플래티넘 드로우",
    rarity:"platinum",
    desc:"손패가 8장이 될 때까지 최대 3장을 뽑습니다.",
    action(){

        const amount=Math.min(
            3,
            8-state.hand.length
        );

        if(amount<=0){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        drawCards(amount);

        log("💎 플래티넘 드로우!");

        return true;
    }
},

{
    id:"plat_wild",
    name:"와일드 카드",
    rarity:"platinum",
    desc:"카드 1장을 원하는 숫자와 수트로 완전히 변경합니다.",
    action(){

        beginCardSelection(
            "wild",
            1,
            "와일드로 바꿀 카드 1장을 선택하세요.",
            index=>{
                openWildSelector(index);
            }
        );

        return true;
    }
},

{
    id:"plat_steal",
    name:"왕의 교환",
    rarity:"platinum",
    desc:"내 카드 2장과 AI 카드 2장을 서로 교환합니다.",
    action(){

        if(
            state.hand.length<2 ||
            state.enemyHand.length<2
        ){
            return false;
        }

        const my=shuffle(
            [...Array(state.hand.length).keys()]
        ).slice(0,2);

        const enemy=shuffle(
            [...Array(state.enemyHand.length).keys()]
        ).slice(0,2);

        for(let i=0;i<2;i++){

            const temp=state.hand[my[i]];

            state.hand[my[i]]
                =state.enemyHand[enemy[i]];

            state.enemyHand[enemy[i]]
                =temp;
        }

        sortHand();

        render();
        renderEnemy();

        log("👑 왕의 교환 발동!");

        return true;
    }
},

/* =========================================================
   RESET
========================================================= */

function resetGame(){

    clearInterval(
        state.timerInterval
    );

    state={

        stage:1,

        deck:[],

        hand:[],
        enemyHand:[],

        selected:[],

        maxSubmit:5,

        discards:0,
        maxDiscards:3,

        timer:30,
        timerMax:30,

        augmentOwned:[],
        usedAugments:[],

        gameOver:false,
        awaitingAugment:false,

        selectionMode:null,
        tempSelected:[]

    };

    startRound();
}


/* =========================================================
   DECK
========================================================= */

function createDeck(){

    const deck=[];

    for(let s=0;s<4;s++){

        for(let r=0;r<13;r++){

            deck.push({
                suit:s,
                rank:r,
                id:`${s}-${r}-${Math.random()}`
            });

        }
    }

    return shuffle(deck);
}

function drawOne(){

    if(state.deck.length===0){

        state.deck=createDeck();

    }

    return state.deck.pop();
}

function drawCards(amount){

    for(let i=0;i<amount;i++){

        if(state.hand.length>=8)
            break;

        state.hand.push(
            drawOne()
        );
    }

    sortHand();

    render();

    playSound("draw");
}


/* =========================================================
   SORT
========================================================= */

function sortHand(){

    /*
        높은 숫자부터 정렬.
        같은 숫자는 수트 순서.
    */

    state.hand.sort((a,b)=>{

        const rankDiff=
            RANKS[b.rank].value-
            RANKS[a.rank].value;

        if(rankDiff!==0)
            return rankDiff;

        return a.suit-b.suit;
    });
}


/* =========================================================
   UTIL
========================================================= */

function shuffle(arr){

    const a=[...arr];

    for(let i=a.length-1;i>0;i--){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [a[i],a[j]]=
            [a[j],a[i]];
    }

    return a;
}

function log(text){

    const el=
        document.getElementById("log");

    el.innerHTML+=
        `<div>• ${text}</div>`;

    el.scrollTop=el.scrollHeight;
}

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent=text;
}

function flash(type){

    const f=
        document.getElementById("flash");

    f.className="";

    void f.offsetWidth;

    f.className=
        type==="win"
        ?"winFlash"
        :"loseFlash";
}


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function initAudio(){

    if(!audioCtx){

        audioCtx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function tone(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    try{

        initAudio();

        const osc=
            audioCtx.createOscillator();

        const gain=
            audioCtx.createGain();

        osc.frequency.value=frequency;
        osc.type=type;

        gain.gain.value=volume;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+duration
        );

        osc.stop(
            audioCtx.currentTime+duration
        );

    }catch(e){}
}

function playSound(type){

    if(type==="draw"){

        tone(520,.07,"triangle",.045);

    }

    else if(type==="select"){

        tone(700,.045,"sine",.03);

    }

    else if(type==="submit"){

        tone(440,.07,"triangle",.04);

        setTimeout(
            ()=>tone(660,.09,"triangle",.04),
            70
        );

    }

    else if(type==="augment"){

        tone(500,.08,"triangle",.05);

        setTimeout(
            ()=>tone(700,.1,"triangle",.05),
            80
        );

        setTimeout(
            ()=>tone(900,.14,"triangle",.05),
            160
        );

    }

    else if(type==="win"){

        tone(500,.1);

        setTimeout(
            ()=>tone(700,.1),
            100
        );

        setTimeout(
            ()=>tone(900,.2),
            200
        );

    }

    else if(type==="lose"){

        tone(250,.15,"sawtooth",.06);

        setTimeout(
            ()=>tone(170,.3,"sawtooth",.05),
            150
        );
    }
}


/* =========================================================
   ROUND START
========================================================= */

function startRound(){

    clearInterval(
        state.timerInterval
    );

    state.deck=createDeck();

    state.hand=[];
    state.enemyHand=[];

    state.selected=[];

    state.maxSubmit=5;

    state.discards=0;

    clearSelectionMode();

    while(state.hand.length<6){

        state.hand.push(
            drawOne()
        );

    }

    /*
        AI도 8장 보유
    */

    while(state.enemyHand.length<8){

        state.enemyHand.push(
            drawOne()
        );

    }

    prepareEnemyForStage();

    sortHand();

    render();
    renderEnemy();

    updateStage();

    startTimer();

    showMessage(
        "카드 5장을 선택하세요."
    );

    log(
        `STAGE ${state.stage} 시작 — 손패 6장`
    );
}


/* =========================================================
   AI DIFFICULTY
========================================================= */

function prepareEnemyForStage(){

    const difficulty=
        (state.stage-1)/7;

    /*
        후반 스테이지일수록
        AI에게 높은 카드가 조금 더 자주 들어감.
    */

    for(
        let i=0;
        i<state.enemyHand.length;
        i++
    ){

        if(
            Math.random()<
            difficulty*.22
        ){

            const strongRanks=[
                8,9,10,11,12
            ];

            state.enemyHand[i]={
                suit:
                    Math.floor(
                        Math.random()*4
                    ),
                rank:
                    strongRanks[
                        Math.floor(
                            Math.random()*
                            strongRanks.length
                        )
                    ],
                id:"ai-"+Math.random()
            };
        }
    }
}


/* =========================================================
   RENDER PLAYER
========================================================= */

function render(){

    const hand=
        document.getElementById("hand");

    hand.innerHTML="";

    state.hand.forEach(
        (card,index)=>{

            const suit=SUITS[card.suit];
            const rank=RANKS[card.rank];

            const div=
                document.createElement("div");

            div.className=
                `card ${suit.color}`;

            if(
                state.selected.includes(index)
            ){
                div.classList.add("selected");
            }

            if(
                state.tempSelected &&
                state.tempSelected.includes(index)
            ){

                div.style.borderColor="#b35cff";

                div.style.boxShadow=
                    "0 0 22px #b35cff88";
            }

            div.innerHTML=`

                <div class="rank">
                    ${rank.name}
                </div>

                <div class="cardCenter">
                    ${suit.symbol}
                </div>

                <div class="suit">
                    ${suit.symbol}
                </div>
            `;

            div.addEventListener(
                "click",
                ()=>{
                    initAudio();
                    handleCardClick(index);
                }
            );

            hand.appendChild(div);
        }
    );

    document.getElementById(
        "handCount"
    ).textContent=
        state.hand.length;

    renderAugments();
}


/* =========================================================
   RENDER ENEMY
========================================================= */

function renderEnemy(reveal=false){

    const enemy=
        document.getElementById(
            "enemyHand"
        );

    enemy.innerHTML="";

    state.enemyHand.forEach(card=>{

        const div=
            document.createElement("div");

        if(!reveal){

            div.className="enemyCard";

        }else{

            const suit=SUITS[card.suit];
            const rank=RANKS[card.rank];

            div.className=
                `enemyCard revealed ${suit.color}`;

            div.innerHTML=`

                <div class="enemyRank">
                    ${rank.name}
                </div>

                <div class="enemySuit">
                    ${suit.symbol}
                </div>
            `;
        }

        enemy.appendChild(div);
    });
}


/* =========================================================
   CARD CLICK
========================================================= */

function handleCardClick(index){

    /*
        ★ 중요
        증강 후속 선택 모드가 있다면
        일반 제출 선택보다 먼저 처리.
    */

    if(state.selectionMode){

        handleAugmentSelection(index);

        return;
    }

    /*
        일반 카드 선택
    */

    const pos=
        state.selected.indexOf(index);

    if(pos>=0){

        state.selected.splice(pos,1);

    }else{

        if(
            state.selected.length<
            state.maxSubmit
        ){

            state.selected.push(index);

        }else{

            showMessage(
                `최대 ${state.maxSubmit}장까지 선택할 수 있습니다.`
            );

            return;
        }
    }

    playSound("select");

    render();

    showMessage(
        `${state.selected.length}/${state.maxSubmit}장 선택`
    );
}


/* =========================================================
   AUGMENT CARD SELECTION MODE
========================================================= */

function beginCardSelection(
    mode,
    count,
    message,
    callback
){

    state.selectionMode={
        mode,
        count,
        callback
    };

    state.tempSelected=[];

    showMessage(message);

    render();
}

function handleAugmentSelection(index){

    if(
        state.tempSelected.includes(index)
    ){
        return;
    }

    state.tempSelected.push(index);

    playSound("select");

    render();

    const mode=
        state.selectionMode;

    showMessage(
        `${state.tempSelected.length}/${mode.count}장 선택`
    );

    if(
        state.tempSelected.length>=mode.count
    ){

        const indexes=[
            ...state.tempSelected
        ];

        /*
            callback 실행 후
            callback 내부에서 선택 UI를
            계속 사용할 수 있도록
            여기서는 callback 전에만 저장.
        */

        state.selectionMode=null;
        state.tempSelected=[];

        mode.callback(indexes);

    }
}

function clearSelectionMode(){

    state.selectionMode=null;

    state.tempSelected=[];

    state.selected=[];

    selectedAugmentId=null;
}


/* =========================================================
   SUIT SELECTOR
========================================================= */

function openSuitSelector(indexes){

    selectionCallback=suit=>{

        indexes.forEach(index=>{

            if(state.hand[index]){
                state.hand[index].suit=suit;
            }

        });

        clearSelectionMode();

        sortHand();

        render();

        closeSuitOverlay();

        log(
            `✨ ${indexes.length}장의 수트를 ${SUITS[suit].name}으로 변경했습니다.`
        );

        showMessage(
            "수트 변경 완료! 이제 평소처럼 카드를 선택할 수 있습니다."
        );
    };

    document.getElementById(
        "selectionTitle"
    ).textContent=
        "원하는 수트를 선택하세요";

    document.getElementById(
        "suitOverlay"
    ).style.display="flex";
}

function closeSuitOverlay(){

    document.getElementById(
        "suitOverlay"
    ).style.display="none";

    selectionCallback=null;
}

document.querySelectorAll(
    ".suitButton"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            const suit=
                Number(
                    button.dataset.suit
                );

            if(selectionCallback){

                const callback=
                    selectionCallback;

                selectionCallback=null;

                closeSuitOverlay();

                callback(suit);
            }
        }
    );
});

/* =========================================================
   AUGMENT LIST
========================================================= */

function renderAugments(){

    const list=
        document.getElementById(
            "augmentList"
        );

    if(
        state.augmentOwned.length===0
    ){

        list.innerHTML=`
            <div style="
                color:#77869c;
                font-size:13px;
            ">
                아직 증강이 없습니다.
            </div>
        `;

        return;
    }

    list.innerHTML="";

    state.augmentOwned.forEach(
        augment=>{

            const used=
                state.usedAugments
                    .includes(
                        augment.id
                    );

            const div=
                document.createElement(
                    "div"
                );

            div.className=
                "augmentCard"+
                (used?" used":"");

            div.innerHTML=`

                <div class="rarity ${augment.rarity}">
                    ${augment.rarity.toUpperCase()}
                </div>

                <div class="augmentName">
                    ${augment.name}
                </div>

                <div class="augmentDesc">
                    ${augment.desc}
                </div>

                <div style="
                    margin-top:7px;
                    font-size:11px;
                    color:${
                        used
                        ?"#899"
                        :"#75f0ae"
                    };
                ">
                    ${
                        used
                        ?"✓ 사용 완료"
                        :"▶ 클릭해서 발동"
                    }
                </div>
            `;

            div.addEventListener(
                "click",
                ()=>{

                    if(used)
                        return;

                    activateAugment(
                        augment
                    );
                }
            );

            list.appendChild(div);
        }
    );
}


/* =========================================================
   ACTIVATE AUGMENT
========================================================= */

function activateAugment(augment){

    if(state.gameOver)
        return;

    if(
        state.usedAugments
            .includes(augment.id)
    ){
        return;
    }

    /*
        ★ 사용 즉시 used 처리
        후속 카드 선택은 별도의
        selectionMode에서 관리
    */

    const success=
        augment.action();

    if(success!==false){

        state.usedAugments.push(
            augment.id
        );

        selectedAugmentId=null;

        playSound("augment");

        renderAugments();

        log(
            `⚡ ${augment.name} 발동!`
        );
    }
}


/* =========================================================
   AUGMENT CHOICES
========================================================= */

function generateAugmentChoices(){

    const available=
        AUGMENTS.filter(
            augment=>
                !state.augmentOwned
                    .some(
                        a=>
                            a.id===
                            augment.id
                    )
        );

    if(available.length<=3)
        return shuffle(available);

    /*
        모든 라운드 동일한 전체 풀.
        스테이지 조건 없음.
    */

    if(Math.random()<.15){

        const platinum=
            available.filter(
                a=>
                    a.rarity==="platinum"
            );

        if(platinum.length>=3){

            return shuffle(
                platinum
            ).slice(0,3);

        }
    }

    return shuffle(
        available
    ).slice(0,3);
}


/* =========================================================
   AUGMENT SELECTION
========================================================= */

function openAugmentSelection(){

    clearInterval(
        state.timerInterval
    );

    state.awaitingAugment=true;

    const choices=
        generateAugmentChoices();

    const container=
        document.getElementById(
            "augmentChoices"
        );

    container.innerHTML="";

    choices.forEach(
        augment=>{

            const div=
                document.createElement(
                    "div"
                );

            div.className="choice";

            div.innerHTML=`

                <div class="rarity ${augment.rarity}">
                    ${augment.rarity.toUpperCase()}
                </div>

                <h3>
                    ${augment.name}
                </h3>

                <p>
                    ${augment.desc}
                </p>

                <div style="
                    margin-top:20px;
                    color:#73efa8;
                    font-weight:bold;
                ">
                    클릭하여 획득
                </div>
            `;

            div.onclick=()=>{

                state.augmentOwned.push(
                    augment
                );

                state.awaitingAugment=false;

                document.getElementById(
                    "augmentOverlay"
                ).style.display="none";

                renderAugments();

                playSound("augment");

                log(
                    `⚡ ${augment.name} 획득!`
                );

                state.stage++;

                if(state.stage>8){

                    winGame();

                }else{

                    startRound();
                }
            };

            container.appendChild(div);
        }
    );

    document.getElementById(
        "augmentOverlay"
    ).style.display="flex";
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(
        state.timerInterval
    );

    state.timer=state.timerMax;

    state.tenSecondWarned=false;

    updateTimer();

    state.timerInterval=
        setInterval(
            ()=>{

                state.timer-=.1;

                updateTimer();

                if(
                    state.timer<=10 &&
                    state.timer>0 &&
                    !state.tenSecondWarned
                ){

                    state.tenSecondWarned=true;

                    showMessage(
                        '🤖 AI: "카드 5장 고르는 게 그렇게 어렵나?"'
                    );

                    log(
                        '🤖 AI: "카드 5장 고르는 게 그렇게 어렵나?"'
                    );
                }

                if(
                    state.timer<=0
                ){

                    clearInterval(
                        state.timerInterval
                    );

                    timeoutSubmit();

                }

            },
            100
        );
}

function updateTimer(){

    const ratio=
        Math.max(
            0,
            state.timer/state.timerMax
        );

    document.getElementById(
        "timer"
    ).style.width=
        `${ratio*100}%`;

    document.getElementById(
        "timerText"
    ).textContent=
        `제한시간 ${Math.ceil(state.timer)}초`;
}


/* =========================================================
   DISCARD
========================================================= */

document.getElementById(
    "discardBtn"
).onclick=()=>{

    if(state.selectionMode){

        showMessage(
            "먼저 사용 중인 증강의 카드 선택을 완료하세요."
        );

        return;
    }

    if(state.selected.length===0){

        showMessage(
            "버릴 카드를 선택하세요."
        );

        return;
    }

    if(
        state.discards>=
        state.maxDiscards
    ){

        showMessage(
            "이번 라운드의 버리기를 모두 사용했습니다."
        );

        return;
    }

    const removed=
        [...state.selected]
            .sort((a,b)=>b-a);

    removed.forEach(
        index=>{
            state.hand.splice(
                index,
                1
            );
        }
    );

    state.selected=[];

    state.discards++;

    /*
        기본 손패 6장까지 보충.
        최대 8장.
    */

    while(
        state.hand.length<6 &&
        state.hand.length<8
    ){

        state.hand.push(
            drawOne()
        );
    }

    sortHand();

    render();

    playSound("draw");

    log(
        `🗑️ 버리기 ${state.discards}/${state.maxDiscards}`
    );

    if(
        state.discards>=
        state.maxDiscards
    ){

        showMessage(
            '🤖 AI: "손패가 너무 안좋으신가봐?"'
        );

        log(
            '🤖 AI: "손패가 너무 안좋으신가봐?"'
        );

    }else{

        showMessage(
            "버린 카드가 보충되었습니다."
        );
    }
};

document.getElementById(

function timeoutSubmit(){

    if(
        state.selected.length===0
    ){

        state.selected=
            [...Array(
                Math.min(
                    state.maxSubmit,
                    state.hand.length
                )
            ).keys()];
    }

    while(
        state.selected.length<
        Math.min(
            state.maxSubmit,
            state.hand.length
        )
    ){

        const candidates=
            [...Array(
                state.hand.length
            ).keys()]
            .filter(
                i=>
                    !state.selected
                        .includes(i)
            );

        if(
            candidates.length===0
        )
            break;

        state.selected.push(
            candidates[0]
        );
    }

    submitHand();
}

function submitHand(){

    if(
        state.selected.length===0
    ){

        showMessage(
            "최소 1장의 카드를 선택하세요."
        );

        return;
    }

    clearInterval(
        state.timerInterval
    );

    /*
        플레이어 제출 패
    */

    const playerCards=
        state.selected.map(
            i=>state.hand[i]
        );

    /*
        AI 최강 5장
    */

    const enemyBest=
        bestFiveFromHand(
            state.enemyHand
        );

    const playerScore=
        evaluateHand(
            playerCards
        );

    const enemyScore=
        evaluateHand(
            enemyBest
        );

    playSound("submit");

    log(
        `👤 PLAYER: ${playerScore.name}`

        `🤖 AI: ${enemyScore.name}`

        ],

        comparison:

    /*
        패배하면 즉시 게임 종료.

    */

    showResult();
}


/* =========================================================
   POKER EVALUATION
========================================================= */

function evaluateHand(cards){

    const values=
        cards.map(
            c=>RANKS[c.rank].value
        ).sort(
            (a,b)=>b-a
        );

    const suits=
        cards.map(
            c=>c.suit
        );

    const counts={};

    values.forEach(
        v=>{
            counts[v]=
                (counts[v]||0)+1;
        }
    );

    const groups=
        Object.entries(counts)
            .map(
                ([value,count])=>({
                    value:Number(value),
                    count
                })
            )
            .sort(
                (a,b)=>
                    b.count-a.count ||
                    b.value-a.value
            );

    const unique=
        [...new Set(values)]
            .sort(
                (a,b)=>b-a
            );

    let straightHigh=null;

    if(
        unique.includes(14)
    ){
        unique.push(1);
    }

    for(
        let i=0;
        i<=unique.length-5;
        i++
    ){

        const slice=
            unique.slice(
                i,
                i+5
            );

        if(
            slice[0]-
            slice[4]===4
        ){

            straightHigh=
                slice[0];

            break;
        }
    }

    const flush=
        cards.length===5 &&
        suits.every(
            s=>s===suits[0]
        );

    if(
        flush &&
        straightHigh
    ){

        return {
            rank:8,
            values:[straightHigh],
            name:"스트레이트 플러시"
        };
    }

    if(
        groups[0]?.count===4
    ){

        return {
            rank:7,
            values:[
                groups[0].value,
                groups[1]?.value||0
            ],
            name:"포카드"
        };
    }

    if(
        groups[0]?.count===3 &&
        groups[1]?.count===2
    ){

        return {
            rank:6,
            values:[
                groups[0].value,
                groups[1].value
            ],
            name:"풀하우스"
        };
    }

    if(flush){

        return {
            rank:5,
            values,
            name:"플러시"
        };
    }

    if(straightHigh){

        return {
            rank:4,
            values:[straightHigh],
            name:"스트레이트"
        };
    }

    if(
        groups[0]?.count===3
    ){

        return {
            rank:3,
            values:[
                groups[0].value,
                ...groups
                    .slice(1)
                    .map(
                        x=>x.value
                    )
                    .sort(
                        (a,b)=>b-a
                    )
            ],
            name:"트리플"
        };
    }

    if(
        groups[0]?.count===2 &&
        groups[1]?.count===2
    ){

        return {
            rank:2,
            values:[
                Math.max(
                    groups[0].value,
                    groups[1].value
                ),
                Math.min(
                    groups[0].value,
                    groups[1].value
                ),
                groups[2]?.value||0
            ],
            name:"투페어"
        };
    }

    if(
        groups[0]?.count===2
    ){

        return {
            rank:1,
            values:[
                groups[0].value,
                ...groups
                    .slice(1)
                    .map(
                        x=>x.value
                    )
                    .sort(
                        (a,b)=>b-a
                    )
            ],
            name:"원페어"
        };
    }

    return {
        rank:0,
        values,
        name:"하이카드"
    };
}

function compareScores(a,b){

    if(
        a.rank!==b.rank
    ){

        return a.rank-b.rank;
    }

    for(
        let i=0;
        i<
        Math.max(
            a.values.length,
            b.values.length
        );
        i++
    ){

        const av=
            a.values[i]||0;

        const bv=
            b.values[i]||0;

        if(av!==bv)
            return av-bv;
    }

    return 0;
}


/* =========================================================
   BEST 5
========================================================= */

function bestFiveFromHand(hand){

    if(hand.length<=5)
        return [...hand];

    let best=null;
    let bestScore=null;

    const n=hand.length;

    for(
        let a=0;
        a<n-4;
        a++
    ){

        for(
            let b=a+1;
            b<n-3;
            b++
        ){

            for(
                let c=b+1;
                c<n-2;
                c++
            ){

                for(
                    let d=c+1;
                    d<n-1;
                    d++
                ){

                    for(
                        let e=d+1;
                        e<n;
                        e++
                    ){

                        const five=[
                            hand[a],
                            hand[b],
                            hand[c],
                            hand[d],
                            hand[e]
                        ];

                        const score=
                            evaluateHand(
                                five
                            );

                        if(
                            !bestScore ||
                            compareScores(
                                score,
                                bestScore
                            )>0
                        ){

                            bestScore=score;
                            best=five;
                        }
                    }
                }
            }
        }
    }

    return best;
}

function createMiniCards(cards){

    return cards.map(
        card=>{

            const suit=
                SUITS[card.suit];

            const rank=
                RANKS[card.rank];

            return `
                <div class="miniCard ${suit.color}">

                    <div class="miniRank">
                        ${rank.name}
                    </div>

                    <div class="miniSuit">
                        ${suit.symbol}
                    </div>

                </div>
            `;
        }
    ).join("");
}

function scoreText(score){

    return `
        ${score.name}
        <div class="handScore">
            족보 등급 ${score.rank}
        </div>
    `;
}

function showResult(){

    }else{

        title="🤝 DRAW";

        reason=
            "두 플레이어의 족보가 동일합니다.";
    }

    document.getElementById(
        "resultContent"
    ).innerHTML=`

        <div class="resultHeader">
            ${title}
        </div>

        <div class="comparison">

            <div class="resultPanel">

                <h3>👤 PLAYER</h3>

                <div class="resultCards">
                    ${createMiniCards(
                        result.playerCards
                    )}
                </div>

                <div class="handRank">
                    ${scoreText(
                        result.playerScore
                    )}
                </div>

            </div>


            <div class="resultPanel">

                <h3>🤖 AI</h3>

                <div class="resultCards">
                    ${createMiniCards(
                        result.enemyCards
                    )}
                </div>

                <div class="handRank">
                    ${scoreText(
                        result.enemyScore
                    )}
                </div>

            </div>

        <div class="resultReason">

        </div>
    `;

    document.getElementById(

    /*

    */

        document.getElementById(
            "resultBtn"
        ).textContent=
            state.stage>=8

            "resultBtn"
        ).onclick=()=>{

            closeResult();

                winGame();

    }else{

        flash("lose");

        playSound("lose");

        document.getElementById(
            "resultBtn"
        ).textContent=
            "처음부터 다시";

        document.getElementById(
            "resultBtn"
        ).onclick=()=>{

            closeResult();

            resetGame();
        };

}
