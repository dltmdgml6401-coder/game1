<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>외계인 | 크리스털 쥐 포획</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:#061007;font-family:Arial,"Apple SD Gothic Neo",sans-serif;color:#fff;cursor:none}
    #game{position:relative;width:min(100vw,calc(100svh * 1.325));aspect-ratio:1.325;overflow:hidden;isolation:isolate;background:linear-gradient(#153e23 0 25%,#54823e 33%,#9a7038 48%,#5c3c1d 100%)}
    .forest{position:absolute;inset:0 0 55%;background:radial-gradient(circle at 8% 45%,#367b37 0 8%,transparent 9%),radial-gradient(circle at 22% 13%,#1e5b2e 0 15%,transparent 16%),radial-gradient(circle at 77% 14%,#245f30 0 19%,transparent 20%),radial-gradient(circle at 94% 45%,#2e7132 0 14%,transparent 15%),radial-gradient(ellipse at 50% 50%,#89b348,transparent 54%)}
    .fence{position:absolute;z-index:1;top:19%;left:-2%;width:104%;height:24%;display:flex;align-items:end;justify-content:space-around;border-bottom:10px solid #d8ca9d;transform:perspective(300px) rotateX(-9deg)}.fence:before,.fence:after{content:"";position:absolute;left:0;right:0;height:11px;border-radius:9px;background:#e3d4a7;box-shadow:0 3px #8d805f}.fence:before{top:42%}.fence:after{top:70%}.fence i{width:4%;height:86%;background:linear-gradient(90deg,#b7a982,#f4e8bd 45%,#b4a680);clip-path:polygon(50% 0,100% 13%,100% 100%,0 100%,0 13%)}
    .ground{position:absolute;inset:36% 0 0;background:radial-gradient(ellipse at 17% 18%,#b68a46 0 2%,transparent 3%),radial-gradient(ellipse at 80% 50%,#553616 0 1%,transparent 2%),repeating-radial-gradient(ellipse at 54% 40%,transparent 0 31px,rgba(47,25,5,.15) 32px 34px)}.ground:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(3,17,4,.4));pointer-events:none}
    .panel{border:2px solid #799842;border-radius:18px;background:linear-gradient(135deg,rgba(8,28,11,.95),rgba(24,45,17,.91));box-shadow:inset 0 0 0 2px rgba(218,255,130,.08),0 4px 9px #0007}.alien-card{position:absolute;z-index:5;left:2%;top:2%;width:30%;min-height:15%;display:flex;gap:2%;padding:1.1%;background:linear-gradient(135deg,#faefd0,#ded2af);border-color:#8e805a;color:#223122}.alien-card strong{font-size:clamp(14px,1.7cqw,25px)}.alien-card p{margin:.3em 0;font-weight:bold;line-height:1.5;font-size:clamp(10px,1.23cqw,18px)}.alien-card b{color:#207937}.portrait{width:34%;border-radius:11px;background:#d5cfb6;display:grid;place-items:center}.alien{position:relative;width:60%;aspect-ratio:.75;border:3px solid #28532b;border-radius:54% 54% 45% 45%;background:linear-gradient(135deg,#d4ff73,#4fbd48);filter:drop-shadow(0 3px 0 #366a35)}.alien:before{content:"";position:absolute;left:45%;top:-31%;width:9%;height:31%;border:3px solid #28532b;border-radius:90%;background:#5dca4b}.alien b{position:absolute;left:14%;top:-18%;width:32%;height:18%;border:3px solid #28532b;border-radius:100% 0 100% 0;background:#8bed63;transform:rotate(27deg)}.alien i{position:absolute;top:42%;width:31%;height:17%;border-radius:50%;background:#152115}.alien i:nth-child(2){left:13%;transform:rotate(24deg)}.alien i:nth-child(3){right:13%;transform:rotate(-24deg)}
    .hint{position:absolute;z-index:5;left:1%;top:20%;width:20%;padding:1%;display:flex;align-items:center;gap:7%;font-weight:bold;font-size:clamp(9px,1.15cqw,16px);line-height:1.5}.crystal{flex:none;width:31%;aspect-ratio:1;display:grid;place-items:center;border:2px solid #fff;border-radius:45% 55% 48% 52%;background:linear-gradient(135deg,#ffe0ff,#84e7ef 42%,#8465d6);box-shadow:0 0 12px #e7ffff;color:#fff;font-size:2.4cqw}.hint strong{color:#c8ff8b;font-size:1.12em}
    .stats{position:absolute;z-index:6;right:2%;top:2%;width:65%;height:14%;display:flex;gap:1.2%}.stat{width:27%;padding:1%;text-align:center}.stat span{display:block;color:#caff8b;font-size:clamp(10px,1.5cqw,21px);font-weight:bold}.stat strong{display:block;font-size:clamp(28px,4.2cqw,59px);line-height:1.06;text-shadow:0 3px #10200e}.stat:first-child strong{color:#caff8b;text-shadow:0 0 12px #69c53b,0 3px #1c4019}.comboStat{width:34%}.comboStat strong{font-size:clamp(21px,3.1cqw,43px)}.pips{display:flex;justify-content:center;gap:5%;margin:2% auto 0;width:70%}.pips i{width:14%;aspect-ratio:1;border:2px solid #92968b;border-radius:50%;background:#30352c}.pips i.on{background:#caff8b;border-color:#efffc5;box-shadow:0 0 10px #8fe957}.pause{margin-left:auto;width:12%;border:2px solid #9b8e65;border-radius:18px;background:linear-gradient(#f8edcc,#dfcfaa);color:#352e20;font-size:clamp(27px,3.5cqw,50px);font-weight:bold;cursor:pointer}
    #holes{position:absolute;z-index:4;left:11%;right:8%;top:30%;bottom:20%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);align-items:center;justify-items:center}.hole{position:relative;width:65%;height:73%;border:0;padding:0;background:transparent;overflow:visible;cursor:pointer;touch-action:manipulation}.burrow{position:absolute;z-index:2;left:15%;right:15%;bottom:10%;height:72%;overflow:hidden;border-radius:50% 50% 38% 38%;background:radial-gradient(ellipse at 50% 80%,#050705 0 45%,#21140b 70%,transparent 71%);pointer-events:none}.hole:before{content:"";position:absolute;z-index:4;left:4%;right:4%;bottom:4%;height:37%;border:clamp(6px,1cqw,14px) solid #76502c;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 3px #a47a43,0 4px 4px #1f11054d;pointer-events:none}.hole.active:after{content:"";position:absolute;z-index:0;inset:16% 11%;border-radius:50%;box-shadow:0 0 18px 9px #d5ff6fbb;animation:pulse .5s infinite alternate}.mouse{position:absolute;left:50%;bottom:9%;width:72%;height:104%;transform:translate(-50%,118%) scale(.9);transform-origin:50% 100%}.hole.active .mouse{animation:emerge .78s cubic-bezier(.18,.8,.25,1) both}.mouse .body{position:absolute;bottom:1%;left:12%;width:76%;height:63%;border:3px solid #36393a;border-radius:50% 50% 43% 43%;background:linear-gradient(135deg,#bebeba,#626662 66%);box-shadow:inset 9px 7px #ffffff45}.mouse .ear{position:absolute;z-index:1;top:14%;width:34%;aspect-ratio:1;border:3px solid #414343;border-radius:50%;background:#d4a7b4;box-shadow:inset 0 0 0 6px #e6bcc5}.ear.left{left:9%}.ear.right{right:9%}.eye{position:absolute;z-index:2;top:43%;width:13%;aspect-ratio:1;border:2px solid #fff;border-radius:50%;background:#111;box-shadow:0 0 3px #fff}.eye.left{left:28%}.eye.right{right:28%}.nose{position:absolute;z-index:2;top:57%;left:45%;width:12%;aspect-ratio:1;border-radius:50%;background:#eea6ac}.paw{position:absolute;z-index:3;bottom:4%;width:23%;height:19%;border:2px solid #484945;border-radius:50%;background:#aaa9a2}.paw.left{left:20%}.paw.right{right:20%}.hole.crystalMouse .body{border-color:#6348a5;background:linear-gradient(135deg,#f2d8ff,#85e8ed 38%,#8b7be4 65%,#214781);box-shadow:inset 10px 7px #ffffff9e,0 0 13px #befbff}.hole.crystalMouse .mouse:before{content:"✦";position:absolute;z-index:5;left:7%;top:13%;font-size:clamp(24px,3.5cqw,46px);color:#fff;text-shadow:0 0 11px #fff,0 0 20px #beefff;animation:twinkle .35s infinite alternate}
    .bottom{position:absolute;z-index:6;left:8%;bottom:4%;width:18%;padding:1%;text-align:center}.bottom span{font-size:clamp(10px,1.25cqw,17px);font-weight:bold}.bottom strong{display:block;font-size:clamp(23px,3cqw,42px)}.warning{position:absolute;z-index:6;right:7%;bottom:4%;width:22%;height:13%;display:flex;align-items:center;justify-content:center;gap:12%;color:#ff8585;font-size:clamp(17px,2.4cqw,36px);line-height:1.25;text-align:center}.warning b{font-size:3cqw}.hammer{--x:50%;--reach:47%;position:absolute;z-index:12;left:var(--x);bottom:-29%;width:12.5%;height:var(--reach);transform:translateX(-50%);pointer-events:none;transition:left .035s linear,height .055s ease-out}.arm{position:absolute;left:32%;bottom:-13%;width:36%;height:86%;border:clamp(6px,1.1cqw,16px) solid #237950;border-radius:48% 48% 0 0;background:linear-gradient(90deg,#1b8657,#77e968 46%,#2a985c);box-shadow:inset 9px 0 #b7ff78,0 0 14px #b8ff6d}.head{position:absolute;left:0;top:1%;width:100%;height:23%;border:clamp(3px,.65cqw,9px) solid #196142;border-radius:34%;background:linear-gradient(135deg,#d4ff7c,#63d958 49%,#21915a);box-shadow:inset 9px 7px #9df56a,0 0 12px #c8ff78;transform-origin:50% 330%}.head b{position:absolute;left:40%;top:8%;font-size:clamp(20px,2.5cqw,38px);color:#236849}.leaf{position:absolute;top:-51%;width:29%;height:68%;border:3px solid #1c653e;border-radius:100% 0 100% 0;background:#8ce767}.leaf.left{left:22%;transform:rotate(-35deg)}.leaf.right{right:22%;transform:scaleX(-1) rotate(-35deg)}.hammer.swing .head{animation:swing .22s ease-out}.impact{position:absolute;z-index:15;opacity:0;pointer-events:none;color:#fff8a4;font-size:clamp(35px,5cqw,70px);text-shadow:0 0 10px #fff,0 0 20px #c3ff68}.impact.show{animation:impact .28s ease-out}.feedback{position:absolute;z-index:20;left:50%;top:49%;opacity:0;pointer-events:none;white-space:nowrap;color:#f7ffaf;font-weight:900;font-size:clamp(28px,5cqw,70px);text-shadow:0 4px #2a4d1f,0 0 13px #e3ff84}.feedback.bad{color:#ff9aa1;text-shadow:0 4px #7c2630}.feedback.show{animation:feedback .7s ease-out}.modal{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:#02100599;backdrop-filter:blur(3px);cursor:auto}.modal.hide{display:none}.card{width:min(84%,490px);padding:clamp(24px,4cqw,48px);border:3px solid #b7e572;border-radius:24px;background:linear-gradient(145deg,#15371a,#0d2111);box-shadow:0 15px 0 #061008,0 20px 50px #000;text-align:center;line-height:1.7}.card p{margin:0;color:#c5ff80;font-size:13px;font-weight:bold;letter-spacing:.14em}.card h1{margin:8px 0 14px;font-size:clamp(27px,4cqw,48px);line-height:1.2}.card b{color:#caff8d}.card button{margin-top:23px;border:2px solid #e1ffb6;border-radius:14px;background:linear-gradient(#aefa62,#51a82f);box-shadow:0 5px #27651b;padding:12px 30px;color:#133314;font-weight:900;font-size:18px;cursor:pointer}@keyframes pulse{to{transform:scale(1.08)}}@keyframes twinkle{to{transform:scale(1.2) rotate(18deg);opacity:.55}}@keyframes emerge{0%{transform:translate(-50%,118%) scale(.82,.9)}42%{transform:translate(-50%,-11%) scale(1.04,.96)}68%{transform:translate(-50%,-4%) scale(.98,1.03)}100%{transform:translate(-50%,-7%) scale(1)}}@keyframes swing{50%{transform:rotate(-32deg) scale(.94)}100%{transform:rotate(0)}}@keyframes impact{30%{opacity:1;transform:scale(1.35)}100%{opacity:0;transform:scale(2)}}@keyframes feedback{20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
  </style>
  <style>
    #holes{left:13%;right:10%;top:37%;bottom:18%;grid-template-rows:repeat(3,1fr)}
    .hole{width:61%;height:70%;border-radius:50%;background:transparent;filter:drop-shadow(0 6px 4px rgba(45,22,4,.36))}
    .burrow{left:9%;right:9%;bottom:14%;height:54%;isolation:isolate;overflow:hidden;border-radius:50%;background:radial-gradient(ellipse at 50% 57%,#020302 0 46%,#160c06 63%,#422512 76%,transparent 77%);box-shadow:inset 0 10px 15px rgba(0,0,0,.9)}
    .hole:before{z-index:2;left:1%;right:1%;bottom:8%;height:64%;background:radial-gradient(ellipse at 50% 50%,transparent 0 51%,#d19e56 52% 57%,#8a4e1e 58% 67%,#59300f 68% 72%,transparent 73%);box-shadow:0 4px 3px rgba(47,22,3,.4)}
    .hole.active:after{display:none}
    .mouse{z-index:3;width:68%;height:150%;bottom:22%;transform:translate(-50%,145%) scale(.82,.88);opacity:0;filter:drop-shadow(0 4px 2px rgba(0,0,0,.58));will-change:transform,opacity}
    .hole.active .mouse{animation:mouse-peek 850ms cubic-bezier(.22,.72,.25,1) both}
    .hole.crystalMouse.active .mouse{animation-duration:1120ms}
    .hole.active .burrow{animation:burrow-rustle 380ms ease-out 150ms both}
    @keyframes mouse-peek{0%,14%{transform:translate(-50%,145%) scale(.82,.88);opacity:0}22%{opacity:1}45%{transform:translate(-50%,-18%) scale(1.035,.97);opacity:1}58%{transform:translate(-50%,-10%) scale(.99,1.02);opacity:1}70%{transform:translate(-50%,-13%) scale(1,1);opacity:1}83%{transform:translate(-50%,10%) scale(.97,.99);opacity:1}100%{transform:translate(-50%,145%) scale(.82,.88);opacity:0}}
    @keyframes burrow-rustle{0%,100%{transform:translateX(0)}35%{transform:translateX(-2.2%)}68%{transform:translateX(1.5%)}}
  </style>
</head>
<body>
<main id="game"><div class="forest"></div><div class="fence"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ground"></div>
  <aside class="alien-card panel"><div class="portrait"><div class="alien"><b></b><i></i><i></i></div></div><div><p>망치 형태로 변형!<br><b>쥐(구슬 조각)를 5번 연속</b>으로<br>때려야 잡을 수 있어!</p></div></aside>
  <aside class="hint panel"><div class="crystal">✦</div><p>구슬 조각 <b>(정체)</b><br><strong>크리스털처럼<br>빛나는 쥐</strong>를 찾아봐!</p></aside>
  <section class="stats"><div class="panel stat"><span>TIME</span><strong id="time">60</strong></div><div class="panel stat"><span>SCORE</span><strong id="score">0</strong></div><div class="panel stat comboStat"><span>COMBO</span><strong id="combo">0 / 5</strong><div id="topPips" class="pips"></div></div><button id="pause" class="pause">Ⅱ</button></section>
  <section id="holes" aria-label="쥐 구멍"></section><section class="bottom panel"><span>연속 성공</span><strong id="bottomCombo">0 / 5</strong><div id="bottomPips" class="pips"></div></section><section class="warning panel"><strong>Miss 시<br>리셋!</strong><b>💥</b></section>
  <div id="feedback" class="feedback"></div><div id="hammer" class="hammer"><div class="arm"></div><div class="head"><i class="leaf left"></i><i class="leaf right"></i><b>✦</b></div></div><div id="impact" class="impact">✦</div>
  <div id="modal" class="modal"><div class="card"><p>MINI GAME 01</p><h1>크리스털 쥐를 잡아라!</h1><div>빛나는 크리스털 쥐를 <b>5번 연속</b> 클릭하세요.<br>회색 쥐 또는 빈 구멍을 클릭하면 연속 성공이 초기화됩니다.</div><button id="start">탐색 시작</button></div></div>
</main>
<script>
  const $=s=>document.querySelector(s), game=$('#game'), holes=$('#holes'), time=$('#time'), score=$('#score'), combo=$('#combo'), bottomCombo=$('#bottomCombo'), topPips=$('#topPips'), bottomPips=$('#bottomPips'), modal=$('#modal'), feedback=$('#feedback'), hammer=$('#hammer'), impact=$('#impact');
  const state={mode:'intro',seconds:60,score:0,combo:0,active:null,tick:null,pop:null};
  function mouseHTML(){return '<span class="burrow"></span><span class="mouse"><i class="ear left"></i><i class="ear right"></i><i class="body"></i><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="paw left"></i><i class="paw right"></i></span>'}
  for(let i=0;i<8;i++){const h=document.createElement('button');h.className='hole';h.type='button';h.setAttribute('aria-label',(i+1)+'번 구멍');h.innerHTML=mouseHTML();h.onpointerdown=e=>hit(e,h);holes.append(h)}
  function draw(){time.textContent=state.seconds;score.textContent=state.score;combo.textContent=state.combo+' / 5';bottomCombo.textContent=state.combo+' / 5';[topPips,bottomPips].forEach(root=>root.replaceChildren(...Array.from({length:5},(_,i)=>{let p=document.createElement('i');if(i<state.combo)p.className='on';return p})))}
  function clear(){clearTimeout(state.pop);if(state.active){state.active.el.classList.remove('active','crystalMouse');state.active=null}}
  function schedule(ms=500+Math.random()*350){state.pop=setTimeout(pop,ms)}
  function pop(){if(state.mode!=='play')return;const el=holes.children[Math.floor(Math.random()*8)],crystal=Math.random()<.34;state.active={el,crystal};el.classList.add('active');el.classList.toggle('crystalMouse',crystal);state.pop=setTimeout(()=>{if(!state.active)return;if(state.active.crystal)fail('MISS!');else{clear();schedule()}},crystal?1120:850)}
  function hit(e,el){if(state.mode!=='play')return;swing(e.clientX,e.clientY);if(!state.active||state.active.el!==el)return fail('MISS!');const crystal=state.active.crystal;clear();if(crystal){state.combo++;state.score+=200+(state.combo-1)*100;flash(state.combo+' COMBO!');if(state.combo===5)return finish(true)}else{state.combo=0;state.score=Math.max(0,state.score-50);flash('GRAY MOUSE!',true)}draw();schedule()}
  function fail(text){if(state.mode!=='play')return;clear();state.combo=0;flash(text,true);draw();schedule(430)}
  function flash(text,bad=false){feedback.textContent=text;feedback.className='feedback '+(bad?'bad':'');void feedback.offsetWidth;feedback.className='feedback '+(bad?'bad ':'')+'show'}
  function follow(x,y){let r=game.getBoundingClientRect(),px=Math.max(8,Math.min(92,(x-r.left)/r.width*100)),py=Math.max(10,Math.min(88,(y-r.top)/r.height*100));hammer.style.setProperty('--x',px+'%');hammer.style.setProperty('--reach',(129-py)+'%')}
  function swing(x,y){follow(x,y);let r=game.getBoundingClientRect();impact.style.left=x-r.left+'px';impact.style.top=y-r.top+'px';impact.classList.remove('show');void impact.offsetWidth;impact.classList.add('show');hammer.classList.remove('swing');void hammer.offsetWidth;hammer.classList.add('swing')}
  function show(title,body,label,action){modal.classList.remove('hide');modal.innerHTML='<div class="card"><p>ENGINE SHARD</p><h1>'+title+'</h1><div>'+body+'</div><button id="action">'+label+'</button></div>';$('#action').onclick=action}
  function start(){stop();clear();state.mode='play';state.seconds=60;state.score=0;state.combo=0;modal.classList.add('hide');draw();schedule(350);state.tick=setInterval(()=>{state.seconds--;draw();if(state.seconds<=0)finish(false)},1000)}
  function finish(win){state.mode='end';stop();clear();show(win?'포획 성공!':'시간 초과',win?'엔진 조각을 되찾았어요!<br>최종 점수 '+state.score+'점':'크리스털 쥐가 다시 땅속으로 숨어 버렸어요.','다시 하기',start)}
  function stop(){clearInterval(state.tick);clearTimeout(state.pop)}
  $('#start').onclick=start;$('#pause').onclick=()=>{if(state.mode==='play'){state.mode='pause';stop();clear();show('잠시 멈췄어요','게임이 일시정지되었습니다.','계속하기',()=>{state.mode='play';modal.classList.add('hide');schedule();state.tick=setInterval(()=>{state.seconds--;draw();if(state.seconds<=0)finish(false)},1000)})}};window.onpointermove=e=>{if(state.mode==='play')follow(e.clientX,e.clientY)};draw();
</script>
</body></html>
