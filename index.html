<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코어를 지켜라!</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #173c2a;
  font-family:
    "Noto Sans KR",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#game {
  position: relative;
  width: min(100vw, 177.777vh);
  height: min(56.25vw, 100vh);
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      #d9fa91 0%,
      #a8e56d 23%,
      #5eaa4d 58%,
      #204f35 100%
    );
}

#game::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.22) 0 2px,
      transparent 3px
    ),
    radial-gradient(
      circle,
      rgba(255,255,255,.15) 0 2px,
      transparent 3px
    );

  background-size:
    130px 110px,
    180px 150px;

  opacity: .6;
}

/* =========================
   HUD
========================= */

.hud {
  position: absolute;
  z-index: 50;

  top: 18px;

  padding: 10px 18px;

  border-radius: 18px;

  background: rgba(255,248,220,.96);

  box-shadow:
    0 5px 16px rgba(0,0,0,.2);

  color: #392b1b;

  font-size: 24px;
  font-weight: 900;
}

#timer {
  left: 18px;
}

#lives {
  right: 18px;

  color: #ef5965;

  letter-spacing: 4px;
}


/* =========================
   CORE
========================= */

#core {
  position: absolute;

  z-index: 8;

  left: 50%;
  top: 50%;

  width: 120px;
  height: 120px;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 34% 27%,
      white 0 8%,
      transparent 9%
    ),
    radial-gradient(
      circle at 55% 50%,
      #fff7a1 0%,
      #ffd72d 42%,
      #f5a900 75%,
      #e58a00 100%
    );

  border: 6px solid #fff4a3;

  box-shadow:
    0 0 18px #fff8b0,
    0 0 45px #ffd52c,
    0 0 100px rgba(255,210,40,.7);

  animation:
    corePulse 1.3s infinite ease-in-out;
}

#core::before {
  content: "";

  position: absolute;

  inset: -25px;

  border:
    3px solid rgba(255,244,125,.55);

  border-radius: 50%;

  animation:
    coreRing 2s linear infinite;
}

#core::after {
  content: "";

  position: absolute;

  inset: -50px;

  border:
    2px dashed rgba(255,244,125,.35);

  border-radius: 50%;

  animation:
    coreRing 4s linear infinite reverse;
}

@keyframes corePulse {

  50% {
    transform:
      translate(-50%, -50%)
      scale(1.08);
  }

}

@keyframes coreRing {

  to {
    transform: rotate(360deg);
  }

}


/* =========================
   CHARACTER
========================= */

#character {
  position: absolute;

  z-index: 10;

  left: 50%;
  top: calc(50% + 55px);

  width: 125px;
  height: 170px;

  object-fit: contain;

  transform: translateX(-50%);

  pointer-events: none;

  filter:
    drop-shadow(
      0 8px 5px rgba(0,0,0,.25)
    );
}


/* =========================
   GHOST
========================= */

.ghost {
  position: absolute;

  z-index: 20;

  width: 82px;
  height: 82px;

  transform:
    translate(-50%, -50%);

  object-fit: contain;

  cursor: pointer;

  user-select: none;

  -webkit-user-drag: none;

  filter:
    drop-shadow(
      0 7px 5px rgba(0,0,0,.28)
    );

  transition:
    transform .08s;
}

.ghost:hover {

  transform:
    translate(-50%, -50%)
    scale(1.08);

}

.ghost.pink {

  animation:
    pinkGlow .7s infinite alternate;

}

@keyframes pinkGlow {

  from {

    filter:
      drop-shadow(
        0 7px 5px rgba(0,0,0,.28)
      );

  }

  to {

    filter:
      drop-shadow(
        0 7px 5px rgba(0,0,0,.28)
      )
      drop-shadow(
        0 0 15px rgba(255,100,140,.8)
      );

  }

}


/* =========================
   PARTICLE
========================= */

.particle {

  position: absolute;

  z-index: 60;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  pointer-events: none;

  background: #fff5a0;

  animation:
    particle .65s forwards;

}

@keyframes particle {

  to {

    opacity: 0;

    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(.1);

  }

}


/* =========================
   POP TEXT
========================= */

.popText {

  position: absolute;

  z-index: 70;

  color: white;

  font-size: 34px;

  font-weight: 1000;

  text-shadow:
    0 3px #704000,
    0 0 8px rgba(255,255,255,.7);

  pointer-events: none;

  animation:
    popText .55s forwards;

}

@keyframes popText {

  0% {

    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(.5);

  }

  100% {

    opacity: 0;

    transform:
      translate(-50%, -100%)
      scale(1.3);

  }

}


/* =========================
   DAMAGE
========================= */

#damageFlash {

  position: absolute;

  inset: 0;

  z-index: 80;

  background:
    rgba(255,50,50,.35);

  pointer-events: none;

  opacity: 0;

}

#damageFlash.show {

  animation:
    damageFlash .45s;

}

@keyframes damageFlash {

  0% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }

}


/* =========================
   OVERLAY
========================= */

.overlay {

  position: absolute;

  inset: 0;

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(7,27,18,.62);

  backdrop-filter:
    blur(5px);

}

.card {

  width:
    min(570px, 88%);

  padding:
    36px 38px;

  text-align: center;

  border-radius: 30px;

  background:
    linear-gradient(
      #fffef2,
      #fff3c9
    );

  border:
    5px solid #77572b;

  box-shadow:
    0 20px 60px rgba(0,0,0,.35);

  color: #342515;

}

.card h1 {

  margin:
    0 0 15px;

  font-size:
    clamp(
      34px,
      5vw,
      58px
    );

  line-height:
    1.15;

}

.card p {

  margin:
    10px 0;

  font-size: 18px;

  line-height: 1.7;

  font-weight: 700;

}

.startButton {

  margin-top: 20px;

  padding:
    14px 36px;

  border: 0;

  border-radius: 18px;

  background:
    #f5bd31;

  color:
    #422b08;

  font-size: 21px;

  font-weight: 1000;

  cursor: pointer;

  box-shadow:
    0 6px 0 #a66c12;

  transition: .1s;

}

.startButton:active {

  transform:
    translateY(5px);

  box-shadow:
    0 1px 0 #a66c12;

}


/* =========================
   PINK COMBO
========================= */

#combo {

  position: absolute;

  inset: 0;

  z-index: 90;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle,
      rgba(255,190,205,.96),
      rgba(236,96,130,.92)
    );

}

#combo.show {

  display: flex;

}

.comboBox {

  text-align: center;

  width:
    min(620px, 90%);

}

#comboGhost {

  width:
    min(350px, 58vw);

  max-height: 48vh;

  object-fit: contain;

  filter:
    drop-shadow(
      0 14px 10px rgba(0,0,0,.25)
    );

}

#comboTitle {

  margin-top: -5px;

  color:
    #ff5e63;

  font-size:
    clamp(
      55px,
      9vw,
      95px
    );

  font-weight: 1000;

  line-height: 1;

  -webkit-text-stroke:
    4px white;

  text-shadow:
    5px 6px #572628;

  transform:
    rotate(-4deg);

}

#comboCount {

  display: inline-block;

  margin-top: 10px;

  min-width: 150px;

  padding:
    9px 24px;

  border-radius: 14px;

  background:
    #211b1b;

  color: white;

  font-size: 30px;

  font-weight: 1000;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

  .hud {

    top: 10px;

    padding:
      7px 12px;

    font-size: 19px;

  }

  #core {

    width: 90px;
    height: 90px;

  }

  #character {

    width: 95px;
    height: 135px;

    top:
      calc(50% + 48px);

  }

  .ghost {

    width: 62px;
    height: 62px;

  }

  .card {

    padding:
      28px 22px;

  }

  .card p {

    font-size: 15px;

  }

}
</style>
</head>

<body>

<div id="game">

  <!-- =========================
       HUD
  ========================== -->

  <div
    id="timer"
    class="hud"
  >
    ⏱️ 01:00
  </div>

  <div
    id="lives"
    class="hud"
  >
    ❤️❤️❤️
  </div>


  <!-- =========================
       CORE
  ========================== -->

  <div id="core"></div>


  <!-- =========================
       CHARACTER
  ========================== -->

  <img
    id="character"
    src="character.png"
    alt="코어 수호 캐릭터"
  >


  <!-- 귀신 생성 영역 -->

  <div id="arena"></div>


  <!-- 피격 효과 -->

  <div id="damageFlash"></div>


  <!-- =========================
       START SCREEN
  ========================== -->

  <div
    id="startScreen"
    class="overlay"
  >

    <div class="card">

      <h1>
        🌟 코어를 지켜라!
      </h1>

      <p>
        노란 빛나는 코어를<br>
        <b>1분 동안 지켜주세요!</b>
      </p>

      <p>
        🩵 파란 귀신은 한 번 클릭하면 사라집니다.<br>
        🩷 분홍 귀신은 클릭한 뒤 <b>연타!</b> 10번을 해주세요.<br>
        👻 귀신이 코어에 3번 닿으면 실패합니다.
      </p>

      <button
        id="startButton"
        class="startButton"
      >
        게임 시작
      </button>

    </div>

  </div>


  <!-- =========================
       PINK GHOST
  ========================== -->

  <div id="combo">

    <div class="comboBox">

      <div id="comboTitle">
        연타!
      </div>

      <img
        id="comboGhost"
        src="pink-ghost.png"
        alt="분홍 귀신"
      >

      <div id="comboCount">
        0 / 10
      </div>

    </div>

  </div>


  <!-- =========================
       END SCREEN
  ========================== -->

  <div
    id="endScreen"
    class="overlay"
    style="display:none"
  >

    <div class="card">

      <h1 id="endTitle">
        코어를 지켰다!
      </h1>

      <p id="endText"></p>

      <button
        id="restartButton"
        class="startButton"
      >
        다시하기
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   IMAGE FILES
===================================================== */

const BLUE_GHOST =
  "blue-ghost.png";

const PINK_GHOST =
  "pink-ghost.png";


/* =====================================================
   DOM
===================================================== */

const game =
  document.getElementById(
    "game"
  );

const arena =
  document.getElementById(
    "arena"
  );

const timer =
  document.getElementById(
    "timer"
  );

const lives =
  document.getElementById(
    "lives"
  );

const startScreen =
  document.getElementById(
    "startScreen"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const endScreen =
  document.getElementById(
    "endScreen"
  );

const endTitle =
  document.getElementById(
    "endTitle"
  );

const endText =
  document.getElementById(
    "endText"
  );

const restartButton =
  document.getElementById(
    "restartButton"
  );

const combo =
  document.getElementById(
    "combo"
  );

const comboGhost =
  document.getElementById(
    "comboGhost"
  );

const comboCount =
  document.getElementById(
    "comboCount"
  );

const damageFlash =
  document.getElementById(
    "damageFlash"
  );


/* =====================================================
   GAME STATE
===================================================== */

let running = false;

let timeLeft = 60;

let lastTime = 0;

let spawnTimer = 0;

let damageCount = 0;

let ghosts = [];

let pinkGhost = null;

let pinkClicks = 0;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


function initAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if (
    audioContext.state ===
    "suspended"
  ) {

    audioContext.resume();

  }

}


function sound(
  frequency,
  duration,
  type = "sine",
  volume = .05
) {

  initAudio();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type =
    type;

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
      duration
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
      duration
  );

}


/* =====================================================
   RANDOM
===================================================== */

function random(
  min,
  max
) {

  return (
    Math.random() *
    (max - min) +
    min
  );

}


/* =====================================================
   PARTICLES
===================================================== */

function burst(
  x,
  y,
  pink = false
) {

  const amount =
    pink ? 24 : 14;

  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const particle =
      document.createElement(
        "div"
      );

    particle.className =
      "particle";

    particle.style.left =
      x + "px";

    particle.style.top =
      y + "px";

    particle.style.background =
      pink
        ? "#ff91ad"
        : "#fff49c";

    const angle =
      Math.random() *
      Math.PI *
      2;

    const distance =
      random(40,110);

    particle.style.setProperty(
      "--x",
      Math.cos(angle) *
        distance +
        "px"
    );

    particle.style.setProperty(
      "--y",
      Math.sin(angle) *
        distance +
        "px"
    );

    game.appendChild(
      particle
    );

    setTimeout(
      () => particle.remove(),
      700
    );

  }

}


/* =====================================================
   POP TEXT
===================================================== */

function popText(
  x,
  y,
  text
) {

  const el =
    document.createElement(
      "div"
    );

  el.className =
    "popText";

  el.textContent =
    text;

  el.style.left =
    x + "px";

  el.style.top =
    y + "px";

  game.appendChild(el);

  setTimeout(
    () => el.remove(),
    600
  );

}


/* =====================================================
   SPAWN RATE
===================================================== */

function spawnRate() {

  /*
    초반:
    약 1.15초

    후반:
    약 0.65초

    너무 빠르게 증가하지 않도록
    제한합니다.
  */

  return Math.max(
    650,
    1150 -
      (60 - timeLeft) * 8
  );

}


/* =====================================================
   CREATE GHOST
===================================================== */

function createGhost(
  type
) {

  if (!running) {
    return;
  }


  /*
    동시에 6마리 이상
    생성하지 않음
  */

  if (
    ghosts.length >= 6
  ) {

    return;

  }


  const rect =
    game.getBoundingClientRect();

  const size = 82;

  let x;
  let y;

  const side =
    Math.floor(
      Math.random() * 4
    );


  /*
    TOP
  */

  if (side === 0) {

    x = random(
      size,
      rect.width - size
    );

    y = -size;

  }


  /*
    RIGHT
  */

  else if (side === 1) {

    x =
      rect.width + size;

    y = random(
      size,
      rect.height - size
    );

  }


  /*
    BOTTOM
  */

  else if (side === 2) {

    x = random(
      size,
      rect.width - size
    );

    y =
      rect.height + size;

  }


  /*
    LEFT
  */

  else {

    x = -size;

    y = random(
      size,
      rect.height - size
    );

  }


  const ghost =
    document.createElement(
      "img"
    );

  ghost.className =
    "ghost " +
    (
      type === "pink"
        ? "pink"
        : ""
    );

  ghost.src =
    type === "pink"
      ? PINK_GHOST
      : BLUE_GHOST;

  ghost.alt =
    type === "pink"
      ? "분홍 귀신"
      : "파란 귀신";

  ghost.draggable =
    false;

  ghost.style.left =
    x + "px";

  ghost.style.top =
    y + "px";


  /*
    귀신 속도

    이전보다 빠르게 설정.

    초반:
    약 37~42

    후반:
    약 44~49
  */

  const speed =
    39 +
    (60 - timeLeft) *
      0.12 +
    random(-2,3);


  const data = {

    el: ghost,

    type,

    x,

    y,

    speed,

    dead: false

  };


  ghosts.push(
    data
  );


  arena.appendChild(
    ghost
  );


  ghost.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      hitGhost(data);

    }
  );

}


/* =====================================================
   HIT GHOST
===================================================== */

function hitGhost(g) {

  if (
    !running ||
    g.dead
  ) {

    return;

  }


  /*
    PINK
  */

  if (
    g.type === "pink"
  ) {

    startPinkCombo(g);

    return;

  }


  /*
    BLUE
  */

  removeGhost(
    g,
    true
  );

  sound(
    650,
    .08,
    "square",
    .045
  );

  setTimeout(
    () =>
      sound(
        900,
        .1,
        "sine",
        .035
      ),
    35
  );

}


/* =====================================================
   REMOVE GHOST
===================================================== */

function removeGhost(
  g,
  effect = true
) {

  if (g.dead) {
    return;
  }

  g.dead = true;


  const rect =
    g.el.getBoundingClientRect();

  const gameRect =
    game.getBoundingClientRect();


  const x =
    rect.left -
      gameRect.left +
      rect.width / 2;

  const y =
    rect.top -
      gameRect.top +
      rect.height / 2;


  if (effect) {

    burst(
      x,
      y,
      g.type === "pink"
    );

    popText(
      x,
      y,
      g.type === "pink"
        ? "연타 성공!"
        : "펑!"
    );

  }


  g.el.remove();


  ghosts =
    ghosts.filter(
      ghost =>
        ghost !== g
    );

}


/* =====================================================
   PINK COMBO START
===================================================== */

function startPinkCombo(g) {

  pinkGhost = g;

  pinkClicks = 0;

  comboCount.textContent =
    "0 / 10";

  combo.style.display =
    "flex";

  sound(
    250,
    .1,
    "sawtooth",
    .05
  );

}


/* =====================================================
   PINK COMBO
===================================================== */

combo.addEventListener(
  "click",
  function(event) {

    if (
      !running ||
      !pinkGhost
    ) {

      return;

    }


    event.preventDefault();

    event.stopPropagation();


    pinkClicks++;


    comboCount.textContent =
      pinkClicks +
      " / 10";


    sound(
      650 +
        pinkClicks * 20,
      .045,
      "square",
      .035
    );


    comboCount.animate(
      [
        {
          transform:
            "scale(1)"
        },

        {
          transform:
            "scale(1.18)"
        },

        {
          transform:
            "scale(1)"
        }
      ],
      {
        duration: 90
      }
    );


    if (
      pinkClicks >= 10
    ) {

      const g =
        pinkGhost;

      pinkGhost = null;

      combo.style.display =
        "none";

      removeGhost(
        g,
        true
      );

      sound(
        800,
        .08,
        "square",
        .04
      );

    }

  }
);


/* =====================================================
   DAMAGE CORE
===================================================== */

function damageCore(g) {

  if (g.dead) {
    return;
  }


  g.dead = true;

  damageCount++;


  const rect =
    g.el.getBoundingClientRect();

  const gameRect =
    game.getBoundingClientRect();


  burst(
    rect.left -
      gameRect.left +
      rect.width / 2,

    rect.top -
      gameRect.top +
      rect.height / 2,

    true
  );


  g.el.remove();


  ghosts =
    ghosts.filter(
      ghost =>
        ghost !== g
    );


  /*
    HP
  */

  lives.textContent =
    "❤️".repeat(
      Math.max(
        0,
        3 - damageCount
      )
    ) +
    "🖤".repeat(
      damageCount
    );


  damageFlash.classList.remove(
    "show"
  );

  void damageFlash.offsetWidth;

  damageFlash.classList.add(
    "show"
  );


  sound(
    100,
    .22,
    "sawtooth",
    .07
  );


  /*
    3회 피격
  */

  if (
    damageCount >= 3
  ) {

    endGame(false);

  }

}


/* =====================================================
   UPDATE
===================================================== */

function update(
  timestamp
) {

  if (!running) {
    return;
  }


  if (!lastTime) {

    lastTime =
      timestamp;

  }


  const delta =
    Math.min(
      0.04,
      (
        timestamp -
        lastTime
      ) / 1000
    );


  lastTime =
    timestamp;


  timeLeft -= delta;


  if (
    timeLeft <= 0
  ) {

    timeLeft = 0;

    updateTimer();

    endGame(true);

    return;

  }


  updateTimer();


  /* =========================
     SPAWN
  ========================== */

  spawnTimer +=
    delta * 1000;


  if (
    spawnTimer >=
    spawnRate()
  ) {

    spawnTimer = 0;


    /*
      최대 6마리
    */

    const MAX_GHOSTS =
      6;


    let amount = 1;


    /*
      초반
    */

    if (
      timeLeft < 42
    ) {

      if (
        Math.random() < .45
      ) {

        amount = 2;

      }

    }


    /*
      후반
    */

    if (
      timeLeft < 20
    ) {

      if (
        Math.random() < .65
      ) {

        amount = 2;

      }

    }


    /*
      최대 마릿수 제한
    */

    if (
      ghosts.length >=
      MAX_GHOSTS
    ) {

      amount = 0;

    }


    if (
      ghosts.length +
        amount >
      MAX_GHOSTS
    ) {

      amount =
        MAX_GHOSTS -
        ghosts.length;

    }


    /*
      실제 생성
    */

    for (
      let i = 0;
      i < amount;
      i++
    ) {

      /*
        핑크 귀신 확률

        시간이 지나도
        너무 자주 나오지 않음
      */

      const pinkChance =
        Math.min(
          .18,
          .07 +
            (
              60 -
              timeLeft
            ) *
            .0015
        );


      createGhost(
        Math.random() <
          pinkChance
          ? "pink"
          : "blue"
      );

    }

  }


  /* =========================
     MOVE GHOSTS
  ========================== */

  const rect =
    game.getBoundingClientRect();


  const coreX =
    rect.width / 2;

  const coreY =
    rect.height / 2;


  /*
    중요:

    여기에서 절대로
    "pinkGhost가 있으면 continue"
    를 하지 않습니다.

    따라서 핑크 귀신 연타 중에도
    다른 귀신들이 계속 이동합니다.
  */

  for (
    const g of [...ghosts]
  ) {

    if (
      g.dead
    ) {

      continue;

    }


    const dx =
      coreX -
      g.x;

    const dy =
      coreY -
      g.y;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    /*
      코어 도착
    */

    if (
      distance < 78
    ) {

      damageCore(g);

      continue;

    }


    const directionX =
      dx /
      distance;

    const directionY =
      dy /
      distance;


    g.x +=
      directionX *
      g.speed *
      delta;

    g.y +=
      directionY *
      g.speed *
      delta;


    g.el.style.left =
      g.x + "px";

    g.el.style.top =
      g.y + "px";

  }


  requestAnimationFrame(
    update
  );

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

  const seconds =
    Math.ceil(
      timeLeft
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remain =
    seconds % 60;


  timer.textContent =
    "⏱️ " +
    String(minutes)
      .padStart(2,"0") +
    ":" +
    String(remain)
      .padStart(2,"0");

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

  initAudio();


  /*
    귀신 전부 제거
  */

  ghosts.forEach(
    g =>
      g.el.remove()
  );

  ghosts = [];


  pinkGhost = null;

  pinkClicks = 0;

  damageCount = 0;

  timeLeft = 60;

  spawnTimer = 0;

  lastTime = 0;

  running = true;


  lives.textContent =
    "❤️❤️❤️";


  updateTimer();


  combo.style.display =
    "none";


  endScreen.style.display =
    "none";

  startScreen.style.display =
    "none";


  requestAnimationFrame(
    update
  );

}


/* =====================================================
   END GAME
===================================================== */

function endGame(win) {

  if (!running) {
    return;
  }


  running = false;


  /*
    귀신 제거
  */

  ghosts.forEach(
    g =>
      g.el.remove()
  );

  ghosts = [];


  pinkGhost = null;

  combo.style.display =
    "none";


  /*
    SUCCESS
  */

  if (win) {

    endTitle.textContent =
      "✨ 코어를 지켰다!";

    endText.innerHTML =
      "1분 동안 노란 빛나는 코어를<br>" +
      "<b>무사히 지켜냈어요!</b>";


    sound(
      523,
      .12,
      "sine",
      .06
    );

    setTimeout(
      () =>
        sound(
          659,
          .12,
          "sine",
          .06
        ),
      100
    );

    setTimeout(
      () =>
        sound(
          784,
          .22,
          "sine",
          .07
        ),
      200
    );

  }


  /*
    FAIL
  */

  else {

    endTitle.textContent =
      "💔 코어를 귀신에게 빼앗겼다..";

    endText.innerHTML =
      "귀신이 코어에 3번 닿았어요.<br>" +
      "다시 도전해보세요!";


    sound(
      150,
      .2,
      "sawtooth",
      .06
    );

    setTimeout(
      () =>
        sound(
          80,
          .35,
          "sawtooth",
          .06
        ),
      140
    );

  }


  endScreen.style.display =
    "flex";

}


/* =====================================================
   BUTTONS
===================================================== */

startButton.addEventListener(
  "click",
  startGame
);

restartButton.addEventListener(
  "click",
  startGame
);


/* =====================================================
   INITIAL
===================================================== */

updateTimer();

</script>
