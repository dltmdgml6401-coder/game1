<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>빛나는 구슬을 지켜라!</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07180d;
    font-family:
        "Arial Black",
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#gameWrap {
    position: relative;
    width: min(100vw, 177.777vh);
    height: min(56.25vw, 100vh);
    overflow: hidden;
    background: #7bc94d;
    box-shadow: 0 0 60px rgba(0,0,0,.5);
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
}

/* -------------------------
   UI
------------------------- */

#topUI {
    position: absolute;
    left: 2%;
    right: 2%;
    top: 3%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
}

.panel {
    background: linear-gradient(#fffdf0, #f7e8bd);
    border: 3px solid #6d4320;
    border-radius: 17px;
    box-shadow:
        0 5px 0 rgba(70,38,12,.3),
        inset 0 2px 0 white;
    color: #342314;
}

#timerBox {
    padding: 7px 17px 9px;
    min-width: 155px;
    text-align: center;
}

#timer {
    font-size: clamp(20px, 2.5vw, 38px);
    font-weight: 900;
    letter-spacing: 1px;
}

#timer small {
    font-size: .55em;
}

#hearts {
    padding: 7px 14px;
    font-size: clamp(20px, 2.5vw, 38px);
    letter-spacing: 3px;
}

.heart {
    color: #ff5667;
    text-shadow:
        0 2px 0 #ad293b,
        0 0 8px rgba(255,60,80,.3);
}

.heart.empty {
    filter: grayscale(1);
    opacity: .25;
}

#bottomUI {
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    width: min(52%, 700px);
    pointer-events: none;
    z-index: 10;
}

#progressBack {
    height: 22px;
    background: #193617;
    border: 3px solid #4e351d;
    border-radius: 15px;
    padding: 2px;
    box-shadow:
        0 4px 0 rgba(0,0,0,.25),
        inset 0 2px 5px rgba(0,0,0,.4);
}

#progress {
    height: 100%;
    width: 100%;
    border-radius: 10px;
    background: linear-gradient(#9cec61, #5bc239);
    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.6),
        0 0 8px rgba(100,255,50,.4);
    transition: width .15s linear;
}

#progressText {
    text-align: center;
    color: white;
    text-shadow:
        0 2px 3px #18330d,
        0 0 5px #18330d;
    font-size: clamp(12px, 1.2vw, 20px);
    margin-top: 5px;
}

/* -------------------------
   Start / End Screen
------------------------- */

.overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center,
            rgba(255,240,150,.2),
            rgba(0,0,0,.68) 75%);
}

.modal {
    width: min(560px, 80%);
    padding: 34px;
    text-align: center;
    border-radius: 28px;

    background:
        linear-gradient(#fffbea, #f4dfac);

    border: 5px solid #653d1e;

    box-shadow:
        0 12px 0 rgba(60,30,10,.3),
        0 20px 60px rgba(0,0,0,.45),
        inset 0 3px white;
}

.modal h1 {
    margin: 0 0 12px;
    color: #38230e;
    font-size: clamp(30px, 5vw, 60px);
    text-shadow: 0 4px 0 #d7b97c;
}

.modal p {
    color: #5b4326;
    font-size: clamp(14px, 1.7vw, 21px);
    line-height: 1.7;
    margin: 10px 0 24px;
}

.mainButton {
    border: 0;
    border-radius: 18px;
    padding: 15px 42px;
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 900;
    color: white;
    background: linear-gradient(#83df50, #38a92b);
    border: 4px solid #286f20;
    box-shadow:
        0 6px 0 #205819,
        0 10px 25px rgba(40,120,20,.3);
    cursor: pointer;
    transition: transform .1s;
}

.mainButton:hover {
    filter: brightness(1.08);
}

.mainButton:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #205819;
}

/* -------------------------
   Pink Ghost Combo
------------------------- */

#comboOverlay {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 45%,
            rgba(255,255,255,.35),
            rgba(255,116,159,.15) 30%,
            rgba(255,80,130,.58));

    animation: pinkFlash .2s ease-out;
}

#comboOverlay::before {
    content: "";
    position: absolute;
    width: 150%;
    height: 150%;
    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,255,255,.12) 0deg 7deg,
            transparent 7deg 18deg
        );
    animation: spinRays 8s linear infinite;
}

@keyframes spinRays {
    to { transform: rotate(360deg); }
}

@keyframes pinkFlash {
    from { opacity: 0; transform: scale(1.05); }
    to { opacity: 1; transform: scale(1); }
}

.comboContent {
    position: relative;
    z-index: 2;
    text-align: center;
}

#comboGhost {
    position: relative;
    width: clamp(170px, 22vw, 310px);
    height: clamp(170px, 22vw, 310px);
    margin: auto;
}

.bigPinkGhost {
    position: absolute;
    inset: 10%;
    border-radius: 45% 45% 38% 38%;
    background:
        radial-gradient(circle at 32% 24%,
            #ffdae6 0 5%,
            transparent 6%),
        linear-gradient(150deg, #ff9fbd, #f25c8d);

    box-shadow:
        inset -18px -18px 0 rgba(190,47,93,.15),
        0 15px 30px rgba(100,20,45,.25);

    animation: angryBob .35s infinite alternate;
}

.bigPinkGhost::before,
.bigPinkGhost::after {
    content: "";
    position: absolute;
    top: 35%;
    width: 32px;
    height: 44px;
    background: #24151c;
    border-radius: 50%;
}

.bigPinkGhost::before {
    left: 23%;
    transform: rotate(25deg);
}

.bigPinkGhost::after {
    right: 23%;
    transform: rotate(-25deg);
}

@keyframes angryBob {
    from { transform: rotate(-2deg) scale(1); }
    to { transform: rotate(2deg) scale(1.03); }
}

.comboTitle {
    position: relative;
    margin-top: -5px;
    font-size: clamp(42px, 7vw, 90px);
    color: #fff;
    -webkit-text-stroke: 4px #43202a;
    text-shadow:
        0 7px 0 #d13e70,
        0 10px 20px rgba(70,20,40,.3);
    transform: rotate(-5deg);
}

#comboCounter {
    position: relative;
    margin: 12px auto;
    width: min(260px, 55vw);
    padding: 8px 20px;
    border-radius: 16px;
    background: rgba(25,18,22,.9);
    color: white;
    font-size: clamp(20px, 3vw, 36px);
    font-weight: 900;
}

#comboBarBack {
    position: relative;
    width: min(320px, 60vw);
    height: 18px;
    margin: auto;
    background: rgba(30,10,20,.65);
    border-radius: 12px;
    overflow: hidden;
}

#comboBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #fff16a, #ff4c83);
    box-shadow: 0 0 15px #ff5a8a;
}

/* -------------------------
   Hit flash
------------------------- */

#flash {
    position: absolute;
    inset: 0;
    z-index: 60;
    pointer-events: none;
    background: white;
    opacity: 0;
}

#damageFlash {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    background: rgba(255,40,60,.3);
    opacity: 0;
}

/* Hidden */
.hidden {
    display: none !important;
}

/* -------------------------
   Mobile
------------------------- */

@media (max-width: 700px) {
    #timerBox {
        min-width: auto;
        padding: 5px 10px;
    }

    #hearts {
        padding: 5px 8px;
    }

    #bottomUI {
        width: 65%;
        bottom: 3%;
    }

    .modal {
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<div id="gameWrap">

    <canvas id="game"></canvas>

    <div id="topUI">
        <div id="timerBox" class="panel">
            ⏱ <span id="timer">01:00</span>
        </div>

        <div id="hearts" class="panel">
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
        </div>
    </div>

    <div id="bottomUI">
        <div id="progressBack">
            <div id="progress"></div>
        </div>
        <div id="progressText">남은 시간: 01:00</div>
    </div>

    <!-- 시작 화면 -->
    <div id="startScreen" class="overlay">
        <div class="modal">
            <h1>빛나는 구슬을<br>지켜라!</h1>
            <p>
                사방에서 몰려오는 귀신을 클릭해서 없애세요!<br>
                파란 귀신은 한 번 클릭!<br>
                분홍 귀신은 <b>연타!</b>로 처치하세요.<br><br>
                <b>1분 동안 구슬을 지키면 성공!</b>
            </p>
            <button class="mainButton" id="startBtn">게임 시작</button>
        </div>
    </div>

    <!-- 게임 종료 -->
    <div id="endScreen" class="overlay hidden">
        <div class="modal">
            <h1 id="endTitle">게임 오버!</h1>
            <p id="endText"></p>
            <button class="mainButton" id="restartBtn">다시 하기</button>
        </div>
    </div>

    <!-- 분홍 귀신 연타 -->
    <div id="comboOverlay">
        <div class="comboContent">

            <div id="comboGhost">
                <div class="bigPinkGhost"></div>
            </div>

            <div class="comboTitle">연타!</div>

            <div id="comboCounter">0 / 10</div>

            <div id="comboBarBack">
                <div id="comboBar"></div>
            </div>

        </div>
    </div>

    <div id="flash"></div>
    <div id="damageFlash"></div>

</div>

<script>
/* ============================================================
   빛나는 구슬을 지켜라!
   Pure Canvas + Web Audio
============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const wrap = document.getElementById("gameWrap");

let W = 1280;
let H = 720;

function resize() {
    const rect = wrap.getBoundingClientRect();

    W = 1280;
    H = 720;

    canvas.width = W;
    canvas.height = H;
}

resize();
window.addEventListener("resize", resize);

/* ============================================================
   DOM
============================================================ */

const timerEl = document.getElementById("timer");
const progressEl = document.getElementById("progress");
const progressText = document.getElementById("progressText");
const heartsEl = document.getElementById("hearts");

const startScreen = document.getElementById("startScreen");
const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endText = document.getElementById("endText");

const comboOverlay = document.getElementById("comboOverlay");
const comboCounter = document.getElementById("comboCounter");
const comboBar = document.getElementById("comboBar");

const flash = document.getElementById("flash");
const damageFlash = document.getElementById("damageFlash");

/* ============================================================
   Game state
============================================================ */

const GAME_TIME = 60;

let gameRunning = false;
let gameOver = false;
let lastTime = 0;

let elapsed = 0;
let remaining = GAME_TIME;

let lives = 3;

let ghosts = [];
let particles = [];
let floatingTexts = [];
let shockwaves = [];

let spawnTimer = 0;
let shake = 0;

let comboActive = false;
let comboGhost = null;
let comboHits = 0;
let comboTime = 0;
let comboMaxTime = 2.5;

let audioCtx = null;

/* Central orb */

const orb = {
    x: W / 2,
    y: H / 2 + 15,
    radius: 42,
    pulse: 0,
    glow: 0
};

/* ============================================================
   Audio
============================================================ */

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function sound(type) {

    if (!audioCtx) return;

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    let freq = 300;
    let duration = .08;
    let wave = "sine";

    if (type === "click") {
        freq = 520;
        duration = .06;
        wave = "square";
    }

    if (type === "pop") {
        freq = 180;
        duration = .12;
        wave = "triangle";
    }

    if (type === "hit") {
        freq = 100;
        duration = .18;
        wave = "sawtooth";
    }

    if (type === "combo") {
        freq = 720 + comboHits * 35;
        duration = .055;
        wave = "square";
    }

    if (type === "comboStart") {
        freq = 300;
        duration = .35;
        wave = "sawtooth";
    }

    if (type === "win") {
        freq = 520;
        duration = .5;
        wave = "sine";
    }

    if (type === "lose") {
        freq = 110;
        duration = .6;
        wave = "sawtooth";
    }

    osc.type = wave;

    osc.frequency.setValueAtTime(freq, now);

    if (type === "pop") {
        osc.frequency.exponentialRampToValueAtTime(
            60,
            now + duration
        );
    }

    if (type === "hit") {
        osc.frequency.exponentialRampToValueAtTime(
            45,
            now + duration
        );
    }

    if (type === "win") {
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.linearRampToValueAtTime(
            900,
            now + duration
        );
    }

    gain.gain.setValueAtTime(.001, now);
    gain.gain.exponentialRampToValueAtTime(
        .16,
        now + .01
    );
    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + duration
    );

    osc.start(now);
    osc.stop(now + duration + .02);
}

/* ============================================================
   Background
============================================================ */

function drawBackground() {

    /* grass */
    const grad = ctx.createLinearGradient(0, 0, 0, H);

    grad.addColorStop(0, "#79cf50");
    grad.addColorStop(.5, "#94dc58");
    grad.addColorStop(1, "#4e9d3d");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    /* darker edge */
    const edge = ctx.createRadialGradient(
        W / 2,
        H / 2,
        120,
        W / 2,
        H / 2,
        800
    );

    edge.addColorStop(0, "rgba(255,255,150,0)");
    edge.addColorStop(.65, "rgba(15,70,20,.05)");
    edge.addColorStop(1, "rgba(5,35,12,.45)");

    ctx.fillStyle = edge;
    ctx.fillRect(0, 0, W, H);

    /* grass circles */
    for (let i = 0; i < 120; i++) {

        const x = (i * 137.7) % W;
        const y = (i * 83.3) % H;

        ctx.fillStyle =
            i % 3 === 0
                ? "rgba(40,120,35,.16)"
                : "rgba(255,255,180,.16)";

        ctx.beginPath();
        ctx.arc(
            x,
            y,
            2 + (i % 4),
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    /* flowers */
    for (let i = 0; i < 35; i++) {

        const x = (i * 317) % W;
        const y = (i * 193) % H;

        ctx.fillStyle = i % 2
            ? "#fff8e4"
            : "#ffd2e3";

        for (let j = 0; j < 5; j++) {

            const a = j * Math.PI * 2 / 5;

            ctx.beginPath();
            ctx.arc(
                x + Math.cos(a) * 5,
                y + Math.sin(a) * 5,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        ctx.fillStyle = "#eebd45";
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

/* ============================================================
   Central Orb
============================================================ */

function drawOrb() {

    orb.pulse += .045;

    const pulse =
        Math.sin(orb.pulse) * 4;

    /* magical rings */

    ctx.save();

    ctx.globalAlpha = .22;

    for (let i = 0; i < 4; i++) {

        ctx.strokeStyle = "#fff56a";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            orb.x,
            orb.y,
            65 + i * 23 + pulse,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    ctx.restore();

    /* glow */

    const glow = ctx.createRadialGradient(
        orb.x,
        orb.y,
        5,
        orb.x,
        orb.y,
        130 + pulse
    );

    glow.addColorStop(0, "rgba(255,255,150,.9)");
    glow.addColorStop(.25, "rgba(255,220,40,.4)");
    glow.addColorStop(1, "rgba(255,200,0,0)");

    ctx.fillStyle = glow;

    ctx.beginPath();
    ctx.arc(
        orb.x,
        orb.y,
        130 + pulse,
        0,
        Math.PI * 2
    );
    ctx.fill();

    /* orb */

    const orbGrad = ctx.createRadialGradient(
        orb.x - 13,
        orb.y - 16,
        3,
        orb.x,
        orb.y,
        orb.radius
    );

    orbGrad.addColorStop(0, "#fffde0");
    orbGrad.addColorStop(.22, "#fff36b");
    orbGrad.addColorStop(.7, "#ffc51c");
    orbGrad.addColorStop(1, "#e99500");

    ctx.fillStyle = orbGrad;

    ctx.beginPath();
    ctx.arc(
        orb.x,
        orb.y,
        orb.radius + pulse * .2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.lineWidth = 4;
    ctx.strokeStyle = "#fff5a3";
    ctx.stroke();

    /* shine */

    ctx.fillStyle = "rgba(255,255,255,.9)";

    ctx.beginPath();
    ctx.ellipse(
        orb.x - 14,
        orb.y - 18,
        10,
        6,
        -.6,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
}

/* ============================================================
   Little plant guardian
============================================================ */

function drawGuardian() {

    const x = orb.x - 68;
    const y = orb.y + 32;

    /* body */
    ctx.fillStyle = "#6ecb34";

    ctx.beginPath();
    ctx.ellipse(
        x,
        y,
        20,
        30,
        0,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.strokeStyle = "#26751d";
    ctx.lineWidth = 3;
    ctx.stroke();

    /* head */
    ctx.fillStyle = "#91e843";

    ctx.beginPath();
    ctx.arc(
        x,
        y - 20,
        19,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.strokeStyle = "#26751d";
    ctx.stroke();

    /* eyes */

    ctx.fillStyle = "#15250e";

    ctx.beginPath();
    ctx.arc(x - 7, y - 21, 3.5, 0, Math.PI * 2);
    ctx.arc(x + 7, y - 21, 3.5, 0, Math.PI * 2);
    ctx.fill();

    /* smile */

    ctx.strokeStyle = "#23451a";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(
        x,
        y - 17,
        7,
        0,
        Math.PI
    );
    ctx.stroke();

    /* leaf */

    ctx.fillStyle = "#71cf32";

    ctx.beginPath();
    ctx.ellipse(
        x - 10,
        y - 45,
        10,
        20,
        -.6,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(
        x + 10,
        y - 45,
        10,
        20,
        .6,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

/* ============================================================
   Ghost creation
============================================================ */

function createGhost() {

    const side = Math.floor(Math.random() * 4);

    let x, y;

    const margin = 55;

    if (side === 0) {
        x = Math.random() * W;
        y = -margin;
    }

    if (side === 1) {
        x = W + margin;
        y = Math.random() * H;
    }

    if (side === 2) {
        x = Math.random() * W;
        y = H + margin;
    }

    if (side === 3) {
        x = -margin;
        y = Math.random() * H;
    }

    const pinkChance =
        Math.min(
            .12 + elapsed / 60 * .13,
            .25
        );

    const pink =
        Math.random() < pinkChance;

    const baseSpeed =
        35 + elapsed * .75;

    return {

        x,
        y,

        radius: pink ? 22 : 20,

        speed:
            baseSpeed *
            (pink ? .72 : 1) *
            (0.85 + Math.random() * .35),

        pink,

        rotation:
            Math.random() * Math.PI * 2,

        bob:
            Math.random() * Math.PI * 2,

        dead: false,

        hitFlash: 0
    };
}

/* ============================================================
   Draw Ghost
============================================================ */

function drawGhost(g) {

    const bob =
        Math.sin(g.bob) * 3;

    ctx.save();

    ctx.translate(
        g.x,
        g.y + bob
    );

    ctx.rotate(
        Math.sin(g.rotation) * .08
    );

    if (g.pink) {
        drawPinkGhost(g);
    } else {
        drawBlueGhost(g);
    }

    ctx.restore();
}

function drawBlueGhost(g) {

    /* glow */

    ctx.shadowColor = "#55cfff";
    ctx.shadowBlur = 14;

    const grad = ctx.createLinearGradient(
        -20,
        -25,
        20,
        25
    );

    grad.addColorStop(0, "#a8edff");
    grad.addColorStop(.45, "#61c9ef");
    grad.addColorStop(1, "#3795c6");

    ctx.fillStyle = grad;

    ctx.beginPath();

    ctx.moveTo(-22, 13);

    ctx.quadraticCurveTo(
        -30,
        -15,
        0,
        -25
    );

    ctx.quadraticCurveTo(
        28,
        -15,
        22,
        13
    );

    ctx.lineTo(13, 24);
    ctx.lineTo(4, 15);
    ctx.lineTo(-5, 25);
    ctx.lineTo(-14, 15);

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur = 0;

    /* face */

    ctx.fillStyle = "#153c5d";

    ctx.beginPath();
    ctx.ellipse(-7, -4, 4, 7, -.25, 0, Math.PI * 2);
    ctx.ellipse(7, -4, 4, 7, .25, 0, Math.PI * 2);
    ctx.fill();

    /* angry brows */

    ctx.strokeStyle = "#153c5d";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(-12, -13);
    ctx.lineTo(-4, -10);
    ctx.moveTo(12, -13);
    ctx.lineTo(4, -10);
    ctx.stroke();

    /* blush */

    ctx.fillStyle = "rgba(255,120,150,.45)";

    ctx.beginPath();
    ctx.arc(-15, 5, 4, 0, Math.PI * 2);
    ctx.arc(15, 5, 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawPinkGhost(g) {

    ctx.shadowColor = "#ff4e91";
    ctx.shadowBlur = 18;

    const grad = ctx.createLinearGradient(
        -20,
        -25,
        20,
        25
    );

    grad.addColorStop(0, "#ffd0df");
    grad.addColorStop(.5, "#ff8eae");
    grad.addColorStop(1, "#ed527d");

    ctx.fillStyle = grad;

    ctx.beginPath();

    ctx.moveTo(-23, 13);

    ctx.quadraticCurveTo(
        -30,
        -15,
        0,
        -25
    );

    ctx.quadraticCurveTo(
        30,
        -15,
        23,
        13
    );

    ctx.lineTo(14, 25);
    ctx.lineTo(4, 15);
    ctx.lineTo(-5, 26);
    ctx.lineTo(-14, 15);

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur = 0;

    /* eyes */

    ctx.fillStyle = "#391c27";

    ctx.beginPath();
    ctx.ellipse(-8, -4, 5, 8, -.35, 0, Math.PI * 2);
    ctx.ellipse(8, -4, 5, 8, .35, 0, Math.PI * 2);
    ctx.fill();

    /* angry eyebrows */

    ctx.strokeStyle = "#391c27";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(-14, -14);
    ctx.lineTo(-4, -10);
    ctx.moveTo(14, -14);
    ctx.lineTo(4, -10);
    ctx.stroke();

    /* mouth */

    ctx.fillStyle = "#391c27";

    ctx.beginPath();
    ctx.ellipse(
        0,
        10,
        7,
        5,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

/* ============================================================
   Particles
============================================================ */

function spawnParticles(
    x,
    y,
    color,
    amount = 15
) {

    for (let i = 0; i < amount; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            60 + Math.random() * 180;

        particles.push({
            x,
            y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            life: .45 + Math.random() * .5,
            maxLife: .9,

            size: 2 + Math.random() * 5,

            color
        });
    }
}

function updateParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.life -= dt;

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= .97;
        p.vy *= .97;

        p.vy += 50 * dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(0, p.life / p.maxLife);

        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* ============================================================
   Shockwave
============================================================ */

function addShockwave(x, y, color) {

    shockwaves.push({
        x,
        y,
        radius: 10,
        life: .35,
        color
    });
}

function updateShockwaves(dt) {

    for (let i = shockwaves.length - 1; i >= 0; i--) {

        const s = shockwaves[i];

        s.radius += 240 * dt;
        s.life -= dt;

        if (s.life <= 0) {
            shockwaves.splice(i, 1);
        }
    }
}

function drawShockwaves() {

    for (const s of shockwaves) {

        ctx.globalAlpha =
            s.life / .35;

        ctx.strokeStyle = s.color;
        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    ctx.globalAlpha = 1;
}

/* ============================================================
   Floating Text
============================================================ */

function addText(text, x, y, color) {

    floatingTexts.push({
        text,
        x,
        y,
        life: .8,
        color
    });
}

function updateTexts(dt) {

    for (let i = floatingTexts.length - 1; i >= 0; i--) {

        const t = floatingTexts[i];

        t.y -= 30 * dt;
        t.life -= dt;

        if (t.life <= 0) {
            floatingTexts.splice(i, 1);
        }
    }
}

function drawTexts() {

    for (const t of floatingTexts) {

        ctx.globalAlpha =
            Math.min(1, t.life * 2);

        ctx.fillStyle = t.color;
        ctx.strokeStyle = "rgba(0,0,0,.5)";
        ctx.lineWidth = 5;

        ctx.font =
            "900 28px Arial Black, sans-serif";

        ctx.textAlign = "center";

        ctx.strokeText(
            t.text,
            t.x,
            t.y
        );

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );
    }

    ctx.globalAlpha = 1;
}

/* ============================================================
   Ghost update
============================================================ */

function updateGhosts(dt) {

    if (comboActive) return;

    for (let i = ghosts.length - 1; i >= 0; i--) {

        const g = ghosts[i];

        if (g.dead) {
            ghosts.splice(i, 1);
            continue;
        }

        g.bob += dt * 5;
        g.rotation += dt * 2;

        const dx = orb.x - g.x;
        const dy = orb.y - g.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < orb.radius + g.radius) {

            hitOrb(g);

            ghosts.splice(i, 1);

            continue;
        }

        const nx = dx / distance;
        const ny = dy / distance;

        g.x += nx * g.speed * dt;
        g.y += ny * g.speed * dt;

        if (g.hitFlash > 0) {
            g.hitFlash -= dt;
        }
    }
}

/* ============================================================
   Orb damage
============================================================ */

function hitOrb(g) {

    lives--;

    shake = 14;

    damageFlash.style.opacity = ".8";

    setTimeout(() => {
        damageFlash.style.opacity = "0";
    }, 120);

    spawnParticles(
        orb.x,
        orb.y,
        "#fff24f",
        30
    );

    addShockwave(
        orb.x,
        orb.y,
        "#ff6b3b"
    );

    addText(
        "-1",
        orb.x,
        orb.y - 70,
        "#ff5c5c"
    );

    sound("hit");

    updateHearts();

    if (lives <= 0) {
        finishGame(false);
    }
}

function updateHearts() {

    const hearts =
        heartsEl.querySelectorAll(".heart");

    hearts.forEach((heart, i) => {

        if (i < lives) {
            heart.classList.remove("empty");
        } else {
            heart.classList.add("empty");
        }
    });
}

/* ============================================================
   Spawn difficulty
============================================================ */

function getSpawnInterval() {

    /*
        처음에는 약 0.9초
        마지막에는 약 0.25초
    */

    return Math.max(
        .24,
        .95 - elapsed * .012
    );
}

function updateSpawner(dt) {

    if (comboActive) return;

    spawnTimer -= dt;

    if (spawnTimer <= 0) {

        const count =
            elapsed > 45
                ? (Math.random() < .35 ? 2 : 1)
                : 1;

        for (let i = 0; i < count; i++) {
            ghosts.push(createGhost());
        }

        spawnTimer =
            getSpawnInterval() *
            (.7 + Math.random() * .6);
    }
}

/* ============================================================
   Mouse / Touch
============================================================ */

function getCanvasPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }

    return {
        x:
            (clientX - rect.left)
            / rect.width * W,

        y:
            (clientY - rect.top)
            / rect.height * H
    };
}

canvas.addEventListener("pointerdown", function(e) {

    if (!gameRunning) return;

    initAudio();

    const pos = getCanvasPosition(e);

    if (comboActive) {

        comboClick();

        return;
    }

    for (let i = ghosts.length - 1; i >= 0; i--) {

        const g = ghosts[i];

        const dx = pos.x - g.x;
        const dy = pos.y - g.y;

        const dist =
            Math.sqrt(dx * dx + dy * dy);

        if (dist < g.radius + 16) {

            if (g.pink) {

                startCombo(g);

            } else {

                killGhost(g);

            }

            break;
        }
    }
});

/* ============================================================
   Normal Ghost kill
============================================================ */

function killGhost(g) {

    const index =
        ghosts.indexOf(g);

    if (index !== -1) {
        ghosts.splice(index, 1);
    }

    g.dead = true;

    spawnParticles(
        g.x,
        g.y,
        "#7de7ff",
        22
    );

    spawnParticles(
        g.x,
        g.y,
        "#ffffff",
        8
    );

    addShockwave(
        g.x,
        g.y,
        "#8deaff"
    );

    addText(
        "팡!",
        g.x,
        g.y - 30,
        "#ffffff"
    );

    flash.style.opacity = ".35";

    setTimeout(() => {
        flash.style.opacity = "0";
    }, 50);

    sound("pop");
}

/* ============================================================
   Pink Combo
============================================================ */

function startCombo(g) {

    comboActive = true;

    comboGhost = g;

    comboHits = 0;

    comboTime = comboMaxTime;

    const index =
        ghosts.indexOf(g);

    if (index !== -1) {
        ghosts.splice(index, 1);
    }

    comboOverlay.style.display = "flex";

    comboCounter.textContent = "0 / 10";

    comboBar.style.width = "0%";

    sound("comboStart");

    shake = 8;
}

function comboClick() {

    if (!comboActive) return;

    comboHits++;

    comboTime -= .12;

    comboCounter.textContent =
        comboHits + " / 10";

    comboBar.style.width =
        (comboHits / 10 * 100) + "%";

    sound("combo");

    spawnParticles(
        W / 2 + (Math.random() - .5) * 250,
        H / 2 + (Math.random() - .5) * 180,
        "#fff16b",
        7
    );

    shake = 5;

    if (comboHits >= 10) {

        comboActive = false;

        comboOverlay.style.display = "none";

        spawnParticles(
            W / 2,
            H / 2,
            "#ff6d9c",
            45
        );

        addShockwave(
            W / 2,
            H / 2,
            "#fff08a"
        );

        addText(
            "처치!",
            W / 2,
            H / 2 + 190,
            "#ffffff"
        );

        sound("pop");
    }
}

/* ============================================================
   Combo update
============================================================ */

function updateCombo(dt) {

    if (!comboActive) return;

    comboTime -= dt;

    if (comboTime <= 0) {

        comboActive = false;

        comboOverlay.style.display = "none";

        /*
            연타 실패하면 귀신이 구슬 근처로
            순간이동하여 큰 위협을 주지 않고
            다시 등장하도록 처리
        */

        const g = createGhost();

        g.pink = true;
        g.speed *= .8;

        /* 화면 바깥에서 재진입 */
        ghosts.push(g);

        addText(
            "실패!",
            W / 2,
            H / 2 + 180,
            "#ff507c"
        );

        sound("hit");
    }
}

/* ============================================================
   Game Start
============================================================ */

function startGame() {

    initAudio();

    startScreen.classList.add("hidden");
    endScreen.classList.add("hidden");

    elapsed = 0;
    remaining = GAME_TIME;

    lives = 3;

    ghosts = [];
    particles = [];
    floatingTexts = [];
    shockwaves = [];

    spawnTimer = .5;

    comboActive = false;
    comboGhost = null;
    comboHits = 0;

    gameRunning = true;
    gameOver = false;

    updateHearts();

    lastTime = performance.now();

    sound("click");
}

/* ============================================================
   Game End
============================================================ */

function finishGame(win) {

    if (!gameRunning) return;

    gameRunning = false;
    gameOver = true;

    comboActive = false;
    comboOverlay.style.display = "none";

    if (win) {

        endTitle.textContent = "클리어! ✨";

        endText.innerHTML =
            "대단해요!<br>" +
            "<b>1분 동안 노란 구슬을 지켜냈어요!</b><br>" +
            "숲의 빛이 안전하게 보호되었습니다.";

        sound("win");

        spawnParticles(
            orb.x,
            orb.y,
            "#fff36a",
            100
        );

    } else {

        endTitle.textContent = "게임 오버! 💥";

        endText.innerHTML =
            "귀신이 노란 구슬에<br>" +
            "<b>3번이나 닿았어요!</b><br>" +
            "다시 도전해보세요.";

        sound("lose");
    }

    setTimeout(() => {
        endScreen.classList.remove("hidden");
    }, 700);
}

/* ============================================================
   Timer
============================================================ */

function updateTimer(dt) {

    elapsed += dt;

    remaining =
        Math.max(0, GAME_TIME - elapsed);

    const seconds =
        Math.ceil(remaining);

    const min =
        Math.floor(seconds / 60);

    const sec =
        seconds % 60;

    timerEl.textContent =
        String(min).padStart(2, "0") +
        ":" +
        String(sec).padStart(2, "0");

    progressEl.style.width =
        (remaining / GAME_TIME * 100) + "%";

    progressText.textContent =
        "남은 시간: " +
        String(min).padStart(2, "0") +
        ":" +
        String(sec).padStart(2, "0");

    if (remaining <= 0) {
        finishGame(true);
    }
}

/* ============================================================
   Main update
============================================================ */

function update(dt) {

    if (!gameRunning) {

        updateParticles(dt);
        updateShockwaves(dt);
        updateTexts(dt);

        return;
    }

    updateTimer(dt);

    if (!gameRunning) return;

    updateSpawner(dt);
    updateGhosts(dt);
    updateCombo(dt);

    updateParticles(dt);
    updateShockwaves(dt);
    updateTexts(dt);

    shake *= .88;

    if (shake < .2) {
        shake = 0;
    }
}

/* ============================================================
   Draw
============================================================ */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.save();

    if (shake > 0) {

        ctx.translate(
            (Math.random() - .5) * shake,
            (Math.random() - .5) * shake
        );
    }

    drawBackground();

    /* Magic circle */

    ctx.save();

    ctx.strokeStyle =
        "rgba(255,242,100,.25)";

    ctx.lineWidth = 3;

    ctx.setLineDash([10, 10]);

    ctx.beginPath();

    ctx.arc(
        orb.x,
        orb.y,
        105,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.setLineDash([]);

    ctx.restore();

    drawOrb();
    drawGuardian();

    /* Ghosts */

    for (const g of ghosts) {
        drawGhost(g);
    }

    drawShockwaves();
    drawParticles();
    drawTexts();

    ctx.restore();
}

/* ============================================================
   Main Loop
============================================================ */

function loop(now) {

    let dt =
        (now - lastTime) / 1000;

    if (!lastTime) dt = 0;

    /*
        브라우저가 잠깐 멈췄을 때
        귀신이 순간이동하지 않도록 제한
    */
    dt = Math.min(dt, .05);

    lastTime = now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ============================================================
   Buttons
============================================================ */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        startGame
    );

/* ============================================================
   Prevent accidental scrolling on touch
============================================================ */

document.addEventListener(
    "touchmove",
    function(e) {
        e.preventDefault();
    },
    { passive: false }
);
</script>
