<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>빛나는 구슬을 지켜라!</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #17270e;
    font-family:
        "Arial Black",
        "Noto Sans KR",
        "Pretendard",
        sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#gameWrap {
    position: relative;

    width: min(100vw, 177.7778vh);
    height: min(56.25vw, 100vh);

    overflow: hidden;

    background: #72bd45;

    box-shadow:
        0 0 60px rgba(0,0,0,.5);
}

canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    cursor: crosshair;

    touch-action: none;
}

/* =========================================================
   TOP UI
========================================================= */

#topUI {
    position: absolute;

    top: 18px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    z-index: 20;

    pointer-events: none;
}

.uiPanel {
    background:
        linear-gradient(
            #fffdf2,
            #f4dfae
        );

    border: 3px solid #79502a;

    border-radius: 17px;

    box-shadow:
        0 5px 0 rgba(70,40,10,.25),
        inset 0 2px 0 rgba(255,255,255,.9);

    color: #392719;
}

/* Timer */

#timerBox {
    min-width: 155px;

    padding: 7px 16px;

    text-align: center;

    font-size: 16px;
}

.timerIcon {
    font-size: 26px;
    vertical-align: middle;
}

#timer {
    font-size: 29px;
    font-weight: 900;

    letter-spacing: 1px;
}

/* Hearts */

#heartBox {
    padding: 7px 13px;

    font-size: 32px;

    letter-spacing: 3px;
}

.heart {
    color: #ff5669;

    text-shadow:
        0 2px 0 #ae2638,
        0 0 8px rgba(255,70,90,.35);
}

.heart.empty {
    opacity: .18;
    filter: grayscale(1);
}

/* =========================================================
   BOTTOM UI
========================================================= */

#bottomUI {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    width: min(540px, 55%);

    z-index: 20;

    pointer-events: none;
}

#progressOuter {
    height: 24px;

    padding: 3px;

    background: #283b19;

    border: 3px solid #66451f;

    border-radius: 15px;

    box-shadow:
        inset 0 3px 5px rgba(0,0,0,.35),
        0 4px 0 rgba(0,0,0,.18);
}

#progress {
    width: 100%;
    height: 100%;

    border-radius: 10px;

    background:
        linear-gradient(
            #a5ec69,
            #55bd39
        );

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.6),
        0 0 8px rgba(100,255,50,.3);

    transition: width .15s linear;
}

#progressText {
    margin-top: 5px;

    text-align: center;

    color: white;

    font-size: 16px;
    font-weight: 900;

    text-shadow:
        0 2px 3px #264314,
        0 0 4px #264314;
}

/* =========================================================
   MESSAGE
========================================================= */

#message {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 25;

    padding: 12px 24px;

    color: white;

    font-size: 28px;
    font-weight: 900;

    text-shadow:
        0 3px 4px rgba(0,0,0,.5);

    pointer-events: none;

    opacity: 0;
}

/* =========================================================
   START / END
========================================================= */

.overlay {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            rgba(255,244,170,.18),
            rgba(0,0,0,.68)
        );
}

.modal {
    width: min(560px, 82%);

    padding: 32px 30px;

    text-align: center;

    border-radius: 27px;

    background:
        linear-gradient(
            #fffcef,
            #f4dfac
        );

    border: 5px solid #68401f;

    box-shadow:
        0 10px 0 rgba(50,30,10,.25),
        0 20px 60px rgba(0,0,0,.4),
        inset 0 3px white;
}

.modal h1 {
    margin: 0 0 12px;

    color: #39220d;

    font-size: clamp(32px,5vw,58px);

    line-height: 1.1;

    text-shadow:
        0 4px 0 #d9b97c;
}

.modal p {
    color: #604725;

    line-height: 1.7;

    font-size: clamp(14px,1.6vw,20px);
}

.mainButton {
    margin-top: 10px;

    padding: 14px 40px;

    border: 4px solid #2c7420;
    border-radius: 18px;

    background:
        linear-gradient(
            #8ce45a,
            #38aa2c
        );

    color: white;

    font-size: 24px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 6px 0 #205817,
        0 10px 25px rgba(30,110,20,.3);
}

.mainButton:active {
    transform: translateY(5px);

    box-shadow:
        0 1px 0 #205817;
}

/* =========================================================
   PINK COMBO SCREEN
========================================================= */

#comboOverlay {
    position: absolute;
    inset: 0;

    z-index: 80;

    display: none;

    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.38),
            rgba(255,116,155,.3) 40%,
            rgba(255,60,120,.72)
        );

    cursor: pointer;

    touch-action: none;
}

/* radial rays */

#comboOverlay::before {
    content: "";

    position: absolute;

    width: 180%;
    height: 180%;

    background:
        repeating-conic-gradient(
            from 0deg,
            rgba(255,255,255,.14) 0deg 6deg,
            transparent 6deg 18deg
        );

    animation:
        rotateRays 7s linear infinite;
}

@keyframes rotateRays {
    to {
        transform: rotate(360deg);
    }
}

.comboContent {
    position: relative;

    z-index: 2;

    width: 100%;

    text-align: center;

    pointer-events: none;
}

/*
    실제 클릭은 comboOverlay에서 받는다.
    따라서 귀신 그림이나 글자를 클릭하지 않아도
    화면 어디를 눌러도 카운트된다.
*/

#comboGhost {
    width: min(350px, 42vw);
    height: min(350px, 42vw);

    margin: 0 auto;

    position: relative;
}

.comboPinkGhost {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 80%;
    height: 80%;

    transform:
        translate(-50%,-50%);

    border-radius:
        48% 48% 42% 42%;

    background:
        radial-gradient(
            circle at 32% 22%,
            #ffe8ef 0 6%,
            transparent 7%
        ),
        linear-gradient(
            145deg,
            #ffb2c9,
            #ff668f
        );

    border: 6px solid #713143;

    box-shadow:
        inset -20px -20px 0 rgba(170,40,80,.15),
        0 18px 30px rgba(90,20,40,.3);

    animation:
        angryGhost .3s infinite alternate;
}

.comboPinkGhost::before,
.comboPinkGhost::after {
    content: "";

    position: absolute;

    top: 32%;

    width: 48px;
    height: 68px;

    background: #29131b;

    border-radius: 50%;
}

.comboPinkGhost::before {
    left: 22%;
    transform: rotate(25deg);
}

.comboPinkGhost::after {
    right: 22%;
    transform: rotate(-25deg);
}

@keyframes angryGhost {
    from {
        transform:
            translate(-50%,-50%)
            rotate(-2deg)
            scale(1);
    }

    to {
        transform:
            translate(-50%,-50%)
            rotate(2deg)
            scale(1.035);
    }
}

.comboPinkGhostMouth {
    position: absolute;

    left: 50%;
    top: 57%;

    transform: translateX(-50%);

    width: 55px;
    height: 45px;

    background: #40141f;

    border-radius:
        50% 50% 55% 55%;
}

.comboTitle {
    margin-top: -20px;

    font-size: clamp(55px,8vw,105px);

    font-weight: 900;

    color: #fff;

    -webkit-text-stroke: 5px #4d1c2b;

    text-shadow:
        0 7px 0 #ce3d6d,
        0 12px 20px rgba(80,20,40,.35);

    transform: rotate(-5deg);
}

#comboCounter {
    width: min(260px,50vw);

    margin: 12px auto;

    padding: 8px;

    border-radius: 15px;

    background: rgba(25,15,20,.9);

    color: white;

    font-size: clamp(24px,3vw,40px);

    font-weight: 900;
}

#comboBarOuter {
    width: min(360px,60vw);

    height: 22px;

    margin: auto;

    padding: 3px;

    background: rgba(35,10,20,.75);

    border-radius: 14px;
}

#comboBar {
    width: 0%;
    height: 100%;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #fff16a,
            #ff4784
        );

    box-shadow:
        0 0 15px #ff5689;

    transition: width .08s linear;
}

#comboHint {
    margin-top: 12px;

    color: white;

    font-size: 17px;
    font-weight: 900;

    text-shadow:
        0 2px 4px rgba(70,10,30,.6);
}

/* =========================================================
   FLASH
========================================================= */

#whiteFlash,
#redFlash {
    position: absolute;
    inset: 0;

    z-index: 90;

    pointer-events: none;

    opacity: 0;
}

#whiteFlash {
    background: white;
}

#redFlash {
    background: rgba(255,30,50,.38);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    #topUI {
        top: 10px;
        left: 10px;
        right: 10px;
    }

    #timerBox {
        min-width: 120px;
        padding: 5px 9px;
    }

    #timer {
        font-size: 22px;
    }

    .timerIcon {
        font-size: 20px;
    }

    #heartBox {
        font-size: 24px;
        padding: 5px 8px;
    }

    #bottomUI {
        width: 70%;
        bottom: 12px;
    }

    #progressOuter {
        height: 19px;
    }

    #progressText {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div id="gameWrap">

<canvas id="game"></canvas>

<!-- =========================
     TOP UI
========================= -->

<div id="topUI">

    <div id="timerBox" class="uiPanel">
        <span class="timerIcon">⏱</span>
        <span id="timer">01:00</span>
    </div>

    <div id="heartBox" class="uiPanel">
        <span class="heart">♥</span>

    </div>

========================= -->

<div id="bottomUI">

</div>

<!-- =========================

========================= -->

<div id="startScreen" class="overlay">

    <div class="modal">

        <h1>

            지켜라!
        </h1>

        <p>
            사방에서 귀신들이 몰려옵니다!<br>
            파란 귀신은 <b>한 번 클릭</b>해서 처치하세요.<br>
            분홍 귀신은 <b>연타!</b>해서 처치하세요.<br><br>

            귀신이 구슬에 <b>3번</b> 닿으면 게임 오버!<br>

        <button

<!-- =========================

<div id="endScreen"

     style="display:none;">

    <div class="modal">

        <h1 id="endTitle">

        </h1>

        <p id="endText"></p>

        <button
            class="mainButton"
            id="restartBtn">
            다시 하기
        </button>

    </div>

</div>

<!-- =========================
     PINK COMBO
========================= -->

<div id="comboOverlay">

    <div class="comboContent">

        <div id="comboGhost">

            <div class="comboPinkGhost">

                <div class="comboPinkGhostMouth"></div>

            </div>

        </div>

        <div class="comboTitle">
            연타!
        </div>

        <div id="comboCounter">
            0 / 10
        </div>

        <div id="comboBarOuter">
            <div id="comboBar"></div>
        </div>

        <div id="comboHint">
            화면을 빠르게 클릭하세요!
        </div>

    </div>

</div>

<div id="whiteFlash"></div>
<div id="redFlash"></div>

<script>

/* ============================================================
   SETUP
============================================================ */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const wrap =
    document.getElementById("gameWrap");

const W = 1280;
const H = 720;

canvas.width = W;
canvas.height = H;


/* ============================================================
   IMAGE
============================================================ */

/*
    업로드해주신 캐릭터 시트.

    파일명:
        character.png

    시트에서 좌측 상단의
    정면 캐릭터를 잘라 사용합니다.
*/

const characterImage =
    new Image();

characterImage.src =
    "character.png";

let characterLoaded = false;

characterImage.onload = () => {
    characterLoaded = true;
};


/* ============================================================
   DOM
============================================================ */

const timerEl =
    document.getElementById("timer");

const progressEl =
    document.getElementById("progress");

const progressText =
    document.getElementById("progressText");

const heartBox =
    document.getElementById("heartBox");

const startScreen =
    document.getElementById("startScreen");

const endScreen =
    document.getElementById("endScreen");

const endTitle =
    document.getElementById("endTitle");

const endText =
    document.getElementById("endText");

const comboOverlay =
    document.getElementById("comboOverlay");

const comboCounter =
    document.getElementById("comboCounter");

const comboBar =
    document.getElementById("comboBar");

const whiteFlash =
    document.getElementById("whiteFlash");

const redFlash =
    document.getElementById("redFlash");


/* ============================================================
   AUDIO
============================================================ */

let audioCtx = null;

function initAudio() {

    if (!audioCtx) {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}


function playSound(
    type
) {

    if (!audioCtx) return;

    const now =
        audioCtx.currentTime;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    let frequency = 300;
    let duration = .08;
    let wave = "sine";

    switch(type) {

        case "ghost":

            frequency = 500;
            duration = .07;
            wave = "square";

            break;


        case "pop":

            frequency = 220;
            duration = .15;
            wave = "triangle";

            break;


        case "comboHit":

            frequency =
                400 +
                comboHits * 45;

            duration = .055;
            wave = "square";

            break;


        case "comboStart":

            frequency = 260;
            duration = .3;
            wave = "sawtooth";

            break;


        case "comboSuccess":

            frequency = 800;
            duration = .5;
            wave = "sine";

            break;


        case "damage":

            frequency = 100;
            duration = .22;
            wave = "sawtooth";

            break;


        case "win":

            frequency = 500;
            duration = .55;
            wave = "sine";

            break;


        case "lose":

            frequency = 90;
            duration = .55;
            wave = "sawtooth";

            break;
    }

    osc.type = wave;

    osc.frequency.setValueAtTime(
        frequency,
        now
    );

    if (
        type === "pop" ||
        type === "damage"
    ) {

        osc.frequency.exponentialRampToValueAtTime(
            45,
            now + duration
        );
    }

    if (type === "win") {

        osc.frequency.linearRampToValueAtTime(
            1000,
            now + duration
        );
    }

    gain.gain.setValueAtTime(
        .001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .15,
        now + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + duration
    );

    osc.start(now);
    osc.stop(now + duration + .02);
}


/* ============================================================
   GAME VARIABLES
============================================================ */

const GAME_TIME = 60;

let gameRunning = false;

let elapsed = 0;

let remaining = 60;

let lives = 3;

let lastTime = 0;

let shake = 0;


/* ============================================================
   ORB
============================================================ */

const orb = {

    x: W / 2,
    y: H / 2,

    radius: 43,

    pulse: 0
};


/* ============================================================
   GHOSTS
============================================================ */

let ghosts = [];


/*
    speedScale가 시간에 따라 증가합니다.

    초반:
        약 1배

    30초:
        약 1.6배

    60초:
        약 2.2배
*/

function currentSpeedMultiplier() {

    return (
        1 +
        (elapsed / GAME_TIME) * 1.2
    );
}


/*
    생성 빈도도 점점 빨라집니다.
*/

function currentSpawnInterval() {

    return Math.max(
        .22,
        .95 -
        elapsed * .012
    );
}


function createGhost() {

    const side =
        Math.floor(
            Math.random() * 4
        );

    let x;
    let y;

    const margin = 60;

    if (side === 0) {

        x =
            Math.random() * W;

        y =
            -margin;
    }

    else if (side === 1) {

        x =
            W + margin;

        y =
            Math.random() * H;
    }

    else if (side === 2) {

        x =
            Math.random() * W;

        y =
            H + margin;
    }

    else {

        x =
            -margin;

        y =
            Math.random() * H;
    }


    /*
        핑크 귀신은 조금 희귀하게
    */

    const pink =
        Math.random() <
        Math.min(
            .12 + elapsed * .002,
            .25
        );


    const baseSpeed =
        38 *
        currentSpeedMultiplier();


    return {

        x,
        y,

        radius:
            pink ? 24 : 21,

        pink,

        speed:
            baseSpeed *
            (
                .85 +
                Math.random() * .3
            ) *
            (
                pink ? .78 : 1
            ),

        bob:
            Math.random() *
            Math.PI *
            2,

        rot:
            Math.random() *
            Math.PI *
            2,

        dead: false
    };
}


/* ============================================================
   PARTICLES
============================================================ */

let particles = [];

let shockwaves = [];

let floatingTexts = [];


function particleBurst(
    x,
    y,
    color,
    amount = 20
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            60 +
            Math.random() *
            190;

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                2 +
                Math.random() * 5,

            color,

            life:
                .4 +
                Math.random() * .5
        });
    }
}


function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.life -= dt;

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        p.vx *= .97;
        p.vy *= .97;

        p.vy +=
            45 * dt;

        if (p.life <= 0) {

            particles.splice(i,1);
        }
    }
}


function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* ============================================================
   SHOCKWAVE
============================================================ */

function addShockwave(
    x,
    y,
    color
) {

    shockwaves.push({

        x,
        y,

        radius: 10,

        life: .35,

        color
    });
}


function updateShockwaves(dt) {

    for (
        let i =
            shockwaves.length - 1;
        i >= 0;
        i--
    ) {

        const s =
            shockwaves[i];

        s.radius +=
            250 * dt;

        s.life -= dt;

        if (s.life <= 0) {

            shockwaves.splice(i,1);
        }
    }
}


function drawShockwaves() {

    for (
        const s of shockwaves
    ) {

        ctx.globalAlpha =
            s.life / .35;

        ctx.strokeStyle =
            s.color;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    ctx.globalAlpha = 1;
}


/* ============================================================
   TEXT
============================================================ */

function floatingText(
    text,
    x,
    y,
    color
) {

    floatingTexts.push({

        text,
        x,
        y,

        color,

        life: .8
    });
}


function updateTexts(dt) {

    for (
        let i =
            floatingTexts.length - 1;
        i >= 0;
        i--
    ) {

        const t =
            floatingTexts[i];

        t.y -=
            35 * dt;

        t.life -= dt;

        if (t.life <= 0) {

            floatingTexts.splice(i,1);
        }
    }
}


function drawTexts() {

    ctx.textAlign =
        "center";

    for (
        const t of floatingTexts
    ) {

        ctx.globalAlpha =
            Math.min(
                1,
                t.life * 2
            );

        ctx.font =
            "900 28px Arial Black";

        ctx.lineWidth = 5;

        ctx.strokeStyle =
            "rgba(0,0,0,.45)";

        ctx.fillStyle =
            t.color;

        ctx.strokeText(
            t.text,
            t.x,
            t.y
        );

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );
    }

    ctx.globalAlpha = 1;
}

/* ============================================================
   SPAWNER
============================================================ */

let spawnTimer = .5;


function updateSpawner(dt) {

    if (comboActive) return;

    spawnTimer -= dt;

    if (
        spawnTimer <= 0
    ) {

        /*
            후반으로 갈수록
            동시에 여러 마리
        */

        let amount = 1;

        if (
            elapsed > 35 &&
            Math.random() < .28
        ) {
            amount = 2;
        }

        if (
            elapsed > 50 &&
            Math.random() < .22
        ) {
            amount = 3;
        }


        for (
            let i=0;
            i<amount;
            i++
        ) {

            ghosts.push(
                createGhost()
            );
        }


        spawnTimer =
            currentSpawnInterval() *
            (
                .7 +
                Math.random()*.35
            );
    }
}


/* ============================================================
   GHOST MOVEMENT
============================================================ */

function updateGhosts(dt) {

    /*
        연타 화면에서는
        일반 귀신 이동 정지
    */

    if (comboActive) {
        return;
    }


    for (
        let i=ghosts.length-1;
        i>=0;
        i--
    ) {

        const g =
            ghosts[i];

        g.bob +=
            dt * 5;

        g.rot +=
            dt * 2;


        const dx =
            orb.x - g.x;

        const dy =
            orb.y - g.y;

        const distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        /*
            구슬 도착
        */

        if (
            distance <
            orb.radius +
            g.radius
        ) {

            damageOrb();

            ghosts.splice(
                i,
                1
            );

            continue;
        }


        /*
            시간에 따라 speed 자체도
            계속 증가
        */

        const speedBoost =
            currentSpeedMultiplier();


        const nx =
            dx / distance;

        const ny =
            dy / distance;


        g.x +=
            nx *
            g.speed *
            speedBoost *
            dt;

        g.y +=
            ny *
            g.speed *
            speedBoost *
            dt;
    }
}

/* ============================================================
   COMBO UPDATE
============================================================ */

function updateCombo(dt) {

    if (!comboActive) {
        return;
    }


    comboTime -= dt;


    /*
        시간 게이지가
        자연스럽게 줄어듦
    */

    /*
        노란색/분홍색 바가
        남은 시간에 맞게 감소
    */

    const timePercent =
        Math.max(
            0,
            comboTime /
            COMBO_LIMIT *
            100
        );


    /*
        클릭 진행률과
        시간 제한을 동시에 보여주기 때문에
        시간에 따라 최소한의 시각적 긴장감 제공
    */


    if (
        comboTime <= 0
    ) {

        comboFail();
    }
}

/*
    일반 게임 클릭
*/

canvas.addEventListener(
    "pointerdown",
    function(e) {

        if (!gameRunning) {
            return;
        }

        if (comboActive) {
            return;
        }

        initAudio();


        const rect =
            canvas.getBoundingClientRect();


        const x =
            (
                e.clientX -
                rect.left
            )
            /
            rect.width *
            W;


        const y =
            (
                e.clientY -
                rect.top
            )
            /
            rect.height *
            H;


        /*
            뒤에서부터 검사해서
            위에 있는 귀신을 우선 클릭
        */

        for (
            let i =
                ghosts.length-1;
            i>=0;
            i--
        ) {

            const g =
                ghosts[i];


            const dx =
                x - g.x;

            const dy =
                y - g.y;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            /*
                클릭 판정 범위를 조금 넉넉하게
            */

            if (
                distance <
                g.radius + 20
            ) {

                if (
                    g.pink
                ) {

                    startCombo(g);

                } else {

                    killBlueGhost(g);
                }


                break;
            }
        }

    },
    {
        passive: false
    }
);


/*
    ★ 분홍 귀신 클로즈업 클릭

    comboOverlay 자체에서 이벤트를 받습니다.

    내부에 있는 글자/귀신 때문에
    클릭이 먹히지 않는 문제가 없도록
    capture 방식까지 사용합니다.
*/

comboOverlay.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        if (!comboActive) {
            return;
        }

        initAudio();

        comboClick();

    },
    true
);


/*
    모바일 터치
*/

comboOverlay.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);

        );


    if (
        index !== -1
    ) {

        ghosts.splice(
            index,
            1
        );
    }


    particleBurst(
        ghost.x,
        ghost.y,
        "#70e7ff",
        25
    );

    particleBurst(
        ghost.x,
        ghost.y,
        "#ffffff",
        10
    );


    addShockwave(
        ghost.x,
        ghost.y,
        "#8ceaff"
    );


    floatingText(
        "팡!",
        ghost.x,
        ghost.y - 25,
        "#ffffff"
    );


    whiteFlash.style.opacity =
        ".25";

    setTimeout(() => {

        whiteFlash.style.opacity =
            "0";

    },50);


    playSound(
        "pop"
    );
}


/* ============================================================
   TIMER
============================================================ */

function updateTimer(dt) {

    elapsed += dt;


    remaining =
        Math.max(
            0,
            GAME_TIME -
            elapsed
        );


    const seconds =
        Math.ceil(
            remaining
        );


    const min =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    const timeString =
        String(min)
            .padStart(2,"0")
        +
        ":" +
        String(sec)
            .padStart(2,"0");


    timerEl.textContent =
        timeString;


    progressText.textContent =
        "남은 시간: " +
        timeString;


    progressEl.style.width =
        (
            remaining /
            GAME_TIME *
            100
        ) +
        "%";


    /*
        60초 생존 성공
    */

    if (
        remaining <= 0
    ) {

        endGame(true);
    }
}


/* ============================================================
   END GAME
============================================================ */

function endGame(
    win
) {

    if (
        !gameRunning
    ) {
        return;
    }


    gameRunning = false;


    comboActive = false;

    comboOverlay.style.display =
        "none";


    if (win) {

        endTitle.textContent =
            "클리어! ✨";


        endText.innerHTML =
            `
            대단해요!<br>
            <b>1분 동안 노란 구슬을 지켜냈어요!</b><br>
            숲의 빛이 안전하게 보호되었습니다.
            `;


        particleBurst(
            orb.x,
            orb.y,
            "#fff36a",
            100
        );


        playSound(
            "win"
        );

    } else {

        endTitle.textContent =
            "게임 오버! 💥";


        endText.innerHTML =
            `
            귀신이 구슬을 너무 많이 공격했어요.<br>
            <b>다시 도전해보세요!</b>
            `;


        playSound(
            "lose"
        );
    }


    setTimeout(() => {

        endScreen.style.display =
            "flex";

    },500);
}


/* ============================================================
   START
============================================================ */

function startGame() {

    initAudio();


    elapsed = 0;

    remaining =
        GAME_TIME;

    lives = 3;


    ghosts = [];

    particles = [];

    shockwaves = [];

    floatingTexts = [];


    spawnTimer =
        .4;


    comboActive = false;

    comboHits = 0;

    comboTime = 0;


    gameRunning = true;


    startScreen.style.display =
        "none";

    endScreen.style.display =
        "none";

    comboOverlay.style.display =
        "none";


    updateHearts();


    lastTime =
        performance.now();
}


/* ============================================================
   UPDATE
============================================================ */

function update(dt) {

    updateParticles(dt);

    updateShockwaves(dt);

    updateTexts(dt);


    if (
        !gameRunning
    ) {
        return;
    }


    updateTimer(dt);


    if (
        !gameRunning
    ) {
        return;
    }


    updateSpawner(dt);

    updateGhosts(dt);

    updateCombo(dt);


    shake *= .88;

    if (
        shake < .2
    ) {
        shake = 0;
    }
}


/* ============================================================
   DRAW
============================================================ */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.save();


    if (
        shake > 0
    ) {

        ctx.translate(
            (
                Math.random()-.5
            ) * shake,

            (
                Math.random()-.5
            ) * shake
        );
    }


    drawBackground();


    /*
        중앙 구슬 주변 빛 영역
    */

    const area =
        ctx.createRadialGradient(
            orb.x,
            orb.y,
            30,
            orb.x,
            orb.y,
            230
        );

    area.addColorStop(
        0,
        "rgba(255,245,100,.18)"
    );

    area.addColorStop(
        1,
        "rgba(255,245,100,0)"
    );

    ctx.fillStyle =
        area;

    ctx.beginPath();

    ctx.arc(
        orb.x,
        orb.y,
        230,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        구슬
    */

    drawOrb();


    /*
        정면 수호 캐릭터
    */

    drawGuardian();


    /*
        귀신
    */

    for (
        const ghost of ghosts
    ) {

        drawGhost(
            ghost
        );
    }


    drawShockwaves();

    drawParticles();

    drawTexts();


    ctx.restore();
}


/* ============================================================
   LOOP
============================================================ */

function loop(now) {

    if (!lastTime) {
        lastTime = now;
    }


    let dt =
        (now-lastTime)/1000;


    /*
        탭 전환 등으로 시간이 크게
        튀는 것을 방지
    */

    dt =
        Math.min(
            dt,
            .05
        );


    lastTime =
        now;


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);


/* ============================================================
   BUTTONS
============================================================ */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        startGame
    );


/* ============================================================
   PREVENT MOBILE SCROLL
============================================================ */

document.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

    },
    {
        passive:false
    }
);

</script>
