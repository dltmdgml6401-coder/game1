<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>AI Poker Duel</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    min-height:100vh;
    color:white;
    font-family:Arial,"Malgun Gothic",sans-serif;

        radial-gradient(circle at 50% 20%,#29436b 0%,#111b2b 45%,#070b12 100%);
}

button{
    font-family:inherit;
}

}

header{

}

.title{

}

}

#main{
    display:grid;
    grid-template-columns:1fr 310px;
    gap:16px;
}

#table{
    min-height:720px;
    padding:25px;
    border-radius:25px;
    border:2px solid #3b5275;
    background:
        radial-gradient(circle at center,#175346 0%,#0d3b33 40%,#09231f 100%);
    box-shadow:
        inset 0 0 100px #0008,
        0 20px 60px #0007;
}

.playerName{
    font-size:17px;

    color:#d4e1f5;
}

}

    height:110px;

    justify-content:center;

}

    border:3px solid #eee;

}

    height:250px;

    flex-direction:column;

}

    min-height:35px;

}

#timerWrap{
    width:330px;

    border:1px solid #506789;
}

#timer{
    width:100%;
    height:100%;

        90deg,
        #39e68b,
        #f3d348,

#timerText{
    font-size:13px;

#handArea{

#hand{

.card{
    width:100px;

}

.card:hover{

        0 15px 28px #000b,

#controls{

    background:#263a58;

    cursor:pointer;

}

.actionBtn:hover{
    transform:translateY(-2px);

}

.actionBtn.primary{
    background:#247c58;
}

.actionBtn.danger{
    background:#8d3038;
}

.actionBtn:disabled{

}

.sideTitle{
    font-size:19px;
    font-weight:900;

}

#augmentList{

    flex-direction:column;

}

.augmentCard{

}

.augmentCard:hover{

.augmentCard.used{

}

}

.augmentDesc{

.rarity.silver{

.rarity.gold{

}

.rarity.platinum{
    background:#9c62e9;
}

#log{

#augmentOverlay,
#resultOverlay,
#suitOverlay{
    position:fixed;

    display:none;

}

.overlayBox{
    width:min(900px,92vw);

.overlayTitle{

.choice{

.choice:hover{

}

.suitButton{

    }

    #table{

    #augmentChoices{
        grid-template-columns:1fr;
    }

</style>
</head>

<script>

/* =========================================================
   기본 데이터
========================================================= */

const SUITS=[
    {name:"하트",symbol:"♥",color:"red"},
    {name:"다이아",symbol:"♦",color:"red"},
    {name:"클로버",symbol:"♣",color:"black"},
    {name:"스페이드",symbol:"♠",color:"black"}
];

const RANKS=[
    {name:"2",value:2},
    {name:"3",value:3},
    {name:"4",value:4},
    {name:"5",value:5},
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}
];


/* =========================================================
   증강 풀
   ★ 핵심:
   ★ 라운드에 따라 필터링하지 않는다.
   ★ 모든 증강이 처음부터 등장 가능하다.
========================================================= */

const AUGMENTS=[

/* =========================
   SILVER
========================= */

{
    id:"silver_draw",
    name:"추가 드로우",
    rarity:"silver",
    desc:"현재 손패가 8장 미만이면 카드를 1장 뽑습니다.",
    action(){
        if(state.hand.length>=8){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        drawCards(1);

        log("⚡ 추가 드로우 발동! 카드 1장을 뽑았습니다.");
        return true;
    }
},

{
    id:"silver_suit",
    name:"수트 변경",
    rarity:"silver",
    desc:"손패의 카드 1장을 선택하고 원하는 수트로 변경합니다.",
    action(){
        if(state.hand.length===0)return false;

        state.pendingSuitChange=true;

        showMessage("수트를 바꿀 카드를 클릭하세요.");

        return true;
    }
},

{
    id:"silver_luck",
    name:"행운의 카드",
    rarity:"silver",
    desc:"덱에서 무작위 카드를 1장 가져옵니다. 손패가 8장이면 발동하지 않습니다.",
    action(){
        if(state.hand.length>=8){
            showMessage("손패가 8장이라 행운의 카드가 들어올 수 없습니다.");
            return false;
        }

        drawCards(1);

        return true;
    }
},

{
    id:"silver_replace",
    name:"카드 교체",
    rarity:"silver",
    desc:"손패의 카드 1장을 버리고 새 카드를 1장 뽑습니다.",
    action(){
        state.pendingReplace=true;
        showMessage("교체할 카드를 클릭하세요.");
        return true;
    }
},

{
    id:"silver_pair",
    name:"쌍둥이",
    rarity:"silver",
    desc:"손패에서 카드 1장을 선택하면 같은 숫자의 카드를 1장 생성합니다.",
    action(){
        state.pendingTwin=true;
        showMessage("복제할 카드를 클릭하세요.");
        return true;
    }
},


/* =========================
   GOLD
========================= */

{
    id:"gold_draw2",
    name:"대량 드로우",
    rarity:"gold",
    desc:"손패가 8장이 될 때까지 최대 2장을 뽑습니다.",
    action(){
        const amount=Math.min(2,8-state.hand.length);

        if(amount<=0){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        drawCards(amount);

        return true;
    }
},

{
    id:"gold_swap",
    name:"상대 패 강탈",
    rarity:"gold",
    desc:"내 카드 1장과 AI의 카드 1장을 무작위로 교환합니다.",
    action(){

        if(state.hand.length===0 || state.enemyHand.length===0)
            return false;

        const a=Math.floor(Math.random()*state.hand.length);
        const b=Math.floor(Math.random()*state.enemyHand.length);

        const temp=state.hand[a];

        state.hand[a]=state.enemyHand[b];
        state.enemyHand[b]=temp;

        render();

        log("💰 상대 카드와 내 카드가 교환되었습니다.");

        return true;
    }
},

{
    id:"gold_twoSuit",
    name:"이중 수트 변환",
    rarity:"gold",
    desc:"카드 2장을 선택한 뒤 원하는 수트로 변경합니다.",
    action(){

        if(state.hand.length<2){
            showMessage("손패가 부족합니다.");
            return false;
        }

        state.pendingMultiSuit=true;
        state.tempSelected=[];

        showMessage("수트를 변경할 카드 2장을 선택하세요.");

        return true;
    }
},

{
    id:"gold_extra",
    name:"여분의 한 장",
    rarity:"gold",
    desc:"이번 라운드에 제출할 수 있는 카드 수가 5장에서 6장으로 증가합니다.",
    action(){
        state.maxSubmit=6;

        log("🔥 이번 라운드는 6장 제출이 가능합니다.");

        return true;
    }
},

{
    id:"gold_reroll",
    name:"운명 재굴림",
    rarity:"gold",
    desc:"손패의 카드 2장을 무작위 카드로 교체합니다.",
    action(){

        if(state.hand.length<2)return false;

        const indexes=shuffle(
            [...Array(state.hand.length).keys()]
        ).slice(0,2);

        indexes.forEach(i=>{
            state.hand[i]=drawOne();
        });

        render();

        log("🎲 카드 2장이 재굴림되었습니다.");

        return true;
    }
},


/* =========================
   PLATINUM
========================= */

{
    id:"plat_draw3",
    name:"플래티넘 드로우",
    rarity:"platinum",
    desc:"손패가 8장이 될 때까지 최대 3장을 뽑습니다.",
    action(){

        const amount=Math.min(
            3,
            8-state.hand.length
        );

        if(amount<=0){
            showMessage("손패가 이미 8장입니다.");
            return false;
        }

        drawCards(amount);

        return true;
    }
},

{
    id:"plat_wild",
    name:"와일드 카드",
    rarity:"platinum",
    desc:"손패의 카드 1장을 원하는 숫자와 수트로 완전히 변경합니다.",
    action(){

        state.pendingWild=true;

        showMessage("변경할 카드를 선택하세요.");

        return true;
    }
},

{
    id:"plat_steal",
    name:"왕의 교환",
    rarity:"platinum",
    desc:"AI의 카드 2장과 내 카드 2장을 교환합니다.",
    action(){

        if(
            state.hand.length<2 ||
            state.enemyHand.length<2
        ){
            return false;
        }

        const my=shuffle(
            [...Array(state.hand.length).keys()]
        ).slice(0,2);

        const enemy=shuffle(
            [...Array(state.enemyHand.length).keys()]
        ).slice(0,2);

        for(let i=0;i<2;i++){

            const temp=state.hand[my[i]];

            state.hand[my[i]]
                =state.enemyHand[enemy[i]];

            state.enemyHand[enemy[i]]
                =temp;
        }

        render();

        log("👑 왕의 교환 발동!");

        return true;
    }
},

{
    id:"plat_flush",
    name:"완벽한 수트",
    rarity:"platinum",
    desc:"선택한 카드 3장의 수트를 원하는 수트로 통일합니다.",
    action(){

        state.pendingTripleSuit=true;
        state.tempSelected=[];

        showMessage("수트를 바꿀 카드 3장을 선택하세요.");

        return true;
    }
},

{
    id:"plat_rank",
    name:"왕의 숫자",
    rarity:"platinum",
    desc:"카드 2장을 선택해 원하는 숫자로 변경합니다.",
    action(){

        state.pendingRankChange=true;
        state.tempSelected=[];

        showMessage("숫자를 변경할 카드 2장을 선택하세요.");

        return true;
    }
}

];


/* =========================================================
   상태
========================================================= */

let state={};

function resetGame(){

    state={
        stage:1,

        deck:[],

        hand:[],
        enemyHand:[],

        selected:[],

        maxSubmit:5,

        discards:0,

        maxDiscards:3,

        timer:30,
        timerMax:30,
        timerInterval:null,

        augmentOwned:[],
        usedAugments:[],

        pendingSuitChange:false,
        pendingReplace:false,
        pendingTwin:false,
        pendingMultiSuit:false,
        pendingTripleSuit:false,
        pendingWild:false,
        pendingRankChange:false,

        tempSelected:[],

        awaitingAugment:false,
        gameOver:false
    };

    startRound();
}


/* =========================================================
   덱
========================================================= */

function createDeck(){

    const deck=[];

    for(let s=0;s<SUITS.length;s++){

        for(let r=0;r<RANKS.length;r++){

            deck.push({
                suit:s,
                rank:r,
                id:`${s}-${r}-${Math.random()}`
            });

        }

    }

    return shuffle(deck);
}

function drawOne(){

    if(state.deck.length===0){
        state.deck=createDeck();
    }

    return state.deck.pop();
}

function drawCards(amount){

    for(let i=0;i<amount;i++){

        if(state.hand.length>=8)break;

        state.hand.push(drawOne());
    }

   유틸
========================================================= */

function shuffle(arr){

    const a=[...arr];

    for(let i=a.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [a[i],a[j]]=[a[j],a[i]];
    }

    return a;
}

function log(text){

    const el=document.getElementById("log");

    el.innerHTML+=
        `<div>• ${text}</div>`;

    el.scrollTop=el.scrollHeight;
}

function showMessage(text){

    document.getElementById("message").textContent=text;
}

function flash(type){

    const f=document.getElementById("flash");

    f.className="";

    void f.offsetWidth;

    f.className=
        type==="win"
        ?"winFlash"
        :"loseFlash";
}


/* =========================================================
   사운드
========================================================= */

let audioCtx=null;

function initAudio(){

    if(!audioCtx){

        audioCtx=
            new(window.AudioContext||
            window.webkitAudioContext)();
    }
}

function tone(freq,duration,type="sine",volume=.05){

    initAudio();

    const osc=audioCtx.createOscillator();

    const gain=audioCtx.createGain();

    osc.frequency.value=freq;
    osc.type=type;

    gain.gain.value=volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.stop(
        audioCtx.currentTime+duration
    );
}

function playSound(type){

    try{

        if(type==="draw"){

            tone(520,.07,"triangle",.045);

        }else if(type==="select"){

            tone(700,.04,"sine",.03);

        }else if(type==="augment"){

            tone(500,.08,"triangle",.05);

            setTimeout(
                ()=>tone(750,.12,"triangle",.05),
                80
            );

        }else if(type==="win"){

            tone(500,.1);

            setTimeout(
                ()=>tone(700,.1),
                100
            );

            setTimeout(
                ()=>tone(900,.2),
                200
            );

        }else if(type==="lose"){

            tone(250,.15,"sawtooth",.06);

            setTimeout(
                ()=>tone(170,.3,"sawtooth",.05),
                150
            );
        }

    }catch(e){}
}

function handleCardClick(index){

    /* 수트 변경 */

    if(state.pendingSuitChange){

        state.pendingSuitChange=false;

        openSuitSelector(index);

        return;
    }


    /* 카드 교체 */

    if(state.pendingReplace){

        state.pendingReplace=false;

        state.hand[index]=drawOne();

        render();

        log("🔄 카드가 교체되었습니다.");

        return;
    }


    /* 쌍둥이 */

    if(state.pendingTwin){

        state.pendingTwin=false;

        if(state.hand.length>=8){

            showMessage(
                "손패가 8장이라 복제할 수 없습니다."
            );

            return;
        }

        const original=state.hand[index];

        state.hand.push({
            suit:original.suit,
            rank:original.rank,
            id:`twin-${Math.random()}`
        });

        render();

        log("👯 같은 숫자의 카드가 생성되었습니다.");

        return;
    }


    /* 2장 수트 */

    if(state.pendingMultiSuit){

        selectTemp(index,2,()=>{
            openSuitSelectorMulti();
        });

        return;
    }


    /* 3장 수트 */

    if(state.pendingTripleSuit){

        selectTemp(index,3,()=>{
            openSuitSelectorMulti();
        });

        return;
    }


    /* 숫자 변경 */

    if(state.pendingRankChange){

        selectTemp(index,2,()=>{
            openRankSelector();
        });

        return;
    }


    /* 와일드 */

    if(state.pendingWild){

        state.pendingWild=false;

        openWildSelector(index);

        return;
    }


    /* 일반 선택 */

    const pos=state.selected.indexOf(index);

    if(pos>=0){

        state.selected.splice(pos,1);

    }else{

        if(
            state.selected.length<
            state.maxSubmit
        ){

            state.selected.push(index);

        }else{

            showMessage(
                `최대 ${state.maxSubmit}장까지 선택할 수 있습니다.`
            );

            return;
        }
    }

    playSound("select");

    render();

    showMessage(
        `${state.selected.length}/${state.maxSubmit}장 선택`
    );
}

/* =========================================================

   ★ 중요:
   ★ stage 조건 없음
   ★ 모든 증강 풀 사용
========================================================= */

function generateAugmentChoices(){

    /*
        이미 보유한 증강은 제외
    */

    const available=
        AUGMENTS.filter(augment=>
            !state.augmentOwned
                .some(a=>a.id===augment.id)
        );

    if(available.length<3){
        return shuffle(available);
    }

    /*
        ★ 플래티넘 등장 확률
        약 15%
    */

    const platinumRoll=
        Math.random()<0.15;

    let candidates=[];

    if(platinumRoll){

        /*
            플래티넘이 걸리면
            무조건 3개 모두 플래티넘
        */

        const platinum=
            available.filter(
                a=>a.rarity==="platinum"
            );

        candidates=
            shuffle(platinum).slice(0,3);

        /*
            혹시 플래티넘이 3개보다 적으면
            다시 전체에서 구성
        */

        if(candidates.length<3){

            candidates=
                shuffle(available)
                .slice(0,3);
        }

    }else{

        /*
            일반적으로는 실버/골드/플래티넘
            전체 풀에서 랜덤
        */

        candidates=
            shuffle(available).slice(0,3);
    }

    return candidates;
}

function timeoutSubmit(){

    /*
        시간 초과면 자동 제출
        선택된 카드가 5장 미만이면
        앞쪽 카드부터 채운다.
    */

    if(state.selected.length===0){

        state.selected=
            [...Array(
                Math.min(
                    state.maxSubmit,
                    state.hand.length
                )
            ).keys()];
    }

    while(
        state.selected.length<
        Math.min(
            state.maxSubmit,
            state.hand.length
        )
    ){

        const candidates=
            [...Array(state.hand.length).keys()]
            .filter(
                i=>!state.selected.includes(i)
            );

        if(candidates.length===0)break;

        state.selected.push(
            candidates[0]
        );
    }

    submitHand();
}

        );

        AI는 8장 중 가장 강한 5장
    */

    const enemyBest=

        evaluateHand(playerCards);

/* =========================================================
   족보 계산
========================================================= */

function evaluateHand(cards){

    const values=
        cards.map(
            c=>RANKS[c.rank].value
        ).sort((a,b)=>b-a);

    const suits=
        cards.map(c=>c.suit);

    const counts={};

    values.forEach(v=>{
        counts[v]=(counts[v]||0)+1;
    });

    const groups=
        Object.entries(counts)
        .map(([value,count])=>({
            value:Number(value),
            count
        }))
        .sort(
            (a,b)=>
                b.count-a.count ||
                b.value-a.value
        );

    const unique=
        [...new Set(values)]
        .sort((a,b)=>b-a);

    let straightHigh=null;

    if(unique.includes(14)){
        unique.push(1);
    }

    for(let i=0;i<=unique.length-5;i++){

        const slice=
            unique.slice(i,i+5);

        if(
            slice[0]-slice[4]===4
        ){

            straightHigh=slice[0];

            break;
        }
    }

    const flush=
        cards.length===5 &&
        suits.every(
            s=>s===suits[0]
        );

    if(flush && straightHigh){

        return {
            rank:8,
            values:[straightHigh],
            name:"로열/스트레이트 플러시"
        };
    }

    if(groups[0]?.count===4){

        return {
            rank:7,
            values:[
                groups[0].value,
                groups[1]?.value||0
            ],
            name:"포카드"
        };
    }

    if(
        groups[0]?.count===3 &&
        groups[1]?.count===2
    ){

        return {
            rank:6,
            values:[
                groups[0].value,
                groups[1].value
            ],
            name:"풀하우스"
        };
    }

    if(flush){

        return {
            rank:5,
            values,
            name:"플러시"
        };
    }

    if(straightHigh){

        return {
            rank:4,
            values:[straightHigh],
            name:"스트레이트"
        };
    }

    if(groups[0]?.count===3){

        return {
            rank:3,
            values:[
                groups[0].value,
                ...groups
                    .slice(1)
                    .map(x=>x.value)
                    .sort((a,b)=>b-a)
            ],
            name:"트리플"
        };
    }

    if(
        groups[0]?.count===2 &&
        groups[1]?.count===2
    ){

        return {
            rank:2,
            values:[
                Math.max(
                    groups[0].value,
                    groups[1].value
                ),
                Math.min(
                    groups[0].value,
                    groups[1].value
                ),
                groups[2]?.value||0
            ],
            name:"투페어"
        };
    }

    if(groups[0]?.count===2){

        return {
            rank:1,
            values:[
                groups[0].value,
                ...groups
                    .slice(1)
                    .map(x=>x.value)
                    .sort((a,b)=>b-a)
            ],
            name:"원페어"
        };
    }

    return {
        rank:0,
        values,
        name:"하이카드"
    };
}

function compareScores(a,b){

    if(a.rank!==b.rank){

        return a.rank-b.rank;
    }

    for(
        let i=0;
        i<Math.max(
            a.values.length,
            b.values.length
        );
        i++
    ){

        const av=a.values[i]||0;
        const bv=b.values[i]||0;

        if(av!==bv){

            return av-bv;
        }
    }

    return 0;
}


/* =========================================================
   8장 중 최강 5장
========================================================= */

function bestFiveFromHand(hand){

    if(hand.length<=5)
        return [...hand];

    let best=null;
    let bestScore=null;

    const n=hand.length;

    for(let a=0;a<n-4;a++){
        for(let b=a+1;b<n-3;b++){
            for(let c=b+1;c<n-2;c++){
                for(let d=c+1;d<n-1;d++){
                    for(let e=d+1;e<n;e++){

                        const five=[
                            hand[a],
                            hand[b],
                            hand[c],
                            hand[d],
                            hand[e]
                        ];

                        const score=
                            evaluateHand(five);

                        if(
                            !bestScore ||
                            compareScores(
                                score,
                                bestScore
                            )>0
                        ){

                            bestScore=score;
                            best=five;
                        }
                    }
                }
            }
        }
    }

    return best;
}

function prepareEnemyForStage(){

        Math.min(
            1,
            (state.stage-1)/7
        );

    /*
        현재 enemyHand를
        랜덤 카드에서 조금씩 강한 카드로 교체
    */

    for(
        let i=0;
        i<state.enemyHand.length;
        i++
    ){

        if(Math.random()<difficulty*.25){

            const strongRanks=
                [8,9,10,11,12];

            state.enemyHand[i]={
                suit:
                    Math.floor(
                        Math.random()*4
                    ),
                rank:
                    strongRanks[
                        Math.floor(
                            Math.random()*
                            strongRanks.length
                        )
                    ],
                id:`ai-${Math.random()}`
            };

        }
    }
}
