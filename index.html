<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>코어를 지켜라!</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0c1b18;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif
}
body{
  display:flex;
  align-items:center;
  justify-content:center
}
#game{
  position:relative;
  width:min(100vw,177.777vh);
  height:min(56.25vw,100vh);
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#d8f99b 0,#a9e66e 20%,#5fa94d 52%,#1d5339 100%);
  cursor:crosshair
}
#game:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.2) 0 2px,transparent 3px),
    radial-gradient(circle at 80% 30%,rgba(255,255,255,.18) 0 2px,transparent 3px),
    radial-gradient(circle at 35% 80%,rgba(255,255,255,.14) 0 2px,transparent 3px);
  background-size:130px 110px,170px 140px,190px 150px;
  opacity:.7;
  pointer-events:none
}

button{
  font:inherit;
  border:0;
  cursor:pointer
}

#startScreen,#endScreen{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(10,35,25,.72);
  backdrop-filter:blur(5px)
}

.panel{
  width:min(520px,88%);
  padding:38px 32px;
  border-radius:28px;
  background:rgba(255,248,220,.96);
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  text-align:center;
  border:4px solid #fff
}

.panel h1{
  margin:0 0 12px;
  color:#273c20;
  font-size:clamp(30px,5vw,46px);
  line-height:1.15
}

.panel p{
  margin:10px 0;
  color:#536047;
  font-weight:700;
  font-size:17px;
  line-height:1.6
}

.startBtn{
  margin-top:22px;
  padding:14px 34px;
  border-radius:999px;
  color:white;
  background:#66b83f;
  font-size:22px;
  font-weight:900;
  box-shadow:0 6px 0 #438328;
  transition:.12s
}
.startBtn:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #438328
}

#hud{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none
}

.hudBox{
  position:absolute;
  top:18px;
  padding:10px 18px;
  border-radius:18px;
  background:rgba(255,248,220,.94);
  color:#342c1c;
  font-weight:900;
  box-shadow:0 5px 15px rgba(0,0,0,.2)
}

#timerBox{left:18px}
#lifeBox{right:18px}

#timer{
  font-size:27px
}

#lives{
  color:#ef5966;
  font-size:27px;
  letter-spacing:4px
}

#core{
  position:absolute;
  left:50%;
  top:50%;
  width:145px;
  height:145px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,#fff 0 7%,transparent 8%),
    radial-gradient(circle at 55% 45%,#fff9a0 0,#ffd83c 45%,#f7ad12 75%,#e88a00 100%);
  border:7px solid #fff5a3;
  box-shadow:
    0 0 20px #fff6a0,
    0 0 45px #ffd62f,
    0 0 90px rgba(255,207,32,.7);
  z-index:5
}

#core:before{
  content:"";
  position:absolute;
  inset:-30px;
  border:3px solid rgba(255,239,100,.7);
  border-radius:50%;
  animation:pulse 1.5s infinite
}

#core:after{
  content:"";
  position:absolute;
  inset:-55px;
  border:2px solid rgba(255,238,85,.35);
  border-radius:50%;
  animation:pulse 2.2s infinite reverse
}

@keyframes pulse{
  0%,100%{transform:scale(.92);opacity:.4}
  50%{transform:scale(1.08);opacity:1}
}

#hero{
  position:absolute;
  left:50%;
  top:calc(50% + 95px);
  transform:translate(-50%,-50%);
  width:115px;
  z-index:8;
  pointer-events:none;
  filter:drop-shadow(0 7px 7px rgba(0,0,0,.25))
}

.ghost{
  position:absolute;
  width:82px;
  height:82px;
  object-fit:contain;
  z-index:10;
  cursor:pointer;
  user-select:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 7px 8px rgba(0,0,0,.25));
  transition:transform .08s
}

.ghost:hover{
  transform:scale(1.08)
}

.ghost.hit{
  animation:ghostHit .18s
}

@keyframes ghostHit{
  0%{transform:scale(1)}
  50%{transform:scale(1.25) rotate(-5deg)}
  100%{transform:scale(0);opacity:0}
}

#effects{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none
}

.spark{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  animation:spark .55s forwards
}

@keyframes spark{
  from{
    transform:translate(0,0) scale(1);
    opacity:1
  }
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0
  }
}

#message{
  position:absolute;
  left:50%;
  bottom:28px;
  transform:translateX(-50%);
  z-index:25;
  padding:12px 24px;
  border-radius:999px;
  background:rgba(20,25,18,.8);
  color:white;
  font-size:18px;
  font-weight:900;
  pointer-events:none
}

#comboScreen{
  position:absolute;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(245,145,170,.88)
}

#comboScreen.show{
  display:flex
}

.comboPanel{
  width:min(620px,82%);
  text-align:center;
  animation:comboIn .18s ease-out
}

@keyframes comboIn{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

#comboGhost{
  width:min(390px,70vw);
  max-height:55vh;
  object-fit:contain;
  filter:drop-shadow(0 15px 15px rgba(0,0,0,.2))
}

.comboTitle{
  margin:-8px 0 2px;
  font-size:clamp(45px,8vw,85px);
  font-weight:1000;
  color:#ff675f;
  -webkit-text-stroke:4px white;
  text-shadow:5px 6px 0 #452421;
  transform:rotate(-4deg)
}

#comboCount{
  display:inline-block;
  min-width:150px;
  padding:9px 24px;
  border-radius:14px;
  background:#1f1a1a;
  color:white;
  font-size:30px;
  font-weight:1000
}

#endScreen{
  display:none
}

#endTitle{
  font-size:45px
}

#endText{
  font-size:20px;
  margin:10px 0 20px
}

#flash{
  position:absolute;
  inset:0;
  z-index:70;
  background:#fff;
  opacity:0;
  pointer-events:none
}

#flash.show{
  animation:flash .25s
}

@keyframes flash{
  0%{opacity:.8}
  100%{opacity:0}
}

@media(max-width:600px){
  #core{
    width:105px;
    height:105px
  }

  #hero{
    width:88px;
    top:calc(50% + 72px)
  }

  .ghost{
    width:62px;
    height:62px
  }

  .hudBox{
    top:10px;
    padding:7px 12px
  }

  #timer{
    font-size:20px
  }

  #lives{
    font-size:20px
  }

  #message{
    bottom:12px;
    font-size:14px;
    padding:9px 15px
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="startScreen">
    <div class="panel">
      <h1>🌟 코어를 지켜라!</h1>
      <p>
        사방에서 몰려오는 귀신을 클릭해서 제거하세요!<br>
        🩵 파란 귀신은 한 번 클릭하면 제거됩니다.<br>
        🩷 분홍 귀신은 클릭 후 <b>연타!</b>해야 합니다.
      </p>
      <p>귀신이 코어에 3번 닿기 전에<br><b>1분을 버티면 클리어!</b></p>
      <button class="startBtn" id="startBtn">게임 시작</button>
    </div>
  </div>

  <div id="hud">
    <div class="hudBox" id="timerBox">
      ⏱️ <span id="timer">01:00</span>
    </div>

    <div class="hudBox" id="lifeBox">
      <span id="lives">♥ ♥ ♥</span>
    </div>
  </div>

  <div id="core"></div>

  <img id="hero" alt="수호 캐릭터">

  <div id="effects"></div>

  <div id="message">
    👻 귀신을 클릭해서 코어를 지켜주세요!
  </div>

  <div id="flash"></div>

  <div id="comboScreen">
    <div class="comboPanel">
      <div class="comboTitle">연타!</div>
      <img id="comboGhost" alt="분홍 귀신">
      <br>
      <div id="comboCount">0 / 10</div>
    </div>
  </div>

  <div id="endScreen">
    <div class="panel">
      <h1 id="endTitle"></h1>
      <p id="endText"></p>
      <button class="startBtn" id="restartBtn">다시 하기</button>
    </div>
  </div>

</div>

<script>
/* =========================
   이미지
========================= */

const HERO_IMG =
'data:image/webp;base64,REPLACE_HERO_IMAGE';

const PINK_GHOST =
'data:image/webp;base64,REPLACE_PINK_IMAGE';

const BLUE_GHOST =
'data:image/webp;base64,REPLACE_BLUE_IMAGE';


/* =========================
   DOM
========================= */

const game=document.getElementById("game");
const startScreen=document.getElementById("startScreen");
const endScreen=document.getElementById("endScreen");
const startBtn=document.getElementById("startBtn");
const restartBtn=document.getElementById("restartBtn");
const timerEl=document.getElementById("timer");
const livesEl=document.getElementById("lives");
const hero=document.getElementById("hero");
const effects=document.getElementById("effects");
const comboScreen=document.getElementById("comboScreen");
const comboGhost=document.getElementById("comboGhost");
const comboCount=document.getElementById("comboCount");
const flash=document.getElementById("flash");
const endTitle=document.getElementById("endTitle");
const endText=document.getElementById("endText");


/* =========================
   이미지 설정
========================= */

hero.src=HERO_IMG;
comboGhost.src=PINK_GHOST;


/* =========================
   게임 상태
========================= */

let running=false;
let elapsed=0;
let lastTime=0;
let spawnTimer=0;
let hitCount=0;

let ghosts=[];
let ghostId=0;

let comboActive=false;
let comboHits=0;
let comboStart=0;


/* =========================
   Web Audio
========================= */

let audioCtx=null;

function audio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==="suspended") audioCtx.resume();
}

function tone(freq,duration,type="sine",volume=.05){
  audio();

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function soundBlue(){
  tone(540,.08,"square",.05);
  setTimeout(()=>tone(820,.1,"sine",.04),35);
}

function soundPink(){
  tone(260,.12,"sawtooth",.05);
}

function soundCombo(){
  tone(700,.05,"square",.04);
}

function soundDamage(){
  tone(100,.25,"sawtooth",.08);
  setTimeout(()=>tone(70,.25,"sawtooth",.05),70);
}

function soundClear(){
  tone(523,.12,"sine",.06);
  setTimeout(()=>tone(659,.12,"sine",.06),100);
  setTimeout(()=>tone(784,.2,"sine",.07),200);
}

function soundGameOver(){
  tone(180,.2,"sawtooth",.06);
  setTimeout(()=>tone(110,.4,"sawtooth",.06),150);
}


/* =========================
   이펙트
========================= */

function burst(x,y,count=12){
  for(let i=0;i<count;i++){
    const s=document.createElement("div");
    s.className="spark";

    s.style.left=x+"px";
    s.style.top=y+"px";

    const a=Math.random()*Math.PI*2;
    const d=35+Math.random()*70;

    s.style.setProperty("--x",Math.cos(a)*d+"px");
    s.style.setProperty("--y",Math.sin(a)*d+"px");

    effects.appendChild(s);

    setTimeout(()=>s.remove(),600);
  }
}


/* =========================
   귀신 생성
========================= */

function spawnGhost(){

  if(!running || comboActive)return;

  const rect=game.getBoundingClientRect();

  const side=Math.floor(Math.random()*4);

  let x;
  let y;

  const size=82;

  if(side===0){
    x=Math.random()*(rect.width-size);
    y=-size;
  }

  else if(side===1){
    x=rect.width;
    y=Math.random()*(rect.height-size);
  }

  else if(side===2){
    x=Math.random()*(rect.width-size);
    y=rect.height;
  }

  else{
    x=-size;
    y=Math.random()*(rect.height-size);
  }

  const pink=Math.random() < Math.min(.12 + elapsed/600, .32);

  const img=document.createElement("img");

  img.className="ghost";
  img.src=pink ? PINK_GHOST : BLUE_GHOST;
  img.draggable=false;

  game.appendChild(img);

  const g={
    id:ghostId++,
    el:img,
    x,
    y,
    pink,
    speed:42 + elapsed*.16 + Math.random()*12,
    dead:false
  };

  ghosts.push(g);

  img.style.left=x+"px";
  img.style.top=y+"px";

  img.addEventListener("click",e=>{
    e.stopPropagation();
    clickGhost(g);
  });
}


/* =========================
   귀신 클릭
========================= */

function clickGhost(g){

  if(!running || g.dead || comboActive)return;

  if(g.pink){
    startCombo(g);
  }else{
    killGhost(g);
    soundBlue();
  }
}


/* =========================
   파란 귀신 제거
========================= */

function killGhost(g){

  if(g.dead)return;

  g.dead=true;

  const r=g.el.getBoundingClientRect();
  const gr=game.getBoundingClientRect();

  burst(
    r.left-gr.left+r.width/2,
    r.top-gr.top+r.height/2,
    15
  );

  g.el.classList.add("hit");

  setTimeout(()=>{
    g.el.remove();
    ghosts=ghosts.filter(x=>x!==g);
  },170);
}


/* =========================
   분홍 귀신 연타
========================= */

function startCombo(g){

  comboActive=true;
  comboHits=0;
  comboStart=performance.now();

  comboGhost.src=PINK_GHOST;
  comboCount.textContent="0 / 10";

  comboScreen.classList.add("show");

  soundPink();

  g.dead=true;
}


/* =========================
   연타 처리
========================= */

comboScreen.addEventListener("click",()=>{

  if(!comboActive)return;

  comboHits++;

  comboCount.textContent=comboHits+" / 10";

  soundCombo();

  comboCount.animate(
    [
      {transform:"scale(1)"},
      {transform:"scale(1.18)"},
      {transform:"scale(1)"}
    ],
    {duration:100}
  );

  if(comboHits>=10){
    comboActive=false;
    comboScreen.classList.remove("show");

    burst(
      game.clientWidth/2,
      game.clientHeight/2,
      28
    );

    soundBlue();
  }
});


/* =========================
   코어 충돌
========================= */

function damageCore(g){

  if(g.dead)return;

  g.dead=true;

  hitCount++;

  const r=g.el.getBoundingClientRect();
  const gr=game.getBoundingClientRect();

  burst(
    r.left-gr.left+r.width/2,
    r.top-gr.top+r.height/2,
    20
  );

  g.el.remove();

  ghosts=ghosts.filter(x=>x!==g);

  flash.classList.remove("show");
  void flash.offsetWidth;
  flash.classList.add("show");

  soundDamage();

  updateLives();

  if(hitCount>=3){
    gameOver();
  }
}


/* =========================
   체력 표시
========================= */

function updateLives(){

  let s="";

  for(let i=0;i<3;i++){
    s+=i<hitCount ? "♡ " : "♥ ";
  }

  livesEl.textContent=s.trim();
}


/* =========================
   귀신 이동
========================= */

function moveGhost(g,dt){

  const rect=game.getBoundingClientRect();

  const coreX=rect.width/2;
  const coreY=rect.height/2;

  const dx=coreX-(g.x+41);
  const dy=coreY-(g.y+41);

  const dist=Math.sqrt(dx*dx+dy*dy);

  if(dist<82){
    damageCore(g);
    return;
  }

  g.x+=(dx/dist)*g.speed*dt;
  g.y+=(dy/dist)*g.speed*dt;

  g.el.style.left=g.x+"px";
  g.el.style.top=g.y+"px";
}


/* =========================
   난이도
========================= */

function getSpawnInterval(){

  // 시간이 지날수록 등장 간격 감소
  return Math.max(
    320,
    1150 - elapsed*11
  );
}


/* =========================
   게임 루프
========================= */

function loop(t){

  if(!running)return;

  if(!lastTime)lastTime=t;

  const dt=Math.min(
    .04,
    (t-lastTime)/1000
  );

  lastTime=t;

  elapsed+=(dt*1000);

  const remain=Math.max(
    0,
    60000-elapsed
  );

  const sec=Math.ceil(remain/1000);

  const mm=String(
    Math.floor(sec/60)
  ).padStart(2,"0");

  const ss=String(
    sec%60
  ).padStart(2,"0");

  timerEl.textContent=mm+":"+ss;

  if(elapsed>=60000){
    clearGame();
    return;
  }

  spawnTimer+=dt*1000;

  if(spawnTimer>=getSpawnInterval()){

    spawnTimer=0;

    // 시간이 지날수록 한 번에 나오는 숫자 증가
    const amount=
      elapsed>45000 ? 3 :
      elapsed>30000 ? 2 :
      elapsed>15000 ? 2 :
      1;

    for(let i=0;i<amount;i++){
      spawnGhost();
    }
  }

  for(const g of [...ghosts]){
    if(!g.dead){
      moveGhost(g,dt);
    }
  }

  requestAnimationFrame(loop);
}


/* =========================
   게임 시작
========================= */

function startGame(){

  audio();

  running=true;
  elapsed=0;
  lastTime=0;
  spawnTimer=0;
  hitCount=0;
  ghosts=[];
  comboActive=false;
  comboHits=0;

  document
    .querySelectorAll(".ghost")
    .forEach(x=>x.remove());

  comboScreen.classList.remove("show");

  updateLives();

  timerEl.textContent="01:00";

  startScreen.style.display="none";
  endScreen.style.display="none";

  requestAnimationFrame(loop);
}


/* =========================
   클리어
========================= */

function clearGame(){

  if(!running)return;

  running=false;

  comboActive=false;
  comboScreen.classList.remove("show");

  soundClear();

  endTitle.textContent="🎉 클리어!";
  endText.innerHTML=
    "1분 동안 코어를 지켜냈어요!<br>🌟 코어가 안전합니다!";

  endScreen.style.display="flex";
}


/* =========================
   게임 오버
========================= */

function gameOver(){

  if(!running)return;

  running=false;

  comboActive=false;
  comboScreen.classList.remove("show");

  soundGameOver();

  endTitle.textContent="💥 게임 오버";
  endText.innerHTML=
    "귀신이 코어에 3번 닿았어요!<br>다시 도전해보세요!";

  endScreen.style.display="flex";
}


/* =========================
   버튼
========================= */

startBtn.addEventListener("click",startGame);
restartBtn.addEventListener("click",startGame);


/* =========================
   초기 상태
========================= */

updateLives();

</script>
</body>
</html>
