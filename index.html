<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="외계인의 크리스털 쥐 포획 미니게임" />
    <title>외계인 | 크리스털 쥐 포획</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="polish.css" />
  </head>
  <body>
    <main id="game" class="game" aria-label="크리스털 쥐 포획 게임">
      <div class="sky-glow"></div>
      <div class="trees trees-left"></div>
      <div class="trees trees-right"></div>

      <div class="fence">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="garden-texture"></div>

      <aside class="alien-card panel">
        <div class="alien-portrait">
          <div class="tiny-alien"><b></b><i></i><i></i></div>
        </div>
        <div>
          <strong>외계인</strong>
          <p>
            망치 형태로 변형!<br />
            <b>쥐(구슬 조각)를 5번 연속</b>으로<br />
            때려야 잡을 수 있어!
          </p>
        </div>
      </aside>

      <aside class="hint-card panel">
        <div class="crystal-icon">✦</div>
        <p>
          구슬 조각 <b>(정체)</b><br />
          <strong>크리스털처럼<br />빛나는 쥐</strong>를 찾아봐!
        </p>
      </aside>

      <section class="stats" aria-label="게임 정보">
        <div class="panel stat">
          <span>TIME</span>
          <strong id="timer">60</strong>
        </div>

        <div class="panel stat">
          <span>SCORE</span>
          <strong id="score">0</strong>
        </div>

        <div class="panel stat combo-stat">
          <span>COMBO</span>
          <strong id="combo">0 / 5</strong>
          <div id="pips" class="pips"></div>
        </div>

        <button id="pause" class="panel pause" aria-label="일시정지">Ⅱ</button>
      </section>

      <section id="holes" class="holes" aria-label="마당의 쥐 구멍"></section>

      <section class="bottom-combo panel">
        <span>연속 성공</span>
        <strong id="bottom-combo">0 / 5</strong>
        <div id="bottom-pips" class="pips"></div>
      </section>

      <section class="warning panel">
        <strong>Miss 시<br />리셋!</strong>
        <span>💥</span>
      </section>

      <div id="feedback" class="feedback" aria-live="polite"></div>

      <div id="hammer" class="hammer" aria-hidden="true">
        <div class="alien-arm"></div>
        <div class="hammer-head">
          <i class="hammer-leaf left"></i>
          <i class="hammer-leaf right"></i>
          <b>✦</b>
        </div>
      </div>

      <div id="impact" class="impact" aria-hidden="true">✦</div>

      <div id="modal" class="modal">
        <div class="modal-card">
          <p>MINI GAME 01</p>
          <h1>크리스털 쥐를 잡아라!</h1>
          <div>
            빛나는 크리스털 쥐를 <b>5번 연속</b> 클릭하세요.<br />
            회색 쥐 또는 빈 구멍을 클릭하면 연속 성공이 초기화됩니다.
          </div>
          <button id="start">탐색 시작</button>
        </div>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
