<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당신이 판사라면? - 법정 양형 체험 게임</title>
  <style>
    :root {
      --bg-dark: #121212;
      --wood-dark: #2a1b0e;
      --wood-light: #422d1b;
      --gold: #d4af37;
      --prosecutor-color: #2b4c7e;
      --defense-color: #2e7d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      font-family: 'Pretendard', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-window {
      width: 800px;
      height: 600px;
      background: linear-gradient(to bottom, #3a2312, #1a0f07);
      border: 6px solid var(--gold);
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* 상단 법정 상태바 */
    .top-bar {
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold);
      font-size: 0.9em;
    }

    /* 중앙 캐릭터 및 시각 연출 무대 */
    .stage {
      flex: 1;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 20px;
      position: relative;
    }
    .character-box {
      text-align: center;
      transition: all 0.3s ease;
      opacity: 0.4;
      transform: scale(0.9);
    }
    .character-box.active {
      opacity: 1;
      transform: scale(1.05);
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #fff;
      margin-bottom: 10px;
      background-size: cover;
      background-position: center;
    }
    .prosecutor-avatar {
      background-image: url('https://api.dicebear.com/7.x/bottts/svg?seed=prosecutor');
      border-color: #4a90e2;
    }
    .defense-avatar {
      background-image: url('https://api.dicebear.com/7.x/bottts/svg?seed=defense');
      border-color: #66bb6a;
    }
    .char-name {
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
    }
    .prosecutor-name { background: var(--prosecutor-color); }
    .defense-name { background: var(--defense-color); }

    /* 대화창 영역 */
    .dialogue-box {
      height: 180px;
      background: rgba(20, 20, 20, 0.9);
      border-top: 3px solid var(--gold);
      padding: 20px;
      position: relative;
    }
    .speaker-tag {
      color: var(--gold);
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 8px;
    }
    .dialogue-text {
      font-size: 1em;
      line-height: 1.6;
      color: #eee;
    }
    .next-btn {
      position: absolute;
      right: 20px;
      bottom: 20px;
      padding: 8px 20px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 판결 양형 조절 슬라이더 대화창 오버레이 */
    .verdict-overlay {
      display: none;
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 220px;
      background: rgba(15, 10, 5, 0.95);
      border-top: 4px solid var(--gold);
      padding: 20px;
      text-align: center;
    }
    .slider-val {
      font-size: 1.8em;
      color: #ff5252;
      font-weight: bold;
      margin: 10px 0;
    }
    input[type=range] { width: 80%; }
    .gavel-btn {
      margin-top: 15px;
      padding: 12px 30px;
      background: #8b0000;
      color: #fff;
      border: 2px solid var(--gold);
      border-radius: 20px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
    }

    /* 최종 결과 오버레이 */
    .result-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      background: #222;
      border: 3px solid var(--gold);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="game-window">
  <!-- 상단 상태바 -->
  <div class="top-bar">
    <span>🏛️ 제1형사법정 (판사석 View)</span>
    <span>사건 <span id="case-num">1</span> / 3</span>
  </div>

  <!-- 중앙 법정 무대 (캐릭터 위치) -->
  <div class="stage">
    <div id="prosecutor-box" class="character-box">
      <div class="avatar prosecutor-avatar"></div>
      <div class="char-name prosecutor-name">박검사</div>
    </div>
    <div id="defense-box" class="character-box">
      <div class="avatar defense-avatar"></div>
      <div class="char-name defense-name">김변호사</div>
    </div>
  </div>

  <!-- 하단 대화창 -->
  <div class="dialogue-box">
    <div id="speaker-tag" class="speaker-tag">사건 개요</div>
    <div id="dialogue-text" class="dialogue-text">대화를 불러오는 중...</div>
    <button id="next-btn" class="next-btn" onclick="nextDialogue()">다음 ▶</button>
  </div>

  <!-- 판결 컨트롤 UI -->
  <div id="verdict-overlay" class="verdict-overlay">
    <div style="color: var(--gold); font-weight: bold;">[판사석] 피고인에 대한 최종 형량을 결정하십시오.</div>
    <div class="slider-val"><span id="sentence-text">12</span></div>
    <input type="range" id="sentence-slider" min="0" max="120" value="12" oninput="updateSentenceText(this.value)">
    <br>
    <button class="gavel-btn" onclick="submitVerdict()">🔨 탕! 탕! 탕! (주문 선고)</button>
  </div>

  <!-- 판결 결과 모달 -->
  <div id="result-modal" class="result-modal">
    <h2 style="color: var(--gold); margin-top: 0;">📜 판결 결과 선고</h2>
    <p><strong>실제 법원 최종 판결:</strong> <span id="actual-verdict" style="color: #ff5252; font-weight: bold;"></span></p>
    <p><strong>양형 적합도 점수:</strong> <span id="score-val" style="color: #4fabff; font-size: 1.4em; font-weight: bold;">0</span> / 100점</p>
    <p id="reason-text" style="font-size: 0.9em; line-height: 1.5; color: #ccc; text-align: left; background: #111; padding: 10px; border-radius: 4px;"></p>
    <button onclick="continueNextCase()" style="padding: 10px 25px; background: #2b4c7e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">다음 사건 심리하기</button>
  </div>
</div>

<script>
  const gameData = [
    {
      caseTitle: "2400원짜리 빵 절도 사건",
      dialogues: [
        { speaker: "사건 개요", text: "피고인은 심야 시간에 문이 잠기지 않은 상점에 침입해 2,400원 상당의 빵 1개를 먹은 혐의로 기소되었습니다.", activeChar: null },
        { speaker: "박검사", text: "존경하는 재판장님! 피고인은 동종 절도 전과가 다수 존재하는 누범 기간 중에 또다시 범행을 저질렀습니다. 법질서를 위해 징역 2년을 구형합니다!", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "재판장님, 피고인이 극심한 굶주림에 못 이겨 저지른 일입니다. 피해 금액이 2,400원에 불과함을 깊이 참작해 주십시오!", activeChar: "defense" },
        { speaker: "판사 (나)", text: "양측 입장을 확인했습니다. 피고인에게 얼마의 징역형을 선고하겠습니까?", activeChar: null }
      ],
      actualMonths: 12,
      actualText: "징역 1년 (실형)",
      reason: "특가법상 상습절도 누범에 해당하여 최저 형량이 정해져 있으나, 피해액이 지극히 적어 법률상 감경을 거쳐 징역 1년이 선고되었습니다."
    },
    {
      caseTitle: "층간소음 항의 음주운전 사건",
      dialogues: [
        { speaker: "사건 개요", text: "피고인은 혈중알코올농도 0.12% 만취 상태로 층간소음에 항의하기 위해 아파트 단지 내 주차장에서 50m를 운전했습니다.", activeChar: null },
        { speaker: "박검사", text: "과거 음주운전 처벌 전력이 있음에도 또다시 운전대를 잡았습니다! 징역 2년 6개월을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "도로가 아닌 단지 내 주차장 이동이었고, 위층의 소음 유발로 이성을 잃은 상태였습니다. 선처를 부탁드립니다!", activeChar: "defense" },
        { speaker: "판사 (나)", text: "피고인에게 선고할 형량을 결정하십시오.", activeChar: null }
      ],
      actualMonths: 18,
      actualText: "징역 1년 6개월 (실형)",
      reason: "단지 내 주차장이라도 위험성이 상당하고 재범인 점을 고려하여 실형이 선고되었습니다."
    },
    {
      caseTitle: "학폭 가해자 찾아간 부모 사건",
      dialogues: [
        { speaker: "사건 개요", text: "피고인은 초등학생 딸이 학교폭력을 당했다는 말을 듣고 가해 학생을 직접 찾아가 폭언 및 위협을 가했습니다.", activeChar: null },
        { speaker: "박검사", text: "성인이 미성년자를 직접 찾아가 위력을 행사한 행위는 엄벌해야 합니다. 징역 6개월을 구형합니다.", activeChar: "prosecutor" },
        { speaker: "김변호사", text: "딸이 학폭을 당해 이성을 잃은 부모의 마음이었습니다. 자력구제 시도였음을 참작해 집행유예 내지 선처를 부탁드립니다.", activeChar: "defense" },
        { speaker: "판사 (나)", text: "양형을 결정해 주문을 선고하십시오.", activeChar: null }
      ],
      actualMonths: 0,
      actualText: "벌금 100만원 (징역 0개월)",
      reason: "부모로서 분노한 참작 사유는 있으나 미성년자 직접 위협은 정당행위로 인정되지 않아 벌금형이 선고되었습니다."
    }
  ];

  let currentCaseIdx = 0;
  let currentDialogueIdx = 0;
  let totalScore = 0;

  function loadCase() {
    currentDialogueIdx = 0;
    document.getElementById('case-num').innerText = currentCaseIdx + 1;
    document.getElementById('verdict-overlay').style.display = 'none';
    document.getElementById('result-modal').style.display = 'none';
    showDialogue();
  }

  function showDialogue() {
    const caseData = gameData[currentCaseIdx];
    const dialogue = caseData.dialogues[currentDialogueIdx];

    document.getElementById('speaker-tag').innerText = dialogue.speaker;
    document.getElementById('dialogue-text').innerText = dialogue.text;

    const pBox = document.getElementById('prosecutor-box');
    const dBox = document.getElementById('defense-box');
    
    pBox.classList.remove('active');
    dBox.classList.remove('active');

    if (dialogue.activeChar === 'prosecutor') pBox.classList.add('active');
    if (dialogue.activeChar === 'defense') dBox.classList.add('active');

    if (currentDialogueIdx === caseData.dialogues.length - 1) {
      document.getElementById('next-btn').innerText = "판결 선고 ▶";
    } else {
      document.getElementById('next-btn').innerText = "다음 ▶";
    }
  }

  function nextDialogue() {
    const caseData = gameData[currentCaseIdx];
    if (currentDialogueIdx < caseData.dialogues.length - 1) {
      currentDialogueIdx++;
      showDialogue();
    } else {
      openVerdictOverlay();
    }
  }

  function openVerdictOverlay() {
    document.getElementById('verdict-overlay').style.display = 'block';
    document.getElementById('sentence-slider').value = 12;
    updateSentenceText(12);
  }

  function updateSentenceText(val) {
    let txt = "";
    if (val == 0) txt = "무죄 / 집행유예 / 벌금형 (0개월)";
    else txt = `징역 ${val}개월 (${Math.floor(val/12)}년 ${val%12}개월)`;
    document.getElementById('sentence-text').innerText = txt;
  }

  function submitVerdict() {
    const userVal = parseInt(document.getElementById('sentence-slider').value);
    const actualVal = gameData[currentCaseIdx].actualMonths;

    const diff = Math.abs(userVal - actualVal);
    let score = Math.max(0, 100 - (diff * 5));
    totalScore += score;

    document.getElementById('actual-verdict').innerText = gameData[currentCaseIdx].actualText;
    document.getElementById('score-val').innerText = score;
    document.getElementById('reason-text').innerText = gameData[currentCaseIdx].reason;

    document.getElementById('verdict-overlay').style.display = 'none';
    document.getElementById('result-modal').style.display = 'block';
  }

  function continueNextCase() {
    currentCaseIdx++;
    if (currentCaseIdx < gameData.length) {
      loadCase();
    } else {
      alert(`모든 재판이 끝났습니다! 당신의 총점: ${totalScore}점`);
      currentCaseIdx = 0;
      totalScore = 0;
      loadCase();
    }
  }

  loadCase();
</script>

</body>
</html>
