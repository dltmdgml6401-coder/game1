<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>구슬 지키기 게임</title>
    <style>
        :root {
            --bg-color: #a8d8ea; /* 연한 하늘색 배경 */
            --grass-color: #8fbc8f; /* 잔디색 */
            --ui-color: #fff;
            --font-family: 'Arial', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #333;
            overflow: hidden;
            font-family: var(--font-family);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 16:9 비율 유지 컨테이너 */
        #game-container {
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-width: 1280px;
            max-height: 720px;
            background-color: var(--grass-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 4px solid #fff;
            border-radius: 10px;
        }

        /* 캔버스 */
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* UI 요소 공통 스타일 */
        .ui-element {
            position: absolute;
            color: var(--ui-color);
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }

        /* 상단 UI (타이머, 목숨) */
        #top-ui {
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }

        #timer {
            display: flex;
            align-items: center;
        }
        #timer-icon {
            margin-right: 5px;
            font-size: 30px;
        }

        #lives {
            display: flex;
            font-size: 30px;
        }
        .heart {
            color: #ff4757;
            margin-left: 5px;
        }
        .heart.lost {
            color: #555;
        }

        /* 화면 중앙 연타 UI (보스전) */
        #mash-ui {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            border: 4px solid #ff4757;
            border-radius: 20px;
            padding: 20px 40px;
            text-align: center;
            display: none; /* 평소에는 숨김 */
            z-index: 10;
            pointer-events: auto; /* 클릭 가능 */
            cursor: pointer;
        }

        #mash-text {
            font-size: 60px;
            color: #ff4757;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #mash-count {
            font-size: 30px;
            color: #fff;
        }

        /* 오버레이 (게임 시작, 종료) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
        }

        .overlay h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .overlay p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .overlay button {
            padding: 15px 40px;
            font-size: 24px;
            background-color: #ffda79;
            color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .overlay button:hover {
            transform: scale(1.05);
        }

        .overlay button:active {
            transform: scale(0.95);
        }

        /* 캐릭터 & 구슬 SVG 소스 (CSS로 로드) */
        #character-sprite, #marble-sprite, #ghost-blue-sprite, #ghost-pink-sprite {
            display: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- 상단 UI -->
        <div id="top-ui" class="ui-element">
            <div id="timer"><span id="timer-icon">⏱️</span><span id="time-display">01:00</span></div>
            <div id="lives">
                <span class="heart">♥️</span><span class="heart">♥️</span><span class="heart">♥️</span>
            </div>
        </div>

        <!-- 연타 UI (보스전) -->
        <div id="mash-ui" onclick="game.handleMashClick()">
            <div id="mash-text">연타!</div>
            <div id="mash-count">0 / 10</div>
        </div>

        <!-- 게임 시작 화면 -->
        <div id="start-screen" class="overlay">
            <h1>구슬을 지켜라! 🟢</h1>
            <p>60초 동안 몰려오는 귀신들을 클릭해서 없애세요.<br>분홍 귀신은 연타해서 처치해야 합니다.</p>
            <button onclick="game.start()">게임 시작</button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <h1 style="color: #ff4757;">게임 오버!</h1>
            <p id="gameover-reason">귀신이 구슬에 3번 닿았습니다.</p>
            <button onclick="game.reset()">다시 시도</button>
        </div>

        <!-- 클리어 화면 -->
        <div id="clear-screen" class="overlay" style="display: none;">
            <h1 style="color: #4cd137;">클리어! 🎉</h1>
            <p>1분 동안 구슬을 무사히 지켜냈습니다!</p>
            <button onclick="game.reset()">다시 하기</button>
        </div>
    </div>

    <!-- SVG 스프라이트 정의 -->
    <svg id="character-sprite" width="100" height="100" viewBox="0 0 100 100">
        <!-- 제공해주신 외계인 캐릭터와 유사하게 직접 그림 -->
        <ellipse cx="50" cy="55" rx="35" ry="30" fill="#a4e1a4" stroke="#000" stroke-width="2"/>
        <path d="M50 25 C 50 10, 40 5, 30 10 C 20 15, 30 25, 50 25 Z" fill="#a4e1a4" stroke="#000" stroke-width="2"/>
        <path d="M50 25 C 50 10, 60 5, 70 10 C 80 15, 70 25, 50 25 Z" fill="#a4e1a4" stroke="#000" stroke-width="2"/>
        <ellipse cx="40" cy="50" rx="6" ry="10" fill="#000"/>
        <ellipse cx="38" cy="48" rx="2" ry="4" fill="#fff"/>
        <ellipse cx="60" cy="50" rx="6" ry="10" fill="#000"/>
        <ellipse cx="58" cy="48" rx="2" ry="4" fill="#fff"/>
        <ellipse cx="35" cy="65" rx="5" ry="2" fill="#ffb6c1" opacity="0.6"/>
        <ellipse cx="65" cy="65" rx="5" ry="2" fill="#ffb6c1" opacity="0.6"/>
        <rect x="45" y="68" width="10" height="2" fill="#000" rx="1"/>
        <ellipse cx="50" cy="90" rx="15" ry="10" fill="#a4e1a4" stroke="#000" stroke-width="1.5"/>
        <ellipse cx="50" cy="90" rx="6" ry="4" fill="#fff" opacity="0.7"/>
    </svg>

    <svg id="marble-sprite" width="60" height="60" viewBox="0 0 60 60">
        <!-- 빛나는 노란 구슬 -->
        <defs>
            <radialGradient id="marble-grad" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#fff"/>
                <stop offset="50%" stop-color="#ffda79"/>
                <stop offset="100%" stop-color="#ccae62"/>
            </radialGradient>
            <filter id="glow">
                <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>
        <circle cx="30" cy="30" r="25" fill="url(#marble-grad)" filter="url(#glow)"/>
    </svg>

    <svg id="ghost-blue-sprite" width="40" height="40" viewBox="0 0 40 40">
        <!-- 파란 귀신 -->
        <path d="M20 5 C 10 5, 5 15, 5 25 L 5 35 L 10 32 L 15 35 L 20 32 L 25 35 L 30 32 L 35 35 L 35 25 C 35 15, 30 5, 20 5 Z" fill="#a8d8ea" stroke="#000" stroke-width="1.5"/>
        <circle cx="15" cy="18" r="3" fill="#000"/>
        <circle cx="25" cy="18" r="3" fill="#000"/>
        <rect x="18" y="25" width="4" height="2" fill="#000" rx="1"/>
    </svg>

    <svg id="ghost-pink-sprite" width="50" height="50" viewBox="0 0 50 50">
        <!-- 분홍 귀신 (보스) -->
        <defs>
            <filter id="angry-glow">
                <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>
        <path d="M25 5 C 12.5 5, 5 17.5, 5 30 L 5 42 L 11 38 L 17 42 L 25 38 L 33 42 L 39 38 L 45 42 L 45 30 C 45 17.5, 37.5 5, 25 5 Z" fill="#ffb6c1" stroke="#000" stroke-width="2" filter="url(#angry-glow)"/>
        <path d="M12 15 L 18 21" stroke="#000" stroke-width="2" stroke-linecap="round"/>
        <path d="M18 15 L 12 21" stroke="#000" stroke-width="2" stroke-linecap="round"/>
        <path d="M32 15 L 38 21" stroke="#000" stroke-width="2" stroke-linecap="round"/>
        <path d="M38 15 L 32 21" stroke="#000" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="25" cy="28" rx="5" ry="3" fill="#000"/>
    </svg>

    <script>
        /* --- 오디오 시스템 (Web Audio API 사용) --- */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // 소리 생성기 함수
        function createSound(freq, type, wave, duration, vol) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (type === 'slide') osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            osc.type = wave;
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => createSound(600, 'fix', 'sine', 0.1, 0.3),
            explosion: () => createSound(100, 'fix', 'sawtooth', 0.2, 0.5),
            mash: () => createSound(800, 'fix', 'triangle', 0.05, 0.2),
            damage: () => createSound(150, 'fix', 'square', 0.3, 0.4),
            bossAppear: () => createSound(2000, 'slide', 'sawtooth', 0.5, 0.3),
            win: () => {
                createSound(500, 'fix', 'sine', 0.2, 0.3);
                setTimeout(() => createSound(700, 'fix', 'sine', 0.2, 0.3), 150);
                setTimeout(() => createSound(900, 'fix', 'sine', 0.4, 0.3), 300);
            },
            lose: () => createSound(100, 'slide', 'square', 0.8, 0.4)
        };

        // 간단한 배경음악 (BGM)
        let bgmOsc = null;
        let bgmGain = null;
        function playBgm() {
            if (bgmOsc) return;
            bgmOsc = audioCtx.createOscillator();
            bgmGain = audioCtx.createGain();
            bgmOsc.type = 'triangle';
            bgmOsc.frequency.setValueAtTime(130.81, audioCtx.currentTime); // C3
            // 간단한 멜로디 루프
            const notes = [130.81, 146.83, 164.81, 196.00];
            let noteIdx = 0;
            const loop = () => {
                if (!bgmOsc) return;
                bgmOsc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
                noteIdx = (noteIdx + 1) % notes.length;
                setTimeout(loop, 400);
            };
            bgmGain.gain.setValueAtTime(0.05, audioCtx.currentTime); // 아주 작게
            bgmOsc.connect(bgmGain);
            bgmGain.connect(audioCtx.destination);
            bgmOsc.start();
            loop();
        }
        function stopBgm() {
            if (bgmOsc) {
                bgmOsc.stop();
                bgmOsc = null;
            }
        }


        /* --- 유틸리티 --- */
        const toDataUrl = (svgId) => {
            const svg = document.getElementById(svgId);
            const xml = new XMLSerializer().serializeToString(svg);
            const svg64 = btoa(xml);
            return 'data:image/svg+xml;base64,' + svg64;
        };

        const randomRange = (min, max) => Math.random() * (max - min) + min;

        /* --- 게임 오브젝트 클래스 --- */

        // 파티클 (귀신 터지는 효과)
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = randomRange(2, 5);
                this.speedX = randomRange(-3, 3);
                this.speedY = randomRange(-3, 3);
                this.color = color;
                this.life = 30; // 프레임 단위 수명
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.size *= 0.95; // 점차 작아짐
                this.life--;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life / 30; // 점차 투명해짐
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // 귀신 (적)
        class Ghost {
            constructor(width, height, type = 'blue') {
                this.type = type;
                this.sprite = new Image();
                
                if (type === 'blue') {
                    this.sprite.src = game.assets.ghostBlue;
                    this.size = 30;
                    this.speed = randomRange(0.5, 1.2);
                    this.hp = 1;
                } else { // pink (boss)
                    this.sprite.src = game.assets.ghostPink;
                    this.size = 50;
                    this.speed = 0.4; // 아주 천천히 접근
                    this.hp = 10;
                }

                // 화면 밖 사방에서 스폰
                const edge = Math.floor(Math.random() * 4); // 0:상, 1:우, 2:하, 3:좌
                const offset = 50;
                if (edge === 0) { this.x = Math.random() * width; this.y = -offset; }
                else if (edge === 1) { this.x = width + offset; this.y = Math.random() * height; }
                else if (edge === 2) { this.x = Math.random() * width; this.y = height + offset; }
                else { this.x = -offset; this.y = Math.random() * height; }

                this.dead = false;
            }

            update(targetX, targetY) {
                if (this.dead) return;
                // 중앙 구슬을 향해 이동
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }

            draw(ctx) {
                if (this.dead) return;
                // 둥실거리는 움직임 추가 (Sine wave)
                const floatOffset = Math.sin(Date.now() * 0.005 + this.x) * 2;
                ctx.drawImage(this.sprite, this.x - this.size/2, this.y - this.size/2 + floatOffset, this.size, this.size);
            }

            isHit(mx, my) {
                // 클릭 충돌 감지 (원형)
                const dist = Math.hypot(mx - this.x, my - this.y);
                return dist < this.size / 2;
            }
        }

        /* --- 주요 게임 로직 --- */
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                // 16:9 내부 해상도 고정
                this.internalW = 1280;
                this.internalH = 720;
                this.canvas.width = this.internalW;
                this.canvas.height = this.internalH;

                // 애셋 로딩
                this.assets = {
                    character: toDataUrl('character-sprite'),
                    marble: toDataUrl('marble-sprite'),
                    ghostBlue: toDataUrl('ghost-blue-sprite'),
                    ghostPink: toDataUrl('ghost-pink-sprite')
                };
                this.charImg = new Image(); this.charImg.src = this.assets.character;
                this.marbleImg = new Image(); this.marbleImg.src = this.assets.marble;

                // UI 요소
                this.ui = {
                    container: document.getElementById('game-container'),
                    timeDisplay: document.getElementById('time-display'),
                    lives: document.getElementById('lives').getElementsByClassName('heart'),
                    mash: document.getElementById('mash-ui'),
                    mashCount: document.getElementById('mash-count'),
                    start: document.getElementById('start-screen'),
                    gameover: document.getElementById('gameover-screen'),
                    clear: document.getElementById('clear-screen')
                };

                // 초기 상태
                this.reset();

                // 이벤트 리스너 (마우스 클릭)
                this.canvas.addEventListener('mousedown', (e) => this.handleClick(e));
                
                // 루프 시작
                this.loop();
            }

            reset() {
                this.isRunning = false;
                this.isBossPhase = false;
                this.lives = 3;
                this.gameTime = 60; // 1분
                this.timeLeft = this.gameTime;
                this.startTime = 0;
                
                this.ghosts = [];
                this.particles = [];
                
                this.spawnRate = 2000; // 초기 스폰 간격 (ms)
                this.lastSpawnTime = 0;
                this.bossActive = false;
                this.currentBoss = null;

                this.shakeAmount = 0; // 화면 흔들림 효과

                // UI 초기화
                this.updateUi();
                this.ui.mash.style.display = 'none';
                this.ui.start.style.display = 'flex';
                this.ui.gameover.style.display = 'none';
                this.ui.clear.style.display = 'none';
                
                stopBgm();
            }

            start() {
                this.isRunning = true;
                this.startTime = Date.now();
                this.lastSpawnTime = Date.now();
                this.ui.start.style.display = 'none';
                playBgm();
                audioCtx.resume();
            }

            gameOver() {
                this.isRunning = false;
                this.ui.gameover.style.display = 'flex';
                sounds.lose();
                stopBgm();
            }

            gameClear() {
                this.isRunning = false;
                this.ui.clear.style.display = 'flex';
                sounds.win();
                stopBgm();
            }

            updateUi() {
                // 타이머 업데이트
                const min = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
                const sec = Math.floor(this.timeLeft % 60).toString().padStart(2, '0');
                this.ui.timeDisplay.innerText = `${min}:${sec}`;

                // 목숨(하트) 업데이트
                for (let i = 0; i < 3; i++) {
                    if (i < this.lives) this.ui.lives[i].classList.remove('lost');
                    else this.ui.lives[i].classList.add('lost');
                }
            }

            // 실제 캔버스 좌표를 내부 16:9 좌표로 변환
            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.internalW / rect.width;
                const scaleY = this.internalH / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            handleClick(e) {
                if (!this.isRunning || this.isBossPhase) return;
                sounds.click();
                const pos = this.getMousePos(e);
                
                // 역순으로 검사 (가장 위에 있는 귀신부터)
                for (let i = this.ghosts.length - 1; i >= 0; i--) {
                    const ghost = this.ghosts[i];
                    if (!ghost.dead && ghost.isHit(pos.x, pos.y)) {
                        if (ghost.type === 'blue') {
                            this.killGhost(ghost, i);
                        } else {
                            // 분홍 귀신 클릭 시 보스 페이즈 전환
                            this.startBossPhase(ghost);
                        }
                        break; // 한 번 클릭에 한 마리만
                    }
                }
            }

            killGhost(ghost, index) {
                ghost.dead = true;
                this.ghosts.splice(index, 1);
                sounds.explosion();
                // 파티클 효과 생성
                const color = ghost.type === 'blue' ? '#a8d8ea' : '#ffb6c1';
                for (let i = 0; i < 8; i++) {
                    this.particles.push(new Particle(ghost.x, ghost.y, color));
                }
            }

            startBossPhase(ghost) {
                this.isBossPhase = true;
                this.currentBoss = ghost;
                this.currentBoss.hp = 10;
                
                // UI 업데이트
                this.ui.mash.style.display = 'block';
                this.ui.mashCount.innerText = `0 / 10`;
                
                // 사운드 & 화면 효과
                sounds.bossAppear();
                this.shakeAmount = 15;
            }

            handleMashClick() {
                if (!this.isRunning || !this.isBossPhase) return;
                sounds.mash();
                this.currentBoss.hp--;
                const hits = 10 - this.currentBoss.hp;
                this.ui.mashCount.innerText = `${hits} / 10`;
                
                // 타격 효과 (화면 살짝 흔들림)
                this.shakeAmount = 5;

                if (this.currentBoss.hp <= 0) {
                    this.endBossPhase(true);
                }
            }

            endBossPhase(success) {
                this.isBossPhase = false;
                this.ui.mash.style.display = 'none';
                
                if (success) {
                    // 보스 처치
                    const idx = this.ghosts.indexOf(this.currentBoss);
                    this.killGhost(this.currentBoss, idx);
                }
                this.currentBoss = null;
            }

            // 게임 메인 루프
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }

            update() {
                if (!this.isRunning) return;

                // 타이머 계산
                const now = Date.now();
                const elapsed = (now - this.startTime) / 1000;
                this.timeLeft = this.gameTime - elapsed;

                // 난이도 상승 (시간이 갈수록 스폰속도 빨라짐)
                // 60초->2초간격, 0초->0.3초간격까지
                this.spawnRate = 2000 - (elapsed / 60) * 1700; 

                if (this.timeLeft <= 0) {
                    this.timeLeft = 0;
                    this.updateUi();
                    this.gameClear();
                    return;
                }
                this.updateUi();

                // 일반 페이즈일 때만 귀신 스폰 및 이동
                if (!this.isBossPhase) {
                    // 귀신 스폰
                    if (now - this.lastSpawnTime > this.spawnRate) {
                        // 10% 확률로 분홍 귀신(보스) 스폰
                        const type = Math.random() < 0.1 ? 'pink' : 'blue';
                        this.ghosts.push(new Ghost(this.internalW, this.internalH, type));
                        this.lastSpawnTime = now;
                    }

                    // 귀신 업데이트 및 구슬 충돌 체크
                    const cx = this.internalW / 2;
                    const cy = this.internalH / 2;
                    for (let i = this.ghosts.length - 1; i >= 0; i--) {
                        const ghost = this.ghosts[i];
                        ghost.update(cx, cy);

                        // 구슬(중앙) 도달 체크
                        const dist = Math.hypot(ghost.x - cx, ghost.y - cy);
                        if (dist < 40) { // 구슬 반경 근처
                            this.lives--;
                            sounds.damage();
                            this.shakeAmount = 20; // 강력한 흔들림
                            this.ghosts.splice(i, 1); // 귀신 사라짐
                            
                            if (this.lives <= 0) {
                                this.updateUi();
                                this.gameOver();
                                return;
                            }
                        }
                    }
                }

                // 파티클 업데이트
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    if (this.particles[i].life <= 0) this.particles.splice(i, 1);
                }

                // 화면 흔들림 감소
                if (this.shakeAmount > 0) this.shakeAmount *= 0.9;
            }

            draw() {
                this.ctx.save();
                
                // 화면 흔들림 적용
                if (this.shakeAmount > 0.5) {
                    this.ctx.translate(randomRange(-this.shakeAmount, this.shakeAmount), randomRange(-this.shakeAmount, this.shakeAmount));
                }

                // 배경 그리기
                this.ctx.fillStyle = '#8fbc8f'; // 기본 잔디색
                this.ctx.fillRect(0, 0, this.internalW, this.internalH);
                
                // 간단한 풀밭 패턴 그리기
                this.ctx.fillStyle = 'rgba(0,0,0,0.05)';
                for(let i=0; i<50; i++) {
                    const px = (i * 797) % this.internalW;
                    const py = (i * 967) % this.internalH;
                    this.ctx.fillRect(px, py, 10, 10);
                }

                const cx = this.internalW / 2;
                const cy = this.internalH / 2;

                // 캐릭터 & 구슬 그리기
                this.ctx.drawImage(this.charImg, cx - 50, cy - 65, 100, 100);
                // 구슬 빛나는 연출 (박동)
                const pulse = Math.sin(Date.now() * 0.01) * 5;
                this.ctx.drawImage(this.marbleImg, cx - 30 - pulse/2, cy - 10 - pulse/2, 60 + pulse, 60 + pulse);

                // 귀신 그리기
                this.ghosts.forEach(ghost => ghost.draw(this.ctx));

                // 파티클 그리기
                this.particles.forEach(p => p.draw(this.ctx));

                // 보스 페이즈 오버레이 (분홍빛)
                if (this.isBossPhase) {
                    this.ctx.fillStyle = 'rgba(255, 182, 193, 0.3)';
                    this.ctx.fillRect(0, 0, this.internalW, this.internalH);
                    
                    // 중앙에 거대 보스 그리기
                    if (this.currentBoss) {
                        const bSize = 300;
                        this.ctx.drawImage(this.currentBoss.sprite, cx - bSize/2, cy - bSize/2 - 50, bSize, bSize);
                    }
                }

                this.ctx.restore();
            }
        }

        // 게임 인스턴스 생성
        const game = new Game();

    </script>
