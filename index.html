<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>구슬 지키기 게임</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --bg-color: #a8d8ea; 
            --grass-color: #92d050; /* 조금 더 밝고 귀여운 잔디색 */
            --ui-bg: #fff8e7; /* 크림색 UI 배경 */
            --ui-border: #d7ccc8;
            --text-color: #5d4037; /* 부드러운 갈색 텍스트 */
            --font-family: 'Jua', 'Comic Sans MS', '맑은 고딕', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f2f6; /* 바깥 배경도 부드럽게 */
            overflow: hidden;
            font-family: var(--font-family);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 16:9 비율 유지 컨테이너 */
        #game-container {
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-width: 1280px;
            max-height: 720px;
            background-color: var(--grass-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border: 8px solid #fff;
            border-radius: 24px;
        }

        /* 캔버스 */
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        /* 상단 UI (타이머, 목숨) */
        #top-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .cute-badge {
            background-color: var(--ui-bg);
            border: 4px solid var(--ui-border);
            border-radius: 30px;
            padding: 10px 25px;
            color: var(--text-color);
            font-size: 26px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        #timer-icon {
            margin-right: 8px;
            font-size: 28px;
        }

        .heart {
            color: #ff6b81;
            margin-left: 6px;
            text-shadow: 1px 1px 0 #d93d59;
        }
        .heart.lost {
            color: #dfe4ea;
            text-shadow: none;
        }

        /* 화면 중앙 연타 UI (보스전) */
        #mash-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ff6b81;
            border: 6px solid #fff;
            border-radius: 40px;
            padding: 30px 60px;
            text-align: center;
            display: none; 
            z-index: 10;
            pointer-events: auto; 
            cursor: pointer;
            box-shadow: 0 10px 0 #d93d59, 0 15px 20px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #mash-text {
            font-size: 70px;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 3px 3px 0 #d93d59;
            letter-spacing: 2px;
        }

        #mash-count {
            background-color: #2f3542;
            color: #fff;
            font-size: 35px;
            padding: 5px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        /* 오버레이 팝업 (게임 시작, 종료) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .popup-box {
            background-color: var(--ui-bg);
            border: 6px solid var(--ui-border);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
            max-width: 600px;
        }

        .popup-box h1 {
            font-size: 55px;
            color: var(--text-color);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .popup-box p {
            font-size: 24px;
            color: #747d8c;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .cute-button {
            padding: 15px 50px;
            font-size: 30px;
            font-family: var(--font-family);
            background-color: #a4e1a4;
            color: #fff;
            border: 4px solid #fff;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #7cb37c, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.1s;
        }

        .cute-button:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #7cb37c, 0 8px 10px rgba(0,0,0,0.1);
        }

        .cute-button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #7cb37c;
        }

        /* 캐릭터 & 구슬 SVG 소스 (CSS로 로드) */
        #character-sprite, #marble-sprite, #ghost-blue-sprite, #ghost-pink-sprite {
            display: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- 상단 UI -->
        <div id="top-ui">
            <div id="timer" class="cute-badge">
                <span id="timer-icon">⏱️</span><span id="time-display">01:00</span>
            </div>
            <div id="lives" class="cute-badge">
                <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
            </div>
        </div>

        <!-- 연타 UI (보스전) -->
        <div id="mash-ui" onclick="window.game.handleMashClick()">
            <div id="mash-text">연타!</div>
            <div id="mash-count">0 / 10</div>
        </div>

        <!-- 게임 시작 화면 -->
        <div id="start-screen" class="overlay">
            <div class="popup-box">
                <h1>구슬을 지켜라! 🟢</h1>
                <p>60초 동안 몰려오는 귀신들을<br>클릭해서 없애주세요!<br>분홍 귀신은 10번 연타해야 해요!</p>
                <button class="cute-button" onclick="window.game.start()">게임 시작</button>
            </div>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <div class="popup-box">
                <h1 style="color: #ff6b81;">게임 오버 💦</h1>
                <p id="gameover-reason">귀신이 구슬에 3번 닿았어요!</p>
                <button class="cute-button" onclick="window.game.reset()">다시 시도</button>
            </div>
        </div>

        <!-- 클리어 화면 -->
        <div id="clear-screen" class="overlay" style="display: none;">
            <div class="popup-box">
                <h1 style="color: #ff9f43;">클리어! 🎉</h1>
                <p>1분 동안 구슬을 무사히 지켜냈어요!<br>정말 대단해요!</p>
                <button class="cute-button" onclick="window.game.reset()">다시 하기</button>
            </div>
        </div>
    </div>

    <!-- SVG 스프라이트 정의 (이전과 동일하게 유지) -->
    <svg id="character-sprite" width="100" height="100" viewBox="0 0 100 100">
        <ellipse cx="50" cy="55" rx="35" ry="30" fill="#a4e1a4" stroke="#5d4037" stroke-width="3"/>
        <path d="M50 25 C 50 10, 40 5, 30 10 C 20 15, 30 25, 50 25 Z" fill="#a4e1a4" stroke="#5d4037" stroke-width="3"/>
        <path d="M50 25 C 50 10, 60 5, 70 10 C 80 15, 70 25, 50 25 Z" fill="#a4e1a4" stroke="#5d4037" stroke-width="3"/>
        <ellipse cx="40" cy="50" rx="8" ry="12" fill="#2d3436"/>
        <ellipse cx="38" cy="46" rx="3" ry="5" fill="#fff"/>
        <ellipse cx="60" cy="50" rx="8" ry="12" fill="#2d3436"/>
        <ellipse cx="58" cy="46" rx="3" ry="5" fill="#fff"/>
        <ellipse cx="33" cy="65" rx="6" ry="3" fill="#ffb8b8" opacity="0.8"/>
        <ellipse cx="67" cy="65" rx="6" ry="3" fill="#ffb8b8" opacity="0.8"/>
        <rect x="46" y="68" width="8" height="3" fill="#2d3436" rx="1.5"/>
        <ellipse cx="50" cy="90" rx="15" ry="10" fill="#a4e1a4" stroke="#5d4037" stroke-width="2"/>
        <ellipse cx="50" cy="90" rx="7" ry="5" fill="#fcf3ca" opacity="0.9"/>
    </svg>

    <svg id="marble-sprite" width="60" height="60" viewBox="0 0 60 60">
        <defs>
            <radialGradient id="marble-grad" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#fff"/>
                <stop offset="50%" stop-color="#feca57"/>
                <stop offset="100%" stop-color="#ff9f43"/>
            </radialGradient>
            <filter id="glow">
                <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>
        <circle cx="30" cy="30" r="25" fill="url(#marble-grad)" filter="url(#glow)"/>
    </svg>

    <svg id="ghost-blue-sprite" width="45" height="45" viewBox="0 0 45 45">
        <path d="M22.5 5 C 10 5, 5 17, 5 28 L 5 40 L 10 36 L 15 40 L 22.5 36 L 30 40 L 35 36 L 40 40 L 40 28 C 40 17, 35 5, 22.5 5 Z" fill="#c7ecee" stroke="#2d3436" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="16" cy="22" r="3.5" fill="#2d3436"/>
        <circle cx="29" cy="22" r="3.5" fill="#2d3436"/>
        <path d="M20 28 Q 22.5 30 25 28" fill="none" stroke="#2d3436" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="12" cy="28" rx="3" ry="1.5" fill="#ffb8b8" opacity="0.6"/>
        <ellipse cx="33" cy="28" rx="3" ry="1.5" fill="#ffb8b8" opacity="0.6"/>
    </svg>

    <svg id="ghost-pink-sprite" width="55" height="55" viewBox="0 0 55 55">
        <defs>
            <filter id="angry-glow">
                <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
        </defs>
        <path d="M27.5 5 C 12 5, 5 18, 5 32 L 5 48 L 12 43 L 19 48 L 27.5 43 L 36 48 L 43 43 L 50 48 L 50 32 C 50 18, 43 5, 27.5 5 Z" fill="#ff9ff3" stroke="#2d3436" stroke-width="3" stroke-linejoin="round" filter="url(#angry-glow)"/>
        <path d="M14 18 L 22 24" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 18 L 14 24" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
        <path d="M33 18 L 41 24" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
        <path d="M41 18 L 33 24" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
        <path d="M23 33 Q 27.5 28 32 33 L 30 38 L 25 38 Z" fill="#2d3436"/>
    </svg>

    <script>
        // 오디오 시스템
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function createSound(freq, type, wave, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (type === 'slide') osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            osc.type = wave;
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => createSound(700, 'fix', 'sine', 0.1, 0.2),
            explosion: () => createSound(150, 'fix', 'sawtooth', 0.2, 0.4),
            mash: () => createSound(900, 'fix', 'triangle', 0.05, 0.2),
            damage: () => createSound(120, 'fix', 'square', 0.4, 0.4),
            bossAppear: () => createSound(1500, 'slide', 'sawtooth', 0.5, 0.3),
            win: () => {
                createSound(523.25, 'fix', 'sine', 0.2, 0.3); // C5
                setTimeout(() => createSound(659.25, 'fix', 'sine', 0.2, 0.3), 150); // E5
                setTimeout(() => createSound(783.99, 'fix', 'sine', 0.4, 0.3), 300); // G5
            },
            lose: () => createSound(100, 'slide', 'square', 1.0, 0.4)
        };

        let bgmOsc = null;
        let bgmGain = null;
        function playBgm() {
            if (!audioCtx || bgmOsc) return;
            bgmOsc = audioCtx.createOscillator();
            bgmGain = audioCtx.createGain();
            bgmOsc.type = 'triangle';
            bgmOsc.frequency.setValueAtTime(130.81, audioCtx.currentTime);
            const notes = [130.81, 146.83, 164.81, 196.00];
            let noteIdx = 0;
            const loop = () => {
                if (!bgmOsc || !audioCtx) return;
                bgmOsc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
                noteIdx = (noteIdx + 1) % notes.length;
                setTimeout(loop, 400);
            };
            bgmGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            bgmOsc.connect(bgmGain);
            bgmGain.connect(audioCtx.destination);
            bgmOsc.start();
            loop();
        }
        function stopBgm() {
            if (bgmOsc) {
                bgmOsc.stop();
                bgmOsc = null;
            }
        }

        const toDataUrl = (svgId) => {
            const svg = document.getElementById(svgId);
            const xml = new XMLSerializer().serializeToString(svg);
            const svg64 = btoa(xml);
            return 'data:image/svg+xml;base64,' + svg64;
        };
        const randomRange = (min, max) => Math.random() * (max - min) + min;

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.size = randomRange(3, 8);
                this.speedX = randomRange(-4, 4);
                this.speedY = randomRange(-4, 4);
                this.color = color;
                this.life = 30;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.size *= 0.93;
                this.life--;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life / 30;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Ghost {
            constructor(width, height, type = 'blue') {
                this.type = type;
                this.sprite = new Image();
                if (type === 'blue') {
                    this.sprite.src = window.game.assets.ghostBlue;
                    this.size = 40;
                    this.speed = randomRange(0.6, 1.4);
                    this.hp = 1;
                } else {
                    this.sprite.src = window.game.assets.ghostPink;
                    this.size = 65;
                    this.speed = 0.5;
                    this.hp = 10;
                }
                const edge = Math.floor(Math.random() * 4);
                const offset = 60;
                if (edge === 0) { this.x = Math.random() * width; this.y = -offset; }
                else if (edge === 1) { this.x = width + offset; this.y = Math.random() * height; }
                else if (edge === 2) { this.x = Math.random() * width; this.y = height + offset; }
                else { this.x = -offset; this.y = Math.random() * height; }
                this.dead = false;
            }
            update(targetX, targetY) {
                if (this.dead) return;
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }
            draw(ctx) {
                if (this.dead) return;
                const floatOffset = Math.sin(Date.now() * 0.005 + this.x) * 3;
                ctx.drawImage(this.sprite, this.x - this.size/2, this.y - this.size/2 + floatOffset, this.size, this.size);
            }
            isHit(mx, my) {
                const dist = Math.hypot(mx - this.x, my - this.y);
                return dist < this.size / 1.5; // 터치 판정 조금 더 넓게
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.internalW = 1280;
                this.internalH = 720;
                this.canvas.width = this.internalW;
                this.canvas.height = this.internalH;

                this.assets = {
                    character: toDataUrl('character-sprite'),
                    marble: toDataUrl('marble-sprite'),
                    ghostBlue: toDataUrl('ghost-blue-sprite'),
                    ghostPink: toDataUrl('ghost-pink-sprite')
                };
                this.charImg = new Image(); this.charImg.src = this.assets.character;
                this.marbleImg = new Image(); this.marbleImg.src = this.assets.marble;

                this.ui = {
                    timeDisplay: document.getElementById('time-display'),
                    lives: document.getElementById('lives').getElementsByClassName('heart'),
                    mash: document.getElementById('mash-ui'),
                    mashCount: document.getElementById('mash-count'),
                    start: document.getElementById('start-screen'),
                    gameover: document.getElementById('gameover-screen'),
                    clear: document.getElementById('clear-screen')
                };

                this.canvas.addEventListener('mousedown', (e) => this.handleClick(e));
                
                // 모바일 터치 지원 추가
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        this.handleClick(e.changedTouches[i]);
                    }
                }, {passive: false});

                this.reset();
                requestAnimationFrame(() => this.loop());
            }

            reset() {
                this.isRunning = false;
                this.isBossPhase = false;
                this.lives = 3;
                this.gameTime = 60;
                this.timeLeft = this.gameTime;
                this.ghosts = [];
                this.particles = [];
                this.spawnRate = 2000;
                this.shakeAmount = 0;
                
                this.updateUi();
                this.ui.mash.style.display = 'none';
                this.ui.start.style.display = 'flex';
                this.ui.gameover.style.display = 'none';
                this.ui.clear.style.display = 'none';
                stopBgm();
            }

            start() {
                initAudio(); // 버튼 클릭 시 오디오 초기화
                this.isRunning = true;
                this.startTime = Date.now();
                this.lastSpawnTime = Date.now();
                this.ui.start.style.display = 'none';
                this.ui.gameover.style.display = 'none';
                this.ui.clear.style.display = 'none';
                playBgm();
            }

            gameOver() {
                this.isRunning = false;
                this.ui.gameover.style.display = 'flex';
                sounds.lose();
                stopBgm();
            }

            gameClear() {
                this.isRunning = false;
                this.ui.clear.style.display = 'flex';
                sounds.win();
                stopBgm();
            }

            updateUi() {
                const min = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
                const sec = Math.floor(this.timeLeft % 60).toString().padStart(2, '0');
                this.ui.timeDisplay.innerText = `${min}:${sec}`;
                for (let i = 0; i < 3; i++) {
                    if (i < this.lives) this.ui.lives[i].classList.remove('lost');
                    else this.ui.lives[i].classList.add('lost');
                }
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.internalW / rect.width;
                const scaleY = this.internalH / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            handleClick(e) {
                if (!this.isRunning || this.isBossPhase) return;
                initAudio();
                const pos = this.getMousePos(e);
                let hitAny = false;
                for (let i = this.ghosts.length - 1; i >= 0; i--) {
                    const ghost = this.ghosts[i];
                    if (!ghost.dead && ghost.isHit(pos.x, pos.y)) {
                        hitAny = true;
                        if (ghost.type === 'blue') {
                            this.killGhost(ghost, i);
                        } else {
                            this.startBossPhase(ghost);
                        }
                        break;
                    }
                }
                if(hitAny) sounds.click();
            }

            killGhost(ghost, index) {
                ghost.dead = true;
                this.ghosts.splice(index, 1);
                sounds.explosion();
                const color = ghost.type === 'blue' ? '#c7ecee' : '#ff9ff3';
                for (let i = 0; i < 12; i++) {
                    this.particles.push(new Particle(ghost.x, ghost.y, color));
                }
            }

            startBossPhase(ghost) {
                this.isBossPhase = true;
                this.currentBoss = ghost;
                this.currentBoss.hp = 10;
                this.ui.mash.style.display = 'block';
                this.ui.mashCount.innerText = `0 / 10`;
                sounds.bossAppear();
                this.shakeAmount = 15;
            }

            handleMashClick() {
                if (!this.isRunning || !this.isBossPhase) return;
                sounds.mash();
                this.currentBoss.hp--;
                const hits = 10 - this.currentBoss.hp;
                this.ui.mashCount.innerText = `${hits} / 10`;
                this.shakeAmount = 5;

                // 보스 타격 시 파티클 조금 생성
                this.particles.push(new Particle(this.internalW/2 + randomRange(-50,50), this.internalH/2 + randomRange(-50,50), '#ff9ff3'));

                if (this.currentBoss.hp <= 0) {
                    this.endBossPhase(true);
                }
            }

            endBossPhase(success) {
                this.isBossPhase = false;
                this.ui.mash.style.display = 'none';
                if (success) {
                    const idx = this.ghosts.indexOf(this.currentBoss);
                    if(idx > -1) this.killGhost(this.currentBoss, idx);
                }
                this.currentBoss = null;
            }

            update() {
                if (!this.isRunning) return;
                const now = Date.now();
                const elapsed = (now - this.startTime) / 1000;
                this.timeLeft = this.gameTime - elapsed;
                
                // 후반부로 갈수록 스폰 속도 빨라짐 (최소 0.4초)
                this.spawnRate = Math.max(400, 2000 - (elapsed / 60) * 1600); 

                if (this.timeLeft <= 0) {
                    this.timeLeft = 0;
                    this.updateUi();
                    this.gameClear();
                    return;
                }
                this.updateUi();

                if (!this.isBossPhase) {
                    if (now - this.lastSpawnTime > this.spawnRate) {
                        const type = Math.random() < 0.12 ? 'pink' : 'blue';
                        this.ghosts.push(new Ghost(this.internalW, this.internalH, type));
                        this.lastSpawnTime = now;
                    }

                    const cx = this.internalW / 2;
                    const cy = this.internalH / 2;
                    for (let i = this.ghosts.length - 1; i >= 0; i--) {
                        const ghost = this.ghosts[i];
                        ghost.update(cx, cy);
                        const dist = Math.hypot(ghost.x - cx, ghost.y - cy);
                        if (dist < 45) { // 구슬 반경
                            this.lives--;
                            sounds.damage();
                            this.shakeAmount = 25; 
                            this.ghosts.splice(i, 1); 
                            
                            // 구슬 타격 시 빨간 파티클 튀는 효과
                            for(let p=0; p<15; p++) {
                                this.particles.push(new Particle(cx, cy, '#ff4757'));
                            }

                            if (this.lives <= 0) {
                                this.updateUi();
                                this.gameOver();
                                return;
                            }
                        }
                    }
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    if (this.particles[i].life <= 0) this.particles.splice(i, 1);
                }
                if (this.shakeAmount > 0) this.shakeAmount *= 0.85;
            }

            draw() {
                this.ctx.save();
                if (this.shakeAmount > 0.5) {
                    this.ctx.translate(randomRange(-this.shakeAmount, this.shakeAmount), randomRange(-this.shakeAmount, this.shakeAmount));
                }

                // 잔디 배경
                this.ctx.fillStyle = '#92d050'; 
                this.ctx.fillRect(0, 0, this.internalW, this.internalH);
                
                // 귀여운 풀 패턴
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                for(let i=0; i<60; i++) {
                    const px = (i * 881) % this.internalW;
                    const py = (i * 997) % this.internalH;
                    this.ctx.beginPath();
                    this.ctx.arc(px, py, 4, 0, Math.PI);
                    this.ctx.fill();
                }

                const cx = this.internalW / 2;
                const cy = this.internalH / 2;

                // 중앙 캐릭터와 구슬
                this.ctx.drawImage(this.charImg, cx - 60, cy - 70, 110, 110);
                const pulse = Math.sin(Date.now() * 0.008) * 8;
                this.ctx.drawImage(this.marbleImg, cx - 35 - pulse/2, cy - 10 - pulse/2, 70 + pulse, 70 + pulse);

                // 귀신들 
                this.ghosts.forEach(ghost => ghost.draw(this.ctx));
                // 파티클
                this.particles.forEach(p => p.draw(this.ctx));

                // 보스 페이즈 시 화면 붉어지고 거대 보스 등장
                if (this.isBossPhase) {
                    this.ctx.fillStyle = 'rgba(255, 159, 243, 0.4)';
                    this.ctx.fillRect(0, 0, this.internalW, this.internalH);
                    
                    if (this.currentBoss) {
                        const bSize = 350;
                        const bFloat = Math.sin(Date.now() * 0.01) * 10;
                        this.ctx.drawImage(this.currentBoss.sprite, cx - bSize/2, cy - bSize/2 - 30 + bFloat, bSize, bSize);
                    }
                }

                this.ctx.restore();
            }
            
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        // 전역 객체로 등록하여 HTML 인라인 이벤트에서 접근 가능하게 설정
        window.onload = () => {
            window.game = new Game();
        };

    </script>
</body>
</html>
