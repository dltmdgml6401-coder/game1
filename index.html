<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Poker Roguelike</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#24334d 0,#111827 45%,#070b12 100%);
    color:#fff;
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

#game{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

/* ================= HEADER ================= */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    gap:15px;
    flex-wrap:wrap;
}

.title{
    font-size:28px;
    font-weight:900;
}

.stage{
    padding:9px 15px;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    font-weight:bold;
}

.timerBox{
    min-width:180px;
    text-align:center;
}

.timer{
    height:12px;
    background:#202938;
    border-radius:20px;
    overflow:hidden;
    margin-top:7px;
}

.timerBar{
    width:100%;
    height:100%;
    background:#55e6a5;
    transition:width .3s linear;
}

/* ================= TABLE ================= */

.table{
    min-height:670px;
    border-radius:30px;
    padding:25px;
    position:relative;
    background:
        radial-gradient(circle at center,#145b46,#073a2c 55%,#05251d);
    box-shadow:
        inset 0 0 100px rgba(0,0,0,.35),
        0 20px 80px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.08);
}

.enemyArea,
.playerArea{
    min-height:210px;
}

.areaTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.areaTitle strong{
    font-size:17px;
}

.hand{
    min-height:170px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
}

/* ================= CARDS ================= */

.card{
    width:105px;
    height:145px;
    background:#fff;
    color:#111;
    border-radius:12px;
    border:2px solid #ddd;
    position:relative;
    cursor:pointer;
    user-select:none;
    transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease;
    box-shadow:0 7px 15px rgba(0,0,0,.25);
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:
        0 15px 25px rgba(0,0,0,.35);
}

.card.selected{
    transform:translateY(-20px);
    border-color:#ffe66d;
    box-shadow:
        0 0 0 3px rgba(255,230,109,.35),
        0 18px 30px rgba(0,0,0,.4);
}

.card.red{
    color:#d92748;
}

.card.black{
    color:#111;
}

.cardCorner{
    position:absolute;
    top:8px;
    left:9px;
    text-align:center;
    font-size:20px;
    font-weight:900;
    line-height:20px;
}

.cardCenter{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:52px;
}

.cardAug{
    position:absolute;
    right:6px;
    bottom:5px;
    font-size:10px;
    color:#8d6500;
    font-weight:bold;
}

/* ================= CENTER ================= */

.centerArea{
    min-height:160px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:10px;
}

#message{
    min-height:28px;
    font-size:18px;
    font-weight:bold;
    text-align:center;
}

.taunt{
    color:#ffcf66;
    animation:tauntIn .25s ease;
}

@keyframes tauntIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* ================= CONTROLS ================= */

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.btn{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    color:#fff;
    background:#263246;
    transition:.15s;
}

.btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.15);
}

.btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
}

.btn.submit{
    background:#d99a26;
}

.btn.discard{
    background:#a33749;
}

/* ================= SIDE PANEL ================= */

.sidePanel{
    margin-top:20px;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:16px;
}

.sideTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.augments{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.augment{
    position:relative;
    width:180px;
    padding:13px;
    border-radius:13px;
    cursor:pointer;
    border:2px solid;
    background:rgba(0,0,0,.22);
    transition:.15s;
}

.augment:hover{
    transform:translateY(-3px);
}

.augment.used{
    opacity:.48;
    filter:grayscale(.5);
}

.augment.used:hover{
    transform:none;
}

.augmentName{
    font-weight:900;
    margin-bottom:5px;
}

.augmentStatus{
    font-size:12px;
}

.tier-silver{
    border-color:#aeb8c4;
}

.tier-gold{
    border-color:#e8bd42;
}

.tier-platinum{
    border-color:#b78cff;
}

.tooltip{
    position:absolute;
    z-index:20;
    left:0;
    bottom:calc(100% + 8px);
    width:230px;
    padding:12px;
    border-radius:10px;
    background:#101722;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 15px 30px rgba(0,0,0,.45);
    font-size:12px;
    line-height:1.5;
    opacity:0;
    pointer-events:none;
    transform:translateY(5px);
    transition:.15s;
}

.augment:hover .tooltip{
    opacity:1;
    transform:none;
}

/* ================= RESULT ================= */

.result{
    display:none;
    margin-top:18px;
    padding:20px;
    border-radius:18px;
    background:rgba(0,0,0,.35);
}

.result.show{
    display:block;
}

.resultHands{
    display:flex;
    gap:35px;
    justify-content:center;
    flex-wrap:wrap;
}

.resultBox{
    min-width:280px;
    text-align:center;
}

.handLabel{
    font-size:18px;
    font-weight:900;
    margin-bottom:10px;
}

.handCards{
    display:flex;
    justify-content:center;
    gap:6px;
}

.miniCard{
    width:58px;
    height:80px;
    background:#fff;
    color:#111;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-weight:900;
}

.miniCard.red{
    color:#d92748;
}

.rankResult{
    margin-top:10px;
    font-size:20px;
    font-weight:900;
}

/* ================= OVERLAY ================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
}

.modal{
    width:min(600px,92vw);
    padding:25px;
    border-radius:20px;
    background:#111927;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.modal h2{
    margin-top:0;
}

.choiceGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.choiceBtn{
    border:none;
    border-radius:12px;
    padding:14px 8px;
    background:#263246;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    font-weight:900;
}

.choiceBtn:hover{
    background:#3a4a64;
}

.choiceBtn.red{
    color:#ff657d;
}

.choiceBtn.black{
    color:#fff;
}

.cancelBtn{
    width:100%;
    margin-top:15px;
}

/* ================= PARTICLES ================= */

.flash{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:90;
    animation:flash .45s ease forwards;
}

@keyframes flash{
    0%{
        background:rgba(255,255,255,.5);
    }
    100%{
        background:rgba(255,255,255,0);
    }
}

.bigText{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:95;
    font-size:60px;
    font-weight:1000;
    pointer-events:none;
    animation:bigText .8s ease forwards;
    text-shadow:0 8px 25px rgba(0,0,0,.6);
}

@keyframes bigText{
    0%{
        opacity:0;
        transform:translate(-50%,-40%) scale(.5);
    }
    25%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.1);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-60%) scale(1.3);
    }
}

/* ================= TOAST ================= */

#toast{
    position:fixed;
    left:50%;
    bottom:35px;
    transform:translateX(-50%) translateY(20px);
    z-index:200;
    background:#111827;
    border:1px solid rgba(255,255,255,.15);
    padding:12px 20px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    font-weight:bold;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .card{
        width:70px;
        height:100px;
    }

    .cardCenter{
        font-size:38px;
    }

    .cardCorner{
        font-size:14px;
        line-height:14px;
    }

    .augment{
        width:145px;
    }

    .choiceGrid{
        grid-template-columns:repeat(2,1fr);
    }

}
</style>
</head>

<body>

<div id="game">

<header>

    <div class="title">
        ♠ AI POKER ROGUELIKE
    </div>

    <div class="stage">
        STAGE <span id="stage">1</span> / 8
    </div>

    <div class="timerBox">
        ⏱ <span id="time">45</span>초

        <div class="timer">
            <div
                class="timerBar"
                id="timerBar">
            </div>
        </div>
    </div>

</header>

<div class="table">

    <section class="enemyArea">

        <div class="areaTitle">
            <strong>🤖 AI 상대</strong>
            <span id="enemyInfo">
                패를 고르고 있습니다...
            </span>
        </div>

        <div
            class="hand"
            id="enemyHand">
        </div>

    </section>

    <section class="centerArea">

        <div id="message">
            카드 5장을 선택하세요.
        </div>

        <div
            id="taunt"
            class="taunt">
        </div>

    </section>

    <section class="playerArea">

        <div class="areaTitle">

            <strong>
                🧑 플레이어
                <span id="handCount">
                    6 / 8
                </span>
            </strong>

            <span>
                버리기
                <b id="discardCount">3</b>회
            </span>

        </div>

        <div
            class="hand"
            id="playerHand">
        </div>

    </section>

    <div class="controls">

        <button
            class="btn discard"
            id="discardBtn"
            onclick="discardSelected()">
            🗑 선택 카드 버리기
        </button>

        <button
            class="btn"
            onclick="drawCards(1)">
            🎴 1장 드로우
        </button>

        <button
            class="btn submit"
            id="submitBtn"
            onclick="submitHand()">
            ⚔️ 패 제출
        </button>

    </div>

</div>

<div class="sidePanel">

    <div class="sideTitle">

        <strong>
            ⚡ 보유 증강
        </strong>

        <span>
            클릭하여 사용
        </span>

    </div>

    <div
        class="augments"
        id="ownedAugments">
    </div>

</div>

<div
    class="result"
    id="result">

    <h2 id="resultTitle">
        결과
    </h2>

    <div class="resultHands">

        <div class="resultBox">

            <div class="handLabel">
                🧑 플레이어
            </div>

            <div
                class="handCards"
                id="resultPlayerCards">
            </div>

            <div
                class="rankResult"
                id="playerRankResult">
            </div>

        </div>

        <div class="resultBox">

            <div class="handLabel">
                🤖 AI
            </div>

            <div
                class="handCards"
                id="resultEnemyCards">
            </div>

            <div
                class="rankResult"
                id="enemyRankResult">
            </div>

        </div>

    </div>

    <div
        style="text-align:center;margin-top:20px">

        <button
            class="btn submit"
            id="nextBtn"
            onclick="nextRound()">
            다음 라운드
        </button>

    </div>

</div>

</div>

<!-- CARD / AUGMENT PICKER -->

<div
    class="overlay"
    id="pickerOverlay">

    <div class="modal">

        <h2 id="pickerTitle">
            수트 선택
        </h2>

        <div
            class="choiceGrid"
            id="pickerChoices">
        </div>

        <button
            class="btn cancelBtn"
            onclick="closePicker()">
            취소
        </button>

    </div>

</div>

<div id="toast"></div>

<script>

/* =========================================================
   STATE
========================================================= */

const state = {

    stage:1,
    maxStage:8,

    deck:[],
    hand:[],
    enemyHand:[],

    selected:[],

    discards:3,

    maxHand:8,
    startHand:6,

    time:45,
    maxTime:45,
    timer:null,

    roundActive:false,
    gameOver:false,
    enemyRevealed:false,

    ownedAugments:[],

    pendingAugment:null,
    pendingCardIndex:null,

    pendingSuitCards:[],

    pickerMode:null,
    pickerSuit:null

};


/* =========================================================
   SUITS
========================================================= */

const SUITS=[

    {
        name:"하트",
        symbol:"♥",
        color:"red"
    },

    {
        name:"다이아",
        symbol:"♦",
        color:"red"
    },

    {
        name:"클로버",
        symbol:"♣",
        color:"black"
    },

    {
        name:"스페이드",
        symbol:"♠",
        color:"black"
    }

];


/* =========================================================
   RANKS
========================================================= */

const RANKS=[

    {name:"2",value:2},
    {name:"3",value:3},
    {name:"4",value:4},
    {name:"5",value:5},
    {name:"6",value:6},
    {name:"7",value:7},
    {name:"8",value:8},
    {name:"9",value:9},
    {name:"10",value:10},
    {name:"J",value:11},
    {name:"Q",value:12},
    {name:"K",value:13},
    {name:"A",value:14}

];


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function initAudio(){

    if(!audioCtx){

        audioCtx=new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }

}

function beep(
    frequency,
    duration=.12,
    type="sine",
    volume=.04
){

    try{

        initAudio();

        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.type=type;
        osc.frequency.value=frequency;

        gain.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        osc.stop(
            audioCtx.currentTime+duration
        );

    }catch(e){}

}

function playSound(type){

    initAudio();

    if(type==="click"){
        beep(500,.06);
    }

    if(type==="draw"){

        beep(350,.07);

        setTimeout(
            ()=>beep(520,.08),
            70
        );

    }

    if(type==="submit"){

        beep(450,.08);

        setTimeout(
            ()=>beep(700,.15),
            90
        );

    }

    if(type==="augment"){

        beep(
            420,
            .08,
            "triangle"
        );

        setTimeout(
            ()=>beep(
                620,
                .1,
                "triangle"
            ),
            90
        );

        setTimeout(
            ()=>beep(
                920,
                .18,
                "triangle"
            ),
            190
        );

    }

    if(type==="win"){

        [523,659,784,1046].forEach(
            (f,i)=>{

                setTimeout(
                    ()=>beep(
                        f,
                        .2,
                        "triangle",
                        .06
                    ),
                    i*100
                );

            }
        );

    }

    if(type==="lose"){

        beep(
            220,
            .25,
            "sawtooth",
            .05
        );

        setTimeout(
            ()=>beep(
                160,
                .35,
                "sawtooth",
                .04
            ),
            220
        );

    }

}


/* =========================================================
   FX
========================================================= */

function flash(){

    const el=document.createElement("div");

    el.className="flash";

    document.body.appendChild(el);

    setTimeout(
        ()=>el.remove(),
        500
    );

}

function bigText(text){

    const el=document.createElement("div");

    el.className="bigText";

    el.textContent=text;

    document.body.appendChild(el);

    setTimeout(
        ()=>el.remove(),
        900
    );

}

function showToast(text){

    const el=document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer=setTimeout(
        ()=>{
            el.classList.remove("show");
        },
        1800
    );

}


/* =========================================================
   DECK
========================================================= */

function createDeck(){

    const deck=[];

    for(let suit=0;suit<4;suit++){

        for(let rank=2;rank<=14;rank++){

            deck.push({

                suit,
                rank,

                augmented:false,

                id:`normal-${suit}-${rank}`

            });

        }

    }

    return shuffle(deck);

}

function shuffle(arr){

    const a=[...arr];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [a[i],a[j]]=[a[j],a[i]];

    }

    return a;

}


/* =========================================================
   AUGMENTED CARD
========================================================= */

function createAugmentedCard(
    suit,
    rank
){

    return {

        suit:Number(suit),
        rank:Number(rank),

        /*
            증강으로 만들어진 카드는
            기본 덱의 카드와 독립적이다.

            따라서 ♥K가 이미 있어도
            또 ♥K를 만들 수 있다.
        */

        augmented:true,

        id:
            `aug-${Date.now()}-${Math.random()}`

    };

}


/* =========================================================
   DRAW
========================================================= */

function drawCards(amount){

    if(!state.roundActive)
        return;

    let drawn=0;

    for(let i=0;i<amount;i++){

        if(state.hand.length>=state.maxHand)
            break;

        if(state.deck.length===0)
            break;

        state.hand.push(
            state.deck.pop()
        );

        drawn++;

    }

    if(drawn>0){

        playSound("draw");

        showToast(
            `🎴 ${drawn}장 드로우!`
        );

    }

    sortHand();
    render();

}


/* =========================================================
   SORT
========================================================= */

function sortHand(){

    state.hand.sort(
        (a,b)=>{

            if(a.rank!==b.rank){
                return a.rank-b.rank;
            }

            return a.suit-b.suit;

        }
    );

}


/* =========================================================
   CARD HTML
========================================================= */

function cardHTML(card,index,enemy=false){

    const suit=SUITS[card.suit];

    const rank=RANKS.find(
        r=>r.value===card.rank
    );

    const selected=
        !enemy &&
        state.selected.includes(index)
        ? "selected"
        : "";

    return `

        <div
            class="card ${suit.color} ${selected}"
            onclick="${
                enemy
                ? ""
                : `toggleCard(${index})`
            }"
        >

            <div class="cardCorner">

                <div>${rank.name}</div>

                <div>${suit.symbol}</div>

            </div>

            <div class="cardCenter">
                ${suit.symbol}
            </div>

            ${
                card.augmented
                ?
                `<div class="cardAug">
                    ⚡ AUG
                 </div>`
                :
                ""
            }

        </div>

    `;

}


function renderPlayerHand(){

    const box=
        document.getElementById("playerHand");

    box.innerHTML=
        state.hand
        .map(
            (card,index)=>
                cardHTML(
                    card,
                    index,
                    false
                )
        )
        .join("");

}


function renderEnemyHand(){

    const box=
        document.getElementById("enemyHand");

    if(!state.enemyRevealed){

        box.innerHTML=
            state.enemyHand
            .map(
                ()=>`

                    <div
                        class="card"
                        style="
                            background:
                            repeating-linear-gradient(
                                45deg,
                                #253451,
                                #253451 10px,
                                #18243a 10px,
                                #18243a 20px
                            );
                            border-color:#62708b;
                            cursor:default;
                        "
                    ></div>

                `
            )
            .join("");

    }else{

        box.innerHTML=
            state.enemyHand
            .map(
                (card,index)=>
                    cardHTML(
                        card,
                        index,
                        true
                    )

   POKER
========================================================= */

const HAND_NAMES=[

    "하이 카드",
    "원 페어",
    "투 페어",
    "트리플",
    "스트레이트",
    "플러시",
    "풀 하우스",
    "포카드",
    "스트레이트 플러시"

];


/*
    정확히 5장을 평가한다.
*/

function evaluateFive(cards){

    if(!cards || cards.length!==5){

        return {
            rank:-1,
            values:[],
            name:"5장 필요",
            cards:[]
        };

    }

    const ranks=
        cards
        .map(c=>Number(c.rank))
        .sort((a,b)=>b-a);

    const counts={};

    ranks.forEach(
        rank=>{
            counts[rank]=
                (counts[rank]||0)+1;
        }
    );

    const groups=
        Object.entries(counts)
        .map(
            ([rank,count])=>({

                rank:Number(rank),
                count

            })
        )
        .sort(
            (a,b)=>{

                if(b.count!==a.count){
                    return b.count-a.count;
                }

                return b.rank-a.rank;

            }
        );

    /*
        ★ 플러시 판정
        카드 5장의 suit가 모두 같아야 한다.
    */

    const firstSuit=
        Number(cards[0].suit);

    const flush=
        cards.every(
            card=>
                Number(card.suit)===firstSuit
        );

    /*
        스트레이트 판정
    */

    const unique=[
        ...new Set(ranks)
    ];

    let straight=false;
    let straightHigh=0;

    if(unique.length===5){

        /*
            일반 스트레이트
            예: A K Q J 10
            14 - 10 = 4
        */

        if(
            unique[0]-unique[4]===4
        ){

            straight=true;
            straightHigh=unique[0];

        }

        /*
            휠 스트레이트
            A 2 3 4 5
        */

        if(
            unique[0]===14 &&
            unique[1]===5 &&
            unique[2]===4 &&
            unique[3]===3 &&
            unique[4]===2
        ){

            straight=true;
            straightHigh=5;

        }

    }

    /*
        ★ 가장 먼저 스트레이트 플러시
    */

    if(straight && flush){

        return {

            rank:8,

            values:[straightHigh],

            name:HAND_NAMES[8],

            cards:[...cards]

        };

    }

    /*
        포카드
    */

    if(groups[0].count===4){

        return {

            rank:7,

            values:[
                groups[0].rank,
                groups[1].rank
            ],

            name:HAND_NAMES[7],

            cards:[...cards]

        };

    }

    /*
        풀하우스
    */

    if(
        groups[0].count===3 &&
        groups[1].count===2
    ){

        return {

            rank:6,

            values:[
                groups[0].rank,
                groups[1].rank
            ],

            name:HAND_NAMES[6],

            cards:[...cards]

        };

    }

    /*
        ★ 플러시
    */

    if(flush){

        return {

            rank:5,

            /*
                플러시는 높은 카드부터
                하나씩 비교
            */

            values:[...ranks],

            name:HAND_NAMES[5],

            cards:[...cards]

        };

    }

    /*
        스트레이트
    */

    if(straight){

        return {

            rank:4,

            values:[straightHigh],

            name:HAND_NAMES[4],

            cards:[...cards]

        };

    }

    /*
        트리플
    */

    if(groups[0].count===3){

        return {

            rank:3,

            values:[

                groups[0].rank,

                ...groups
                    .filter(
                        g=>g.count===1
                    )
                    .map(
                        g=>g.rank
                    )
                    .sort(
                        (a,b)=>b-a
                    )

            ],

            name:HAND_NAMES[3],

            cards:[...cards]

        };

    }

    /*
        투페어
    */

    const pairs=
        groups
        .filter(
            g=>g.count===2
        )
        .sort(
            (a,b)=>b.rank-a.rank
        );

    if(pairs.length===2){

        const kicker=
            groups.find(
                g=>g.count===1
            );

        return {

            rank:2,

            values:[

                pairs[0].rank,
                pairs[1].rank,
                kicker ? kicker.rank : 0

            ],

            name:HAND_NAMES[2],

            cards:[...cards]

        };

    }

    /*
        원페어
    */

    if(pairs.length===1){

        return {

            rank:1,

            values:[

                pairs[0].rank,

                ...groups
                    .filter(
                        g=>g.count===1
                    )
                    .map(
                        g=>g.rank
                    )
                    .sort(
                        (a,b)=>b-a
                    )

            ],

            name:HAND_NAMES[1],

            cards:[...cards]

        };

    }

    /*
        하이카드
    */

    return {

        rank:0,

        values:[...ranks],

        name:HAND_NAMES[0],

        cards:[...cards]

    };

}


/*
    6~8장 중 가장 강한 5장 조합
*/

function evaluateHand(cards){

    if(!cards || cards.length<5){

        return {

            rank:-1,
            values:[],
            name:"5장을 선택해야 합니다.",
            cards:[]

        };

    }

    let best=null;

    for(let a=0;a<cards.length-4;a++){

        for(let b=a+1;b<cards.length-3;b++){

            for(let c=b+1;c<cards.length-2;c++){

                for(let d=c+1;d<cards.length-1;d++){

                    for(let e=d+1;e<cards.length;e++){

                        const five=[

                            cards[a],
                            cards[b],
                            cards[c],
                            cards[d],
                            cards[e]

                        ];

                        const result=
                            evaluateFive(five);

                        if(
                            !best ||
                            compareRanks(
                                result,
                                best
                            )>0
                        ){

                            best={
                                ...result,
                                cards:[...five]
                            };

                        }

                    }

                }

            }

        }

    }

    return best;

}


/* =========================================================
   COMPARISON
========================================================= */

function compareRanks(a,b){

    if(a.rank!==b.rank){

        return a.rank-b.rank;

    }

    const length=
        Math.max(
            a.values.length,
            b.values.length
        );

    for(
        let i=0;
        i<length;
        i++
    ){

        const av=a.values[i]||0;
        const bv=b.values[i]||0;

        if(av!==bv){

            return av-bv;

        }

    }

    return 0;

}


/* =========================================================
   AI
========================================================= */

function createEnemyHand(){

    state.enemyHand=[];

    for(let i=0;i<6;i++){

        if(state.deck.length===0)
            break;

        state.enemyHand.push(
            state.deck.pop()
        );

    }

    aiImproveHand();

}


function aiImproveHand(){

    const difficulty=state.stage;

    let best=
        evaluateHand(
            state.enemyHand
        );

    const attempts=
        Math.min(
            difficulty,
            6
        );

    for(
        let i=0;
        i<attempts;
        i++
    ){

        if(
            Math.random() >
            .35 + difficulty*.06
        ){

            continue;

        }

        if(
            state.enemyHand.length>=8
        ){

            break;

        }

        if(state.deck.length===0)
            break;

        const sorted=
            [...state.enemyHand]
            .sort(
                (a,b)=>a.rank-b.rank
            );

        if(sorted.length===0)
            break;

        const weak=sorted[0];

        const index=
            state.enemyHand.indexOf(
                weak
            );

        if(index===-1)
            continue;

        state.enemyHand.splice(
            index,
            1
        );

        state.enemyHand.push(
            state.deck.pop()
        );

        const next=
            evaluateHand(
                state.enemyHand
            );

        if(
            compareRanks(
                next,
                best
            )>0
        ){

            best=next;

        }

    }

}

function submitHand(){

    if(!state.roundActive)
        return;

    if(state.pendingAugment){

        showToast(
            "현재 사용 중인 증강을 먼저 완료하세요."
        );

        return;

    }

    if(state.selected.length!==5){

        showToast(
            "정확히 5장의 카드를 선택하세요."
        );

        return;

    }

    clearInterval(state.timer);

    state.roundActive=false;

    playSound("submit");

    state.enemyRevealed=true;

    const playerCards=
        state.selected.map(
            i=>state.hand[i]
        );

    /*
        플레이어는 선택한 정확히 5장
    */

    const playerResult=
        evaluateFive(
            playerCards
        );

    /*
        AI는 6~8장 중 최고의 5장
    */

    const enemyResult=
        evaluateHand(
            state.enemyHand
        );

    render();

    showResult(
        playerCards,
        playerResult,
        enemyResult
    );

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    playerCards,
    playerResult,
    enemyResult
){

    const result=
        document.getElementById("result");

    result.classList.add("show");

    document.getElementById(
        "resultPlayerCards"
    ).innerHTML=
        playerCards
        .map(
            c=>miniCardHTML(c)
        )
        .join("");

    document.getElementById(
        "resultEnemyCards"
    ).innerHTML=
        enemyResult.cards
        .map(
            c=>miniCardHTML(c)
        )
        .join("");

    document.getElementById(
        "playerRankResult"
    ).textContent=
        playerResult.name;

    document.getElementById(
        "enemyRankResult"
    ).textContent=
        enemyResult.name;

    const comparison=
        compareRanks(
            playerResult,
            enemyResult
        );

    const title=
        document.getElementById(
            "resultTitle"
        );

    if(comparison>0){

        title.textContent=
            "🏆 플레이어 승리!";

        playSound("win");

        flash();

        bigText(
            playerResult.name
        );

        document.getElementById(
            "nextBtn"
        ).style.display=
            "inline-block";

    }else{

        title.textContent=
            "💀 패배...";

        playSound("lose");

        flash();

        bigText("GAME OVER");

        document.getElementById(
            "nextBtn"
        ).textContent=
            "처음부터 다시";

    }

}


function miniCardHTML(card){

    const suit=SUITS[card.suit];

    const rank=RANKS.find(
        r=>r.value===card.rank
    );

    return `

        <div
            class="miniCard ${suit.color}"
        >

            <div>
                ${rank.name}
            </div>

            <div style="font-size:25px">
                ${suit.symbol}
            </div>

        </div>

    `;

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

    const playerResult=
        evaluateFive(
            state.selected.map(
                i=>state.hand[i]
            )
        );

    const enemyResult=
        evaluateHand(
            state.enemyHand
        );

    if(
        compareRanks(
            playerResult,
            enemyResult
        )<=0
    ){

        restartGame();

        return;

    }

    if(state.stage>=state.maxStage){

        alert(
            "🎉 8단계 클리어!\n\n축하합니다!"
        );

        restartGame();

        return;

    }

    state.stage++;

    /*
        다음 라운드에서는
        모든 보유 증강이 다시 사용 가능
    */

    resetAugmentsForNewRound();

    document.getElementById(
        "result"
    ).classList.remove("show");

    startRound();

}

function chooseAugment(id){

    const source=
        AUGMENT_POOL.find(
            a=>a.id===id
        );

    if(!source)
        return;

    /*
        중복 획득 방지
    */

    if(
        state.ownedAugments.some(
            a=>a.id===id
        )
    ){

        showToast(
            "이미 보유한 증강입니다."
        );

        return;

    }

    const augment={
        ...source,
        usedThisRound:false
    };

    state.ownedAugments.push(
        augment
    );

    closePicker();

    playSound("augment");

    showToast(
        `⚡ ${augment.name} 획득!`
    );

    renderAugments();

}


/* =========================================================
   USE AUGMENT
========================================================= */

function useAugment(index){

    if(!state.roundActive)
        return;

    /*
        이미 다른 증강을 진행 중이면
        다른 증강을 눌러 상태를 덮어쓰지 못하게 한다.
    */

    if(state.pendingAugment){

        showToast(
            "현재 사용 중인 증강을 먼저 완료하세요."
        );

        return;

    }

    const augment=
        state.ownedAugments[index];

    if(!augment)
        return;

    if(augment.usedThisRound){

        showToast(
            `${augment.name}은 이번 라운드에 이미 사용했습니다.`
        );

        return;

    }

    /*
        성공할 때까지 usedThisRound는 false.
    */

    state.pendingAugment=augment;

    augment.action();

}


/* =========================================================
   CONSUME AUGMENT
========================================================= */

function consumePendingAugment(){

    if(!state.pendingAugment)
        return;

    const augment=
        state.pendingAugment;

    /*
        ★ 실제 사용 성공한 경우에만
        이번 라운드 사용 완료 처리
    */

    augment.usedThisRound=true;

    state.pendingAugment=null;

    state.pendingCardIndex=null;
    state.pendingSuitCards=[];
    state.pickerSuit=null;

    playSound("augment");

    renderAugments();

}


/* =========================================================
   RESET
========================================================= */

function resetAugmentsForNewRound(){

    state.ownedAugments.forEach(
        augment=>{
            augment.usedThisRound=false;
        }
    );

    state.pendingAugment=null;
    state.pendingCardIndex=null;
    state.pendingSuitCards=[];
    state.pickerSuit=null;

}


/* =========================================================
   AUGMENT UI
========================================================= */

function renderAugments(){

    const box=
        document.getElementById(
            "ownedAugments"
        );

    box.innerHTML="";

    state.ownedAugments.forEach(
        (augment,index)=>{

            const div=
                document.createElement("div");

            div.className=
                `augment tier-${augment.tier}
                 ${
                    augment.usedThisRound
                    ? "used"
                    : ""
                 }`;

            div.innerHTML=`

                <div class="augmentName">

                    ${tierName(augment.tier)}
                    · ${augment.name}

                </div>

                <div class="augmentStatus">

                    ${
                        augment.usedThisRound
                        ?
                        "✓ 이번 라운드 사용완료"
                        :
                        "⚡ 이번 라운드 사용 가능"
                    }

                </div>

                <div class="tooltip">

                    <strong>
                        ${augment.name}
                    </strong>

                    <br><br>

                    ${augment.desc}

                    <br><br>

                    ${
                        augment.usedThisRound
                        ?
                        "이번 라운드에는 다시 사용할 수 없습니다."
                        :
                        "클릭해서 사용합니다."
                    }

                </div>

            `;

            /*
                이미 사용한 증강은
                클릭해도 다시 action을 실행하지 않는다.
            */

            div.onclick=()=>{

                if(augment.usedThisRound){

                    showToast(
                        `${augment.name}은 이번 라운드에 이미 사용했습니다.`
                    );

                    return;

                }

                useAugment(index);

            };

            box.appendChild(div);

        }
    );

}


function tierName(tier){

    if(tier==="silver")
        return "SILVER";

    if(tier==="gold")
        return "GOLD";

    return "PLATINUM";

}


/* =========================================================
   PICKER
========================================================= */

/*
    모든 카드 변경은

    1. 수트 선택
    2. 숫자 선택
    3. 카드 생성

    순서로 진행한다.

    키보드 입력은 전혀 사용하지 않는다.
*/

function openSuitPicker(mode="suitOnly"){

    state.pickerMode=mode;

    const overlay=
        document.getElementById(
            "pickerOverlay"
        );

    const title=
        document.getElementById(
            "pickerTitle"
        );

    const box=
        document.getElementById(
            "pickerChoices"
        );

    title.textContent=
        "수트를 선택하세요";

    box.innerHTML="";

    SUITS.forEach(
        (suit,index)=>{

            const button=
                document.createElement("button");

            button.className=
                `choiceBtn ${suit.color}`;

            button.innerHTML=`

                ${suit.symbol}<br>

                <span
                    style="
                        font-size:12px
                    "
                >
                    ${suit.name}
                </span>

            `;

            button.onclick=()=>{

                playSound("click");

                /*
                    실버 수트 변경
                    → 수트 선택만
                */

                if(mode==="suitOnly"){

                    applySuitOnlyChange(index);

                    return;

                }

                /*
                    두 장 수트 변경
                    → 수트만 선택
                */

                if(mode==="twoSuit"){

                    applyTwoSuitChange(index);

                    return;

                }

                /*
                    카드 재구성 / 와일드
                    → 수트 선택 후
                    숫자 선택
                */

                state.pickerSuit=index;

                openRankPicker();

            };

            box.appendChild(button);

        }
    );

    overlay.style.display="flex";

}


/* =========================================================
   RANK PICKER
========================================================= */

function openRankPicker(){

    const title=
        document.getElementById(
            "pickerTitle"
        );

    const box=
        document.getElementById(
            "pickerChoices"
        );

    title.textContent=
        "숫자를 선택하세요";

    box.innerHTML="";

    RANKS.forEach(
        rank=>{

            const button=
                document.createElement("button");

            button.className=
                "choiceBtn";

            button.innerHTML=`

                ${rank.name}
                ${SUITS[state.pickerSuit].symbol}

            `;

            button.onclick=()=>{

                playSound("click");

                /*
                    수트 + 숫자를 모두 선택했으므로
                    여기서 실제 카드를 생성한다.
                */

                applyCardReplacement(
                    state.pickerSuit,
                    rank.value
                );

            };

            box.appendChild(button);

        }
    );

}


/* =========================================================
   SUIT ONLY CHANGE
========================================================= */

function applySuitOnlyChange(
    suitIndex
){

    const index=
        state.pendingCardIndex;

    if(
        index===null ||
        !state.hand[index]
    ){

        state.pendingAugment=null;

        closePicker();

        return;

    }

    const oldCard=
        state.hand[index];

    /*
        숫자는 그대로 유지.
        수트만 새로 선택한 수트로 변경.
    */

    state.hand[index]=
        createAugmentedCard(
            suitIndex,
            oldCard.rank
        );

    state.selected=[];

    closePicker();

    sortHand();

    consumePendingAugment();

    render();

    showToast(
        `⚡ ${RANKS.find(r=>r.value===oldCard.rank).name}${SUITS[suitIndex].symbol}로 변경!`
    );

}


/* =========================================================
   CARD REPLACEMENT
========================================================= */

function applyCardReplacement(
    suitIndex,
    rankValue
){

    const index=
        state.pendingCardIndex;

    if(
        index===null ||
        !state.hand[index]
    ){

        state.pendingAugment=null;

        closePicker();

        return;

    }

    /*
        ★ 핵심
        선택한 수트 + 선택한 숫자로
        완전히 새로운 증강 카드를 생성한다.

        기본 덱에 같은 카드가 있어도
        증강 카드이므로 허용.
    */

    state.hand[index]=
        createAugmentedCard(
            suitIndex,
            rankValue
        );

    state.selected=[];

    state.pendingCardIndex=null;
    state.pickerSuit=null;

    closePicker();

    sortHand();

    /*
        실제 카드 생성이 완료된 뒤에만
        증강을 사용 완료 처리한다.
    */

    consumePendingAugment();

    render();

    const rank=
        RANKS.find(
            r=>r.value===rankValue
        );

    showToast(
        `⚡ ${rank.name}${SUITS[suitIndex].symbol} 카드 생성!`
    );

}


/* =========================================================
   TWO SUIT CHANGE
========================================================= */

function applyTwoSuitChange(
    suitIndex
){

    const indices=
        state.pendingSuitCards;

    if(
        !indices ||
        indices.length!==2
    ){

        state.pendingAugment=null;

        closePicker();

        return;

    }

    let changed=0;

    indices.forEach(
        index=>{

            const card=
                state.hand[index];

            if(card){

                /*
                    기존 숫자 유지
                    수트만 변경
                */

                state.hand[index]=
                    createAugmentedCard(
                        suitIndex,
                        card.rank
                    );

                changed++;

            }

        }
    );

    if(changed!==2){

        state.pendingAugment=null;

        closePicker();

        return;

    }

    state.pendingSuitCards=[];
    state.selected=[];

    closePicker();

    sortHand();

    consumePendingAugment();

    render();

    showToast(
        `💎 두 장의 수트를 ${SUITS[suitIndex].name}으로 변경!`
    );

}


/* =========================================================
   CLOSE PICKER
========================================================= */

function closePicker(){

    document.getElementById(
        "pickerOverlay"
    ).style.display="none";

    state.pickerMode=null;

    /*
        취소했을 때는
        pendingAugment를 사용 완료 처리하지 않는다.

        다시 사용할 수 있도록
        현재 선택 작업만 정리한다.
    */

    state.pendingCardIndex=null;
    state.pendingSuitCards=[];
    state.pickerSuit=null;

    /*
        단, 실제 증강 자체는 아직
        사용되지 않은 상태다.
    */

}


/*
    취소 버튼 때문에 pendingAugment까지
    날려버리면 다시 클릭 가능하다.
    따라서 closePicker에서 pendingAugment는
    건드리지 않는다.
*/


/* =========================================================
   ROUND START
========================================================= */

function startRound(){

    clearInterval(state.timer);

    resetAugmentsForNewRound();

    state.deck=createDeck();

    state.hand=[];
    state.enemyHand=[];

    state.selected=[];

    state.discards=3;

    state.time=state.maxTime;

    state.enemyRevealed=false;

    state.roundActive=true;

    state.pendingCardIndex=null;
    state.pendingSuitCards=[];
    state.pendingAugment=null;

    drawInitialCards();

    createEnemyHand();

    document.getElementById(
        "result"
    ).classList.remove("show");

    document.getElementById(
        "message"
    ).textContent=
        "카드 5장을 선택하세요.";

    document.getElementById(
        "nextBtn"
    ).textContent=
        "다음 라운드";

    document.getElementById(
        "nextBtn"
    ).style.display=
        "inline-block";

    render();

    startTimer();

}


/* =========================================================
   INITIAL DRAW
========================================================= */

function drawInitialCards(){

    for(
        let i=0;
        i<state.startHand;
        i++
    ){

        if(state.deck.length===0)
            break;

        state.hand.push(
            state.deck.pop()
        );

    }

    sortHand();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(state.timer);

    state.time=state.maxTime;

    updateTimer();

    state.timer=
        setInterval(
            ()=>{

                if(!state.roundActive)
                    return;

                state.time--;

                updateTimer();

                if(state.time===10){

                    showTaunt(
                        "카드 5장 고르는 게 그렇게 어렵나?"
                    );

                }

                if(state.time<=0){

                    clearInterval(
                        state.timer
                    );

                    timeoutLose();

                }

            },
            1000
        );

}


function updateTimer(){

    document.getElementById(
        "time"
    ).textContent=
        Math.max(
            0,
            state.time
        );

    const percent=
        Math.max(
            0,
            state.time/state.maxTime*100
        );

    document.getElementById(
        "timerBar"
    ).style.width=
        percent+"%";

}


/* =========================================================
   TIMEOUT
========================================================= */

function timeoutLose(){

    state.roundActive=false;

    state.enemyRevealed=true;

    showToast(
        "⏰ 시간이 끝났습니다."
    );

    playSound("lose");

    flash();

    bigText("TIME OVER");

    render();

    showResult(

        state.selected.map(
            i=>state.hand[i]
        ),

        state.selected.length===5
        ?
        evaluateFive(
            state.selected.map(
                i=>state.hand[i]
            )
        )
        :
        {
            rank:-1,
            values:[],
            name:"패 제출 실패",
            cards:[]
        },

        evaluateHand(
            state.enemyHand
        )

    );

}


/* =========================================================
   TAUNT
========================================================= */

function showTaunt(text){

    const el=
        document.getElementById(
            "taunt"
        );

    el.textContent=text;

    el.classList.remove("taunt");

    void el.offsetWidth;

    el.classList.add("taunt");

}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    clearInterval(state.timer);

    state.stage=1;

    state.ownedAugments=[];

    state.gameOver=false;

    state.roundActive=false;

    state.pendingAugment=null;

    state.pendingCardIndex=null;
    state.pendingSuitCards=[];
    state.pickerSuit=null;

    closePicker();

    document.getElementById(
        "result"
    ).classList.remove("show");

    startRound();

    showToast(
        "🔄 처음부터 다시 시작합니다."
    );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    renderPlayerHand();

    renderEnemyHand();

    renderAugments();

    document.getElementById(
        "stage"
    ).textContent=
        state.stage;

    document.getElementById(
        "handCount"
    ).textContent=
        `${state.hand.length} / ${state.maxHand}`;

    document.getElementById(
        "discardCount"
    ).textContent=
        state.discards;

    document.getElementById(
        "enemyInfo"
    ).textContent=
        state.enemyRevealed
        ? "패 공개"
        : "패를 고르는 중";

    document.getElementById(
        "discardBtn"
    ).disabled=
        !state.roundActive ||
        state.discards<=0 ||
        !!state.pendingAugment;

    document.getElementById(
        "submitBtn"
    ).disabled=
        !state.roundActive ||
        state.selected.length!==5 ||
        !!state.pendingAugment;

}


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "click",
    ()=>{
        initAudio();
    },
    {once:true}
);

startRound();

</script>
